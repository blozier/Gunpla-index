  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    if (e.target && e.target !== window && e.target.tagName) return; // resource load noise (img/font) — not a bundle error
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

(--orange-ink);margin-left:5px}\n@media(max-width:520px){\n  .refpage .ref-row{grid-template-columns:84px 32px minmax(96px,1fr) minmax(84px,1fr) 46px;gap:8px}\n  .refpage .ref-thumb{width:84px;height:64px}\n  .refpage .ref-name{font-size:14px}\n  .refpage .ref-tl,.refpage .ref-scale,.refpage .ref-head span{font-size:9.5px}\n}\n<\/style>\n<\/head>\n<body>\n\n\n\n<nav class=\"tabs\" role=\"tablist\" aria-label=\"Sections\">\n  <div class=\"wrap\">\n    <button class=\"tab\" role=\"tab\" data-view=\"collection\" aria-selected=\"true\">Collection<span class=\"tc\" id=\"tabCountCollection\"><\/span><\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"wishlist\" aria-selected=\"false\">Wishlist<span class=\"tc\" id=\"tabCountWishlist\"><\/span><\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"reference\" aria-selected=\"false\">Reference<span class=\"tc\" id=\"tabCountReference\"><\/span><\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"paint\" aria-selected=\"false\">Paint &amp; Supplies<span class=\"tc\" id=\"tabCountPaint\"><\/span><\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"workshop\" aria-selected=\"false\">Workshop<\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"method\" aria-selected=\"false\">Method<\/button>\n    <button class=\"tab\" role=\"tab\" data-view=\"timeline\" aria-selected=\"false\">Timeline<\/button>\n<button class=\"tab\" role=\"tab\" data-view=\"manga\" aria-selected=\"false\">Manga<\/button>\n<button class=\"tab\" role=\"tab\" data-view=\"misc\" aria-selected=\"false\">Misc<span class=\"tc\" id=\"tabCountMisc\"><\/span><\/button>\n  <\/div>\n<\/nav>\n\n<header class=\"mast\">\n  <div class=\"wrap\">\n    <div class=\"mast-top\">\n      <div>\n        <div class=\"mast-code\">Plamo Reference Sheet · Rev. 23 / 2026<\/div>\n        <h1>Build <span class=\"acc\">Index<\/span><\/h1>\n        <p class=\"lede\">Your Gunpla command sheet — the kits you own, the next-to-buy wishlist, and t ox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Full-size image\" hidden=\"\">\n  <button id=\"lbClose\" aria-label=\"Close\">×<\/button>\n  <img id=\"lbImg\" alt=\"\">\n  <div id=\"lbCaption\"><\/div>\n<\/div>\n\n<section class=\"paintshelf\" id=\"paintView\">\n  <div class=\"wrap\">\n    <div class=\"paint-head\">\n      <div>\n        <div class=\"mast-code\">Paint Shelf · what's on hand<\/div>\n        <h2 class=\"paint-title\">Paint <span class=\"acc\">Shelf<\/span><\/h2>\n      <\/div>\n      <div class=\"paint-count\"><span id=\"paintBottleNum\">0<\/span> bottles · <span id=\"paintColorNum\">0<\/span> items<\/div>\n    <\/div>\n    <div id=\"paintGrid\"><\/div>\n    <div id=\"paintCoverage\"><\/div>\n    <div id=\"paintBuyList\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"refpage\" id=\"referenceView\" style=\"display:none\">\n  <div class=\"wrap\">\n    <div class=\"paint-head\">\n      <div>\n        <div class=\"mast-code\">Reference &middot; status of every kit<\/div>\n        <h2 class=\"paint-title\">Collection <span class=\"acc\">Index<\/span><\/h2>\n      <\/div>\n      <div class=\"paint-count\" id=\"refSummary\"><\/div>\n    <\/div>\n    <p class=\"ref-lede\">Every kit on the shelf, on the wishlist, or on the radar &mdash; grouped by where it stands. \"Reference\" kits are ones being considered but not yet committed to the wishlist.<\/p>\n    <div id=\"referenceBody\"><\/div>\n  <\/div>\n<\/section>\n\n\n<section id=\"methodView\" style=\"display:none\"><style>#methodView{\n  --paper:#FCFCFA;\n  --ink:#16181D;\n  --ink-soft:#3A3F49;\n  --ink-faint:#7A8090;\n  --rule:#D8DAE0;\n  --steel:#2B4C7E;\n  --steel-lt:#E7EDF6;\n  --safety:#D9480F;\n  --safety-lt:#FDF0E8;\n  --mono:'IBM Plex Mono',monospace;\n  --disp:'Archivo',sans-serif;\n  --body:'Public Sans',sans-serif;\n}\n#methodView *{box-sizing:border-box;margin:0;padding:0}\n#methodView{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}\n#m methodView figure svg{width:100%;height:auto;display:block;border:1.5px solid var(--ink);background:#fff}\n#methodView figcaption{font-family:var(--mono);font-size:12px;color:var(--ink-faint);padding-top:8px}\n#methodView figcaption b{color:var(--steel)}\n#methodView table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:14.5px}\n#methodView caption{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding-bottom:8px}\n#methodView th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--ink);border-bottom:2px solid var(--ink);padding:8px 10px 8px 0}\n#methodView td{border-bottom:1px solid var(--rule);padding:9px 10px 9px 0;vertical-align:top;color:var(--ink-soft)}\n#methodView td:first-child,#methodView th:first-child{padding-left:0}\n#methodView tr:last-child td{border-bottom:none}\n#methodView .num{font-family:var(--mono);white-space:nowrap}\n#methodView .money{font-family:var(--mono);text-align:right;white-space:nowrap}\n#methodView th.money{text-align:right}\n#methodView tfoot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:600;color:var(--ink)}\n#methodView .step{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid var(--rule)}\n#methodView .step:last-child{border-bottom:none}\n#methodView .step .n{font-family:var(--disp);font-weight:900;font-size:34px;color:var(--steel);line-height:1}\n#methodView .step h3{font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}\n#methodView .step p{margin-bottom:8px;font-size:15px}\n#methodView .step p:last-child{margin-bottom:0}\n#methodView .safety{background:var(--safety-lt);border:2px solid var(--safety);padding:22px 24px;margin:30px 0}\n#methodView .safety h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:20px;color:var(--safety);margin-bottom:12px;display:flex;align-items:center;gap:10px}\n#methodView .safety ul{list-style:none}\n#methodView .safety li{padding:7px 0 7px 26px;position:relative;color:var(--ink-soft);font-size:15px}\n#methodView .safety li::before{content:\"\";position:absolute;left:2px;top:14px;width:12px;height:12px;background:var(--safety);clip-path:polygon(50% 0,100% 100%,0 100%)}\n#methodView .safety b{color:var(--ink)}\n#methodView ul.plain{margin:0 0 16px 2px;list-style:none}\n#methodView ul.plain li{padding:5px 0 5px 20px;position:relative;color:var(--ink-soft)}\n#methodView ul.plain li::before{content:\"—\";position:absolute;left:0;color:var(--steel);font-family:var(--mono)}\n#methodView footer{border-top:3px solid var(--ink);margin-top:52px;padding:22px 0 46px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}\n@media(max-width:560px){#methodView .step{grid-template-columns:44px 1fr;gap:12px}\n#methodView .step .n{font-size:26px}\n#methodView .specline div{flex:1 1 46%}}\n@media print{#methodView header,#methodView section,#methodView figure{break-inside:avoid-page}\n#methodView{font-size:13px}}<\/style>\n<header>\n  <div class=\"wrap\">\n    <div class=\"brand\">GUNPLABILL<b>.COM<\/b> &nbsp;·&nbsp; METHOD &#8470; 001 · REV A<\/div>\n    <h1>Assemble ·<br>Panel Line · Paint<\/h1>\n    <p class=\"dek\">The order of operations for a full paint build, tuned to your factory-fresh satin finish with dense technical decals. One rule settles almost every \"what goes first\" question: <b>gloss enables, the final clear seals.<\/b><\/p>\n    <div class=\"specline\">\n      <div><span class=\"k\">Workflows<\/span><div class=\"v\">2 paths<\/div><\/div>\n      <div><span class=\"k\">Core rule<\/span><div class=\"v\">Gloss enables<\/div><\/div>\n      <div><span class=\"k\">Your finish<\/span><div class=\"v\">Factory satin<\/div><\/div>\n      <div><span class=\"k\">Wash<\/span><div class=\"v\">Enamel / oil<\/div><\/div>\n      <div><span class=\"k\">Paint<\/span><div class=\"v\">Mr. Color<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<div class=\"wrap\">\n\n<section id=\"m-rule\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 01<\/span><h2>The One Rule<\/h2><\/div>\n  <p><b>Gloss enables; the final clear seals.<\/b> A glossy surface is what lets an enamel or oil panel wash flow into the recesses and wipe cleanly off the raised surface, and it's what lets a waterslide decal sit down without trapping air and silvering. So gloss goes on <b>before<\/b> washing and decaling. Your final clear &mdash; a <b>satin<\/b> for the factory-fresh look you build toward &mdash; goes on dead last to lock everything underneath and unify the sheen.<\/p>\n  <p class=\"note\">Hold onto that and the sequence stops fighting you: paint &#8594; gloss &#8594; decals &#8594; wash &#8594; satin. Everything else is prep and reassembly around that spine.<\/p>\n  <figure>\n    <svg viewBox=\"0 0 860 250\" role=\"img\" aria-label=\"Layer stack from plastic up to satin clear\">\n      <g font-family=\"IBM Plex Mono\" font-size=\"12\" fill=\"#7A8090\">\n      <rect x=\"150\" y=\"196\" width=\"560\" height=\"34\" fill=\"#E7EDF6\" stroke=\"#16181D\" stroke-width=\"2\"/><text x=\"430\" y=\"218\" text-anchor=\"middle\" fill=\"#16181D\" font-weight=\"700\">BARE PLASTIC · seams filled, mold release washed<\/text>\n      <rect x=\"150\" y=\"158\" width=\"560\" height=\"34\" fill=\"#D8DAE0\" stroke=\"#16181D\" stroke-width=\"2\"/><text x=\"430\" y=\"180\" text-anchor=\"middle\" fill=\"#16181D\" font-weight=\"700\">PRIMER<\/text>\n      <rect x=\"150\" y=\"120\" width=\"560\" height=\"34\" fill=\"#F4F6FA\" stroke=\"#16181D\" stroke-width=\"2\"/><text x=\"430\" y=\"142\" text-anchor=\"middle\" fill=\"#16181D\" font-weight=\"700\">BASE COLOR · Mr. Color lacquer<\/text>\n      <rect x=\"150\" y=\"82\" width=\"560\" height=\"34\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"2\"/><text x=\"430\" y=\"104\" text-anchor=\"middle\" fill=\"#2B4C7E\" font-weight=\"700\">GLOSS CLEAR &#9660; enables wash + decals<\/text>\n      <rect x=\"150\" y=\"44\" width=\"560\" height=\"34\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><text x=\"430\" y=\"66\" text-anchor=\"middle\" fill=\"#2B4C7E\" font-weight=\"700\">DECALS &#8594; PANEL WASH<\/text>\n      <rect x=\"150\" y=\"6\" width=\"560\" height=\"34\" fill=\"#FDF0E8\" stroke=\"#D9480F\" stroke-width=\"2\"/><text x=\"430\" y=\"28\" text-anchor=\"middle\" fill=\"#D9480F\" font-weight=\"700\">SATIN CLEAR &#9650; seals everything<\/text>\n      <\/g>\n    <\/svg>\n    <figcaption><b>FIG 01<\/b> &nbsp; The finish stack, bottom to top. Gloss is a working layer, not a look; the satin on top is the only sheen you see.<\/figcaption>\n  <\/figure>\n<\/section>\n\n<section id=\"m-paths\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 02<\/span><h2>Two Workflows<\/h2><\/div>\n  <p>Most confusion comes from blending two different schools. Decide which build this is before you start.<\/p>\n  <p><b>School A &mdash; paint before assembly.<\/b> Paint parts on the runner or loose, then assemble. Fast, but you fight touch-ups where painted parts rub and snap.<\/p>\n  <p><b>School B &mdash; build first, then disassemble.<\/b> Assemble the whole kit, verify fit and posing, then take it back down to single-color subassemblies to paint. This is <b>your<\/b> method, and it's the right call for a clean satin result: you catch every seam and stress point up front and paint subassemblies that go back together without marring.<\/p>\n<\/section>\n\n<section id=\"m-full\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 03<\/span><h2>Full Paint Sequence · School B<\/h2><\/div>\n\n  <div class=\"step\"><div class=\"n\">1<\/div><div><h3>Full test build<\/h3><p>Snap the entire kit together. Check fit, articulation, and posing, and flag every seam you'll want gone. This is also where you plan the subassembly breakdown by color.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">2<\/div><div><h3>Raking-light nub audit + IPA wipe<\/h3><p>Under raking light, find every nub whitening and stress mark, then wipe with isopropyl to cut the sheen so nothing hides. Clean these now; primer will otherwise magnify them.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">3<\/div><div><h3>Disassemble to single-color subassemblies<\/h3><p>Break the build back down into paint-logical groups: inner frame, each armor color, weapons. Glue and seam-fill any same-color parts that sandwich a joint at this stage.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">4<\/div><div><h3>Wash off mold release<\/h3><p>Mild soapy water bath, gentle brush, full dry. Lacquer bites better on clean plastic and you avoid fisheyes.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">5<\/div><div><h3>Prime<\/h3><p>Thin, even primer coat on handles/clips. It unifies the surface for color and reveals any seam you missed &mdash; fix and re-prime spot areas before moving on.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">6<\/div><div><h3>Base color · Mr. Color lacquer<\/h3><p>Airbrush your colors (Gaia as secondary where the shade calls for it). Build in thin passes and let each color flash off. Aim for even coverage, not a finish sheen yet.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">7<\/div><div><h3>Gloss clear<\/h3><p>A gloss coat over the color. This is the prep layer for wash and decals, not the final look. Let it cure hard before touching it.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">8<\/div><div><h3>Decals · dense technical set<\/h3><p>Waterslides onto the glossy surface, set with decal solution so they melt down over panel edges without silvering. Given how decal-heavy your builds run, don't rush this &mdash; let each area dry before handling.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">9<\/div><div><h3>Panel line · enamel or oil wash<\/h3><p>Flow the wash into the lines; it wipes cleanly off the gloss and stays in the recesses. This is detail, not weathering &mdash; you're after crisp lines, not grime, so no streaking, chipping, or filth on a factory-fresh build.<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">10<\/div><div><h3>Satin top clear<\/h3><p>Your signature coat. A satin clear seals the decals and wash and pulls every subassembly to one consistent factory sheen. Keep it off clear beam and sensor parts (mask or spray those separately).<\/p><\/div><\/div>\n  <div class=\"step\"><div class=\"n\">11<\/div><div><h3>Final reassembly<\/h3><p>Snap the finished subassemblies together. Line any deep recess that reassembly would block <b>before<\/b> this step. Done.<\/p><\/div><\/div>\n<\/section>\n\n<section id=\"m-coat\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 04<\/span><h2>Coat Order at a Glance<\/h2><\/div>\n  <table>\n    <caption>Where each clear layer lands and why<\/caption>\n    <thead><tr><th>Step<\/th><th>What it does<\/th><th>Clear coat<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td>Base color<\/td><td>Establishes the color<\/td><td class=\"num\">&mdash;<\/td><\/tr>\n      <tr><td>Gloss<\/td><td>Enables clean wash + decals<\/td><td class=\"num\">GLOSS<\/td><\/tr>\n      <tr><td>Decals<\/td><td>Markings sit down, no silvering<\/td><td class=\"num\">on gloss<\/td><\/tr>\n      <tr><td>Panel wash<\/td><td>Sharpens lines, wipes off gloss<\/td><td class=\"num\">on gloss<\/td><\/tr>\n      <tr><td>Final clear<\/td><td>Seals + unifies sheen<\/td><td class=\"num\">SATIN<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/section>\n\n<section id=\"m-simple\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 05<\/span><h2>Simplified Path · Keep Molded Colors<\/h2><\/div>\n  <p>For a fast build where you skip airbrushing: <b>1)<\/b> Build normally, cleaning nubs as you go. <b>2)<\/b> Panel line with a Gundam Marker or light enamel wash (a quick gloss first still makes enamel wipe-off cleaner). <b>3)<\/b> Apply decals or the kit stickers. <b>4)<\/b> One satin top clear over everything to kill the raw-plastic shine, tie the markings in, and protect the lines.<\/p>\n  <p class=\"note\">That single top clear is the biggest bang-for-buck upgrade a snap build can get.<\/p>\n<\/section>\n\n<div class=\"safety\">\n  <h2>&#9888; Bench Cautions<\/h2>\n  <ul>\n    <li><b>Enamel + stressed plastic.<\/b> Enamel and oil washes can wick into parts under tension and micro-crack them, usually at tight pegs and polycap joints. Keep heavy enamel out of load-bearing joints, or line those areas before final tight assembly.<\/li>\n    <li><b>Layer safety.<\/b> Enamel/oil over a <b>cured<\/b> lacquer + gloss layer is safe &mdash; that's the whole reason gloss goes down first. Don't wash directly onto bare or freshly-sprayed color.<\/li>\n    <li><b>Clear parts.<\/b> Satin and flat clears fog clear beam-effect and sensor parts. Mask them or spray them separately with gloss.<\/li>\n    <li><b>Lacquer ventilation.<\/b> Mr. Color is a hot lacquer &mdash; spray into your booth with the exhaust running and wear the respirator. (See Workshop &#8470;001 for the booth build.)<\/li>\n  <\/ul>\n<\/div>\n\n<footer>\n  <div>GUNPLABILL.COM · METHOD &#8470;001<\/div>\n  <div>Gloss enables · Satin seals<\/div>\n<\/footer>\n\n<\/div>\n<\/section>\n\n\n<section id=\"timelineView\" style=\"display:none\"><div class=\"wrap\"><div class=\"tl-head\"><h2 class=\"tl-title\">UNIVERSAL CENTURY & BEYOND<\/h2><p class=\"tl-dek\">Every kit in the index, arranged by the timeline it fights in. Statuses live-sync with the collection.<\/p><\/div><div id=\"tlCharLane\"><\/div><div id=\"tlBody\"><\/div><\/div><\/section>\n<section id=\"mangaView\" style=\"display:none\"><style>\n#mangaView{--mpaper:#f7f4ec;--mink:#1a1a1a;--mfaint:#6b6b6b;--mrule:#d8d2c4;--macc:#8a1a1a}\n#mangaView .mwrap{max-width:1000px;margin:0 auto;padding:8px 4px 40px}\n#mangaView .mhead{border-bottom:2px solid var(--mi helf<\/div>\n    <h1 class=\"mtitle\">Manga — <span class=\"macc\">The Origin<\/span><\/h1>\n  <\/div>\n  <div class=\"msub\">Yoshikazu Yasuhiko’s <em>Mobile Suit Gundam: The Origin<\/em> — the definitive UC 0079 retelling by one of the franchise’s original creators. Vertical’s English hardcover run, 12 volumes, ~450 pages each, 6×8in. The canonical companion to your UC watch and your Zeon-focused shelf.<\/div>\n  <div class=\"mprog\" id=\"mangaProgress\"><\/div>\n  <div class=\"mgrid\" id=\"mangaGrid\"><\/div>\n<\/div>\n<\/section>\n<section id=\"miscView\" style=\"display:none\"><div class=\"wrap\" style=\"max-width:1100px;margin:0 auto;padding:12px 4px 44px\"><div style=\"border-bottom:2px solid #1a1a1a;padding-bottom:10px;margin-bottom:16px\"><div style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b6b6b\">Non-Gundam builds<\/div><h2 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:26px;margin:4px 0 2px;color:#1a1a1a\">Misc. Model Kits<\/h2><div style=\"font-size:13px;color:#6b6b6b\">Kits outside the Gundam universe \\u2014 tracked apart from the main collection.<\/div><\/div><div id=\"miscGrid\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px\"><\/div><\/div><\/section>\n<section id=\"workshopView\" style=\"display:none\"><style>#workshopView{\n  --paper:#FCFCFA;\n  --ink:#16181D;\n  --ink-soft:#3A3F49;\n  --ink-faint:#7A8090;\n  --rule:#D8DAE0;\n  --steel:#2B4C7E;\n  --steel-lt:#E7EDF6;\n  --safety:#D9480F;\n  --safety-lt:#FDF0E8;\n  --mono:'IBM Plex Mono',monospace;\n  --disp:'Archivo',sans-serif;\n  --body:'Public Sans',sans-serif;\n}\n#workshopView *{box-sizing:border-box;margin:0;padding:0}\n#workshopView{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}\n#workshopView .wrap{max-width:880px;margin:0 auto;padding:0 24px}\n#workshopView header{border-bottom:3px solid var(--ink);padding:28px 0 22px}\n#workshopView .brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}\n#workshopView .brand b{color:var(--steel)}\n#workshopView h1{font-family:var(--disp);font-weight:900;font-size:clamp(30px,5.4vw,52px);line-height:1.04;letter-spacing:-.015em;margin:14px 0 10px;text-transform:uppercase}\n#workshopView .dek{font-size:18px;color:var(--ink-soft);max-width:620px}\n#workshopView .specline{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border:1.5px solid var(--ink)}\n#workshopView .specline div{flex:1 1 120px;padding:10px 14px;border-right:1.5px solid var(--ink)}\n#workshopView .specline div:last-child{border-right:none}\n#workshopView .specline .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}\n#workshopView .specline .v{font-family:var(--disp);font-weight:700;font-size:19px;margin-top:2px}\n#workshopView section{padding:44px 0 8px}\n#workshopView .sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:22px}\n#workshopView .sec-h .code{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--steel);letter-spacing:.08em;white-space:nowrap}\n#workshopView .sec-h h2{font-family:var(--disp);font-weight:800;font-size:clamp(20px,3vw,27px);text-transform:uppercase;letter-spacing:.01em}\n#workshopView p{margin-bottom:14px;color:var(--ink-soft)}\n#workshopView p b,#workshopView li b{color:var(--ink)}\n#workshopView .note{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);border-left:3px solid var(--rule);padding:6px 0 6px 14px;margin:16px 0}\n#workshopView .pc{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;background:var(--steel);color:#fff;padding:1px 7px;border-radius:2px;vertical-align:baseline}\n#workshopView figure{margin:26px 0 30px}\n#workshopView figure svg{width:100%;height:auto;display:block;border:1.5px solid var(--ink);background:#fff}\n#workshopView figcaption{font-family:var(--mono);font-size:12px;color:var(--ink-faint);padding-top:8px}\n#workshopView figcaption b{color:var(--steel)}\n#workshopView table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:14.5px}\n#workshopView caption{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding-bottom:8px}\n#workshopView th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;color:var(--ink);border-bottom:2px solid var(--ink);padding:8px 10px 8px 0}\n#workshopView td{border-bottom:1px solid var(--rule);padding:9px 10px 9px 0;vertical-align:top;color:var(--ink-soft)}\n#workshopView td:first-child,#workshopView th:first-child{padding-left:0}\n#workshopView tr:last-child td{border-bottom:none}\n#workshopView .num{font-family:var(--mono);white-space:nowrap}\n#workshopView .money{font-family:var(--mono);text-align:right;white-space:nowrap}\n#workshopView th.money{text-align:right}\n#workshopView tfoot td{border-top:2px solid var(--ink);border-bottom:none;font-weight:600;color:var(--ink)}\n#workshopView .step{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:20px 0;border-bottom:1px solid var(--rule)}\n#workshopView .step:last-child{border-bottom:none}\n#workshopView .step .n{font-family:var(--disp);font-weight:900;font-size:34px;color:var(--steel);line-height:1}\n#workshopView .step h3{font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}\n#workshopView .step p{margin-bottom:8px;font-size:15px}\n#workshopView .step p:last-child{margin-bottom:0}\n#workshopView .safety{background:var(--safety-lt);border:2px solid var(--safety);padding:22px 24px;margin:30px 0}\n#workshopView .safety h2{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:20px;color:var(--safety);margin-bottom:12px;display:flex;align-items:center;gap:10px}\n#workshopView .safety ul{list-style:none}\n#workshopView .safety li{padding:7px 0 7px 26px;position:relative;color:var(--ink-soft);font-size:15px}\n#workshopView .safety li::before{content:\"\";position:absolute;left:2px;top:14px;width:12px;height:12px;background:var(--safety);clip-path:polygon(50% 0,100% 100%,0 100%)}\n#workshopView .safety b{color:var(--ink)}\n#workshopView ul.plain{margin:0 0 16px 2px;list-style:none}\n#workshopView ul.plain li{padding:5px 0 5px 20px;position:relative;color:var(--ink-soft)}\n#workshopView ul.plain li::before{content:\"—\";position:absolute;left:0;color:var(--steel);font-family:var(--mono)}\n#workshopView footer{border-top:3px solid var(--ink);margin-top:52px;padding:22px 0 46px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}\n@media(max-width:560px){#workshopView .step{grid-template-columns:44px 1fr;gap:12px}\n#workshopView .step .n{font-size:26px}\n#workshopView .specline div{flex:1 1 46%}}\n@media print{#workshopView header,#workshopView section,#workshopView figure{break-inside:avoid-page}\n#workshopView{font-size:13px}}<\/style>\n\n<header>\n  <div class=\"wrap\">\n    <div class=\"brand\">GUNPLABILL<b>.COM<\/b> &nbsp;·&nbsp; WORKSHOP PLANS № 001 · REV B<\/div>\n    <h1>Build a Workshop-Grade<br>Spray Booth<\/h1>\n    <p class=\"dek\">A furniture-grade lacquer booth in a single deep carcass: divider-mounted filter, sealed rear-cavity plenum, 6\" EC exhaust over the roof and out a slider window — plus a fold-down front, storage drawer, and proper lighting.<\/p>\n    <div class=\"specline\">\n      <div><span class=\"k\">Box<\/span><div class=\"v\">30 × 21 × 26\"<\/div><\/div>\n      <div><span class=\"k\">Chamber<\/span><div class=\"v\">29 × 20 × 18\"<\/div><\/div>\n      <div><span class=\"k\">Airflow<\/span><div class=\"v\">≈300 CFM real<\/div><\/div>\n      <div><span class=\"k\">Duct<\/span><div class=\"v\">6\" metal<\/div><\/div>\n      <div><span class=\"k\">Budget<\/span><div class=\"v\">≈ $420<\/div><\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<div class=\"wrap\">\n\n<section id=\"brief\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 01<\/span><h2>Design Brief<\/h2><\/div>\n  <p>This is the third and final architecture of this design, and the best one — reader-contributed, fittingly. Instead of a chamber with a plenum box bolted on the back, it’s <b>one deep carcass<\/b>: 30 × 21 × 26\", with a divider standing 18\" back inside it. The chamber is everything in front of the divider; the sealed 7\" cavity behind it <b>is<\/b> the plenum. Five fewer panels, no external seams to caulk, a stronger box.<\/p>\n  <p>The filter cleats onto the divider’s front face over an 18.5\" opening — suction seats it tighter as the fan runs, and it swaps from the open front in seconds. Up top, a 6¼\" take-off feeds a <b>6\" EC inline fan (Cloudline S6-class, 402 CFM)<\/b> lying flat and transverse on the roof, then one more elbow through the window gap into a slider-track insert. Real-world delivery through a loaded filter and two elbows is ≈280–320 CFM across the 29 × 18\" face — <b>77–88 feet per minute, comfortably above the 75 FPM lacquer floor, with headroom.<\/b><\/p>\n  <p class=\"note\">Why 26\" deep and not more: this design is fitted to the most common hobby-room layout — bench directly against a window wall. The box runs flush to the bench’s back edge; fan, duct, and port all live in the found space above the windowsill. Measure your own bench-to-wall and sill before cutting; the numbers here assume 26\" of bench and a ≈6½\"-high sill.<\/p>\n  <p>On top of the working core, this full build adds the furniture layer: a fold-down front that turns the booth into a closed cabinet (and a work shelf when open), a 5\" drawer plinth underneath for tools, and the LED/acrylic lighting bar. Skip all of it and you have Workshop Plans №001-S — same carcass, one Saturday instead of a weekend.<\/p>\n<\/section>\n\n<section id=\"drawings\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 02<\/span><h2>Drawings<\/h2><\/div>\n  <figure>\n    <svg viewBox=\"0 0 860 470\" role=\"img\" aria-label=\"Front elevation, 30 by 21 chamber, filter on the divider 18 inches back\">\n      <defs><marker id=\"ae\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2B4C7E\"/><\/marker><\/defs>\n      <rect x=\"150\" y=\"60\" width=\"560\" height=\"392\" fill=\"none\" stroke=\"#16181D\" stroke-width=\"3\"/>\n      <rect x=\"164\" y=\"74\" width=\"532\" height=\"364\" fill=\"#F4F6FA\" stroke=\"#16181D\" stroke-width=\"2\"/>\n      <rect x=\"290\" y=\"118\" width=\"280\" height=\"270\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"2\" stroke-dasharray=\"7 5\"/>\n      <g stroke=\"#2B4C7E\" stroke-width=\"1\" opacity=\".55\"><line x1=\"290\" y1=\"150\" x2=\"570\" y2=\"150\"/><line x1=\"290\" y1=\"182\" x2=\"570\" y2=\"182\"/><line x1=\"290\" y1=\"214\" x2=\"570\" y2=\"214\"/><line x1=\"290\" y1=\"246\" x2=\"570\" y2=\"246\"/><line x1=\"290\" y1=\"278\" x2=\"570\" y2=\"278\"/><line x1=\"290\" y1=\"310\" x2=\"570\" y2=\"310\"/><line x1=\"290\" y1=\"342\" x2=\"570\" y2=\"342\"/><line x1=\"290\" y1=\"374\" x2=\"570\" y2=\"374\"/><\/g>\n      <text x=\"430\" y=\"252\" font-family=\"IBM Plex Mono\" font-size=\"13\" fill=\"#2B4C7E\" text-anchor=\"middle\" font-weight=\"700\">20×20×1 FILTER (C2)<\/text>\n      <text x=\"430\" y=\"272\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#7A8090\" text-anchor=\"middle\">ON THE DIVIDER · 18\" BACK FROM THE FACE<\/text>\n      <rect x=\"184\" y=\"82\" width=\"492\" height=\"10\" fill=\"#2B4C7E\"/>\n      <rect x=\"180\" y=\"78\" width=\"500\" height=\"20\" fill=\"none\" stroke=\"#7A8090\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/>\n      <text x=\"430\" y=\"72\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#7A8090\" text-anchor=\"middl \" y1=\"346\" x2=\"230\" y2=\"351\"/><line x1=\"222\" y1=\"364\" x2=\"230\" y2=\"369\"/><line x1=\"222\" y1=\"382\" x2=\"230\" y2=\"387\"/><\/g>\n      <text x=\"214\" y=\"300\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#2B4C7E\" text-anchor=\"end\" font-weight=\"700\">C2 FILTER<\/text>\n      <text x=\"214\" y=\"314\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\" text-anchor=\"end\">ON D1'S FRONT FACE<\/text>\n      <text x=\"243\" y=\"330\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#7A8090\" transform=\"rotate(-90 243 330)\">D1 DIVIDER · 18\" STATION<\/text>\n      <text x=\"264\" y=\"360\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#2B4C7E\" text-anchor=\"middle\" transform=\"rotate(-90 264 360)\">CAVITY 7\" = PLENUM<\/text>\n      <!-- LED + turntable + model -->\n      <rect x=\"96\" y=\"244\" width=\"26\" height=\"7\" fill=\"#2B4C7E\"/>\n      <rect x=\"150\" y=\"392\" width=\"70\" height=\"5\" fill=\"#fff\" stroke=\"#16181D\" stroke-width=\"1.6\"/>\n      <g fill=\"#7A8090\" opacity=\".7\"><rect x=\"176\" y=\"352\" width=\"20\" height=\"26\" rx=\"3\"/><rect x=\"180\" y=\"338\" width=\"12\" height=\"14\" rx=\"3\"/><\/g>\n      <!-- hole in A2 over cavity, center 22in -> x=90+176=266 -->\n      <rect x=\"241\" y=\"230\" width=\"50\" height=\"10\" fill=\"#fff\"/>\n      <rect x=\"241\" y=\"212\" width=\"50\" height=\"20\" fill=\"none\" stroke=\"#9aa2ad\" stroke-width=\"2\"/>\n      <!-- elbow up, transverse fan end-on, elbow to port -->\n      <circle cx=\"266\" cy=\"196\" r=\"17\" fill=\"#9aa2ad\" stroke=\"#16181D\" stroke-width=\"2\"/>\n      <circle cx=\"266\" cy=\"176\" r=\"31\" fill=\"#2B4C7E\"/>\n      <circle cx=\"266\" cy=\"176\" r=\"14\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\"/>\n      <path d=\"M266 166 L271 175 L261 175 Z M266 186 L261 177 L271 177 Z\" fill=\"#fff\"/>\n      <text x=\"200\" y=\"160\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#2B4C7E\" text-anchor=\"end\" font-weight=\"700\">S6 FAN — LYING FLAT,<\/text>\n      <text x=\"200\" y=\"174\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#2B4C7E\" text-anchor=\"end\" font-weight=\"700\">TRANSVERSE (END-ON HERE)<\/text>\n      <text x=\"200\" y=\"188\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#7A8090\" text-anchor=\"end\">RUBBER MAT + STRAP TO ROOF<\/text>\n      <path d=\"M230 232 L230 136 L298 136\" fill=\"none\" stroke=\"#D9480F\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n      <text x=\"150\" y=\"128\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#D9480F\">OPTIONAL COWL H1–H4 — OPEN TO THE WINDOW;<\/text>\n      <text x=\"150\" y=\"142\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#D9480F\">FOAM-LINED = MUFFLER. SEE CUT LIST.<\/text>\n      <circle cx=\"318\" cy=\"176\" r=\"15\" fill=\"#9aa2ad\" stroke=\"#16181D\" stroke-width=\"2\"/>\n      <rect x=\"333\" y=\"166\" width=\"22\" height=\"20\" fill=\"#fff\" stroke=\"#16181D\" stroke-width=\"2\"/>\n      <!-- W1 insert at glass plane x=362 -->\n      <rect x=\"356\" y=\"60\" width=\"12\" height=\"284\" fill=\"#E7EDF6\" stroke=\"#16181D\" stroke-width=\"2.5\"/>\n      <circle cx=\"362\" cy=\"176\" r=\"11\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"2\"/>\n      <text x=\"382\" y=\"170\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#2B4C7E\" font-weight=\"700\">PORT ≈ 18½\"<\/text>\n      <text x=\"382\" y=\"184\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#7A8090\">ABOVE INSERT BOTTOM<\/text>\n      <text x=\"382\" y=\"198\" font-family=\"IBM Plex Mono\" font-size=\"10\" fill=\"#7A8090\">6\" DAMPER JUST INSIDE<\/text>\n      <text x=\"374\" y=\"290\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#7A8090\" transform=\"rotate(90 374 290)\">W1 IN SLIDER TRACK · GLASS +¼\" BEHIND<\/text>\n      <!-- airflow -->\n      <g stroke=\"#2B4C7E\" stroke-width=\"2.4\" fill=\"none\">\n        <path d=\"M40 300 C 80 300, 120 306, 165 312\" marker-end=\"url(#fs)\"/>\n        <path d=\"M190 318 L 218 320\" marker-end=\"url(#fs)\"/>\n        <path d=\"M240 316 C 262 300, 266 270, 266 244\" marker-end=\"url(#fs)\"/>\n        <path d=\"M266 148 L 266 140 M266 140 C 266 130, 290 130, 306 148\" marker-end=\"url(#fs)\"/>\n        <path d=\"M338 176 L 348 176\" marker-end=\"url(#fs)\"/>\n      <\/g>\n      <text x=\"40\" y=\"284\" font-family=\"IBM Plex Mono\" font-size=\"12\" fill=\"#2B4C7E\" font-weight=\"700\">ROOM AIR<\/text>\n      <text x=\"400\" y=\"140\" font-family=\"IBM Plex Mono\" font-size=\"12\" fill=\"#2B4C7E\" font-weight=\"700\">OUT<\/text>\n      <text x=\"24\" y=\"60\" font-family=\"Archivo\" font-weight=\"900\" font-size=\"18\" fill=\"#16181D\">SIDE SECTION — FLUSH-FIT ROUTING<\/text>\n      <text x=\"24\" y=\"82\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#7A8090\">BOX ENDS AT THE BENCH EDGE · EVERYTHING ELSE LIVES ABOVE THE SILL<\/text>\n    <\/svg>\n    <figcaption><b>DWG 02<\/b> — The site-fitted layout: box flush with the bench's back edge (zero overhang — the riser is right there), divider and filter at the 18\" station, 7\" rear cavity as plenum. The 6¼\" take-off exits the roof at the cavity's center (22\" from the face), one elbow turns into the S6 lying flat and transverse on rubber, and a second elbow reaches rearward across the sill gap into the high port in W1. Two elbows, all smooth metal — no flex hose. The dashed outline is the optional <b>fan cowl<\/b>: a three-sided, full-width step over the fan, open toward the window — it hides the hardware, matches the cabinet, and lined with foam it works as a muffler on an already-quiet fan.<\/figcaption>\n  <\/figure>\n  <figure>\n    <svg viewBox=\"0 0 900 520\" role=\"img\" aria-label=\"Cut layout on one 4 by 8 sheet plus a 2 by 4 handy panel for the full build extras\">\n      <defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" ht=\"156\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"1.5\"/>\n      <text x=\"168\" y=\"200\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#2B4C7E\" text-anchor=\"end\">C2 ON FRONT FACE<\/text>\n      <!-- hole dashed -->\n      <circle cx=\"216\" cy=\"194\" r=\"25\" fill=\"none\" stroke=\"#7A8090\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n      <text x=\"216\" y=\"198\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#7A8090\" text-anchor=\"middle\">⌀6¼ IN A2<\/text>\n      <line x1=\"40\" y1=\"316\" x2=\"184\" y2=\"316\" stroke=\"#2B4C7E\" stroke-width=\"1.2\" marker-start=\"url(#ad)\" marker-end=\"url(#ad)\"/>\n      <text x=\"112\" y=\"332\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#2B4C7E\" text-anchor=\"middle\" font-weight=\"700\">18\" CHAMBER<\/text>\n      <line x1=\"188\" y1=\"316\" x2=\"288\" y2=\"316\" stroke=\"#2B4C7E\" stroke-width=\"1.2\" marker-start=\"url(#ad)\" marker-end=\"url(#ad)\"/>\n      <text x=\"238\" y=\"332\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#2B4C7E\" text-anchor=\"middle\" font-weight=\"700\">7\" CAVITY<\/text>\n      <line x1=\"40\" y1=\"352\" x2=\"216\" y2=\"352\" stroke=\"#7A8090\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n      <line x1=\"216\" y1=\"352\" x2=\"216\" y2=\"342\" stroke=\"#7A8090\" stroke-width=\"1\"/>\n      <text x=\"128\" y=\"366\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\">HOLE CENTER 22\" FROM FACE (0.375\" CLEAR EACH SIDE)<\/text>\n      <!-- B: DIVIDER ELEVATION 8px/in: 28.75x19.875 -> 230x159 -->\n      <text x=\"380\" y=\"76\" font-family=\"IBM Plex Mono\" font-size=\"12\" fill=\"#16181D\" font-weight=\"700\">B · DIVIDER D1<\/text>\n      <rect x=\"380\" y=\"90\" width=\"230\" height=\"159\" fill=\"#F4F6FA\" stroke=\"#16181D\" stroke-width=\"2.5\"/>\n      <rect x=\"421\" y=\"101\" width=\"148\" height=\"137\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n      <text x=\"495\" y=\"164\" font-family=\"IBM Plex Mono\" font-size=\"11\" fill=\"#2B4C7E\" text-anchor=\"middle\" font-weight=\"700\">18.5 × 18.5 OPENING<\/text>\n      <text x=\"495\" y=\"180\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\" text-anchor=\"middle\">¾\" CLEATS AROUND IT, FRONT FACE<\/text>\n      <g fill=\"#16181D\"><circle cx=\"447\" cy=\"96\" r=\"3\"/><circle cx=\"543\" cy=\"96\" r=\"3\"/><\/g>\n      <text x=\"495\" y=\"86\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#7A8090\" text-anchor=\"middle\">2 TURN-BUTTONS HOLD C2<\/text>\n      <line x1=\"380\" y1=\"266\" x2=\"610\" y2=\"266\" stroke=\"#2B4C7E\" stroke-width=\"1.2\" marker-start=\"url(#ad)\" marker-end=\"url(#ad)\"/>\n      <text x=\"495\" y=\"282\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#2B4C7E\" text-anchor=\"middle\" font-weight=\"700\">28¾\"<\/text>\n      <line x1=\"626\" y1=\"90\" x2=\"626\" y2=\"249\" stroke=\"#2B4C7E\" stroke-width=\"1.2\" marker-start=\"url(#ad)\" marker-end=\"url(#ad)\"/>\n      <text x=\"640\" y=\"172\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#2B4C7E\" font-weight=\"700\" transform=\"rotate(90 640 172)\">19⅞\" (SCANT 20)<\/text>\n      <!-- C: CHANNEL SIDE DETAIL, 24px/in zoom -->\n      <text x=\"720\" y=\"76\" font-family=\"IBM Plex Mono\" font-size=\"12\" fill=\"#16181D\" font-weight=\"700\">C · CHANNEL DETAIL<\/text>\n      <rect x=\"720\" y=\"90\" width=\"200\" height=\"14\" fill=\"#1b1c20\"/>\n      <text x=\"820\" y=\"82\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\" text-anchor=\"middle\">SIDE WALL (B1)<\/text>\n      <g fill=\"#2B4C7E\"><rect x=\"768\" y=\"104\" width=\"18\" height=\"18\"/><rect x=\"806\" y=\"104\" width=\"18\" height=\"18\"/><\/g>\n      <rect x=\"788\" y=\"104\" width=\"14\" height=\"110\" fill=\"#1b1c20\"/>\n      <rect x=\"770\" y=\"120\" width=\"16\" height=\"88\" fill=\"#fff\" stroke=\"#2B4C7E\" stroke-width=\"1.5\"/>\n      <text x=\"762\" y=\"240\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#2B4C7E\" text-anchor=\"end\">FILTER<\/text>\n      <text x=\"795\" y=\"240\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#16181D\" text-anchor=\"middle\">D1<\/text>\n      <text x=\"836\" y=\"120\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#2B4C7E\">S3 REAR STRIP<\/text>\n      <text x=\"836\" y=\"134\" font-family=\"IBM Plex Mono\" font-size=\"9\" fill=\"#D9480F\">TAKES THE LOAD<\/text>\n      <text x=\"750\" y=\"120\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#2B4C7E\" text-anchor=\"end\">S1 FRONT<\/text>\n      <path d=\"M700 170 L760 170\" stroke=\"#2B4C7E\" stroke-width=\"2.2\" marker-end=\"url(#ad)\" fill=\"none\"/>\n      <text x=\"700\" y=\"160\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#2B4C7E\">SUCTION →<\/text>\n      <text x=\"720\" y=\"290\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\">GLUE REAR STRIPS AT 18½\" FIRST,<\/text>\n      <text x=\"720\" y=\"304\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\">DROP D1 IN, GLUE FRONT STRIPS SNUG.<\/text>\n      <text x=\"720\" y=\"318\" font-family=\"IBM Plex Mono\" font-size=\"9.5\" fill=\"#7A8090\">A2 GOES ON LAST AND CAPS IT ALL.<\/text>\n      <!-- bottom note -->\n      <text x=\"40\" y=\"420\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#7A8090\">WHY IT WORKS: THE SEALED 7\" CAVITY EQUALIZES SUCTION ACROSS THE FILTER'S WHOLE BACK FACE — SAME PHYSICS AS THE OLD BOLT-ON PLENUM,<\/text>\n      <text x=\"40\" y=\"436\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#7A8090\">FIVE FEWER PANELS AND ZERO EXTERNAL SEAMS. CAULK THE C1 PERIMETER AND THE STRIP LINES; THE FILTER SELF-SEATS INTO ITS CLEATS UNDER SUCTION.<\/text>\n      <text x=\"40\" y=\"460\" font-family=\"IBM Plex Mono\" font-size=\"10.5\" fill=\"#D9480F\">FILTER SWAP: REACH IN THROUGH THE OPEN FRONT, FLIP THE TURN-BUTTONS, LIFT C2 OFF ITS CLEATS. NO TOOLS, TEN SECONDS.<\/text>\n    <\/svg>\n    <figcaption><b>DWG 05<\/b> — The filter station, at true dimensions. Four ¾\" strips form a channel at the 18\" station; the divider (28¾ × 19⅞, with the 18.5\" opening) drops in during assembly and the rear strips carry the suction load. The filter cleats to the divider's front face and swaps from the open front in seconds.<\/figcaption>\n  <\/figure>\n<\/section>\n\n<section id=\"cutlist\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 03<\/span><h2>Cut List<\/h2><\/div>\n  <table>\n    <caption>One 4×8 sheet plus a 2×4 handy panel of ½\" birch ply — see the layout drawing<\/caption>\n    <thead><tr><th>Part<\/th><th>Name<\/th><th class=\"num\">Qty<\/th><th>Size (inches)<\/th><th>Notes<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><span class=\"pc\">A1<\/span><\/td><td>Bottom<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 26<\/td><td>Sits flat on the bench, flush with its back edge<\/td><\/tr>\n      <tr><td><span class=\"pc\">A2<\/span><\/td><td>Top<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 26<\/td><td>6¼\" hole, center 22\" from the front edge, centered on width — goes on <b>last<\/b><\/td><\/tr>\n      <tr><td><span class=\"pc\">B1–B2<\/span><\/td><td>Sides<\/td><td class=\"num\">2<\/td><td class=\"num\">26 × 20<\/td><td>Fit between A1 and A2; 20\" interior height clears the true-19.5\" filter<\/td><\/tr>\n      <tr><td><span class=\"pc\">C1<\/span><\/td><td>Back<\/td><td class=\"num\">1<\/td><td class=\"num\">29 × 20<\/td><td>Solid — no opening. Insets between the sides, flush with their rear edges; it’s the plenum’s back wall<\/td><\/tr>\n      <tr><td><span class=\"pc\">D1<\/span><\/td><td>Divider<\/td><td class=\"num\">1<\/td><td class=\"num\">28¾ × 19⅞<\/td><td>18.5 × 18.5 centered opening; stands in the channel at the 18\" station (DWG 03/05)<\/td><\/tr>\n      <tr><td><span class=\"pc\">S1–S4<\/span><\/td><td>Channel strips<\/td><td class=\"num\">4<\/td><td class=\"num\">¾ × ¾ × 20<\/td><td>Rips from the offcut; rear pair takes the suction load<\/td><\/tr>\n      <tr><td><span class=\"pc\">C2<\/span><\/td><td>Filter (buy)<\/td><td class=\"num\">1<\/td><td class=\"num\">20 × 20 × 1<\/td><td>Nominal — actual 19.5 sq; cleats + 2 turn-buttons on D1’s front face, swaps from the open front<\/td><\/tr>\n      <tr><td><span class=\"pc\">E1<\/span><\/td><td>Front lip<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 2.5<\/td><td>Keeps parts from rolling off<\/td><\/tr>\n      <tr><td><span class=\"pc\">E2<\/span><\/td><td>Fold-down front<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 18<\/td><td>From the handy panel. Piano hinge to E1; magnetic catches up top; plane a strong 1/16\" off the top edge for swing clearance. Optional: ¼\" clear acrylic — closed mode becomes a display window (DWG 04)<\/td><\/tr>\n      <tr><td><span class=\"pc\">G1<\/span><\/td><td>Acrylic shield (buy)<\/td><td class=\"num\">1<\/td><td class=\"num\">28¾ × 4<\/td><td>Slip fit; protects the LED bars from overspray<\/td><\/tr>\n      <tr><td><span class=\"pc\">G2<\/span><\/td><td>Light valance<\/td><td class=\"num\">1<\/td><td class=\"num\">29 × 2.5<\/td><td>Fits inside the 29\" interior; saw-kerf slot holds the acrylic<\/td><\/tr>\n      <tr><td><span class=\"pc\">W1<\/span><\/td><td>Window insert<\/td><td class=\"num\">1<\/td><td class=\"num\">track × sash<\/td><td>Slider gap filler; 6¼\" port centered ≈18½\" above its bottom edge — dry-fit against the elbow before drilling<\/td><\/tr>\n      <tr><td><span class=\"pc\">H1<\/span><\/td><td>Cowl front (optional)<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 9.5<\/td><td>Full-width step over the fan — the booth reads as one stepped cabinet<\/td><\/tr>\n      <tr><td><span class=\"pc\">H2–H3<\/span><\/td><td>Cowl cheeks (optional)<\/td><td class=\"num\">2<\/td><td class=\"num\">8.5 × 9.5<\/td><td>Behind H1 at each end; rear stays OPEN to the window for duct, airflow, and service<\/td><\/tr>\n      <tr><td><span class=\"pc\">H4<\/span><\/td><td>Cowl lid (optional)<\/td><td class=\"num\">1<\/td><td class=\"num\">30 × 9<\/td><td>Caps the step; line the inside faces with foam or rubber offcut — it’s a muffler<\/td><\/tr>\n      <tr><td><span class=\"pc\">P1–P3<\/span><\/td><td>Drawer plinth<\/td><td class=\"num\">3<\/td><td class=\"num\">2× 26×5 + 29×5<\/td><td>Handy panel; the 5\" base that carries A1 and houses the drawer<\/td><\/tr>\n      <tr><td><span class=\"pc\">F1–F4<\/span><\/td><td>Drawer box<\/td><td class=\"num\">4<\/td><td class=\"num\">from offcut<\/td><td>Sized to your slides; ~24 × 18 × 4 typical<\/td><\/tr>\n    <\/tbody>\n  <\/table>\n<\/section>\n\n<section id=\"bom\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 04<\/span><h2>Bill of Materials &amp; Budget<\/h2><\/div>\n  <table>\n    <caption>One fan tier this time — the 6\" EC fan is the design; there is no honest cheaper substitute<\/caption>\n    <thead><tr><th>Item<\/th><th>Spec to search for<\/th><th class=\"money\">Est.<\/th><\/tr><\/thead>\n    <tbody>\n      <tr><td><b>Inline fan<\/b><\/td><td>AC Infinity Cloudline S6 (or equal): 6\" EC inline, 402 CFM, speed controller<\/td><td class=\"money\">$115–129<\/td><\/tr>\n      <tr><td>Ducting<\/td><td>6\" rigid metal: two 90° adjustable elbows + short straight sections + 2 starting collars + worm clamps + foil tape<\/td><td class=\"money\">$44<\/td><\/tr>\n      <tr><td>Backdraft damper<\/td><td>6\" inline spring-flap, just inside the window insert<\/td><td class=\"money\">$16<\/td><\/tr>\n      <tr><td>Insert hardware<\/td><td>Foam weatherstrip + track security pin for W1<\/td><td class=\"money\">$10<\/td><\/tr>\n      <tr><td>Filters<\/td><td>20×20×1 MERV 8 (2-pack) + paint-arrestor media roll as prefilter<\/td><td class=\"money\">$24<\/td><\/tr>\n      <tr><td>Lighting<\/td><td>2× 24\" LED bars, 5000K, <b>CRI 90+<\/b>, inline dimmer<\/td><td class=\"money\">$30<\/td><\/tr>\n      <tr><td>Acrylic<\/td><td>Clear acrylic, 28¾ × 4 × ⅛\"<\/td><td class=\"money\">$12<\/td><\/tr>\n      <tr><td>Plywood<\/td><td>One 4×8 sheet ½\" birch + one 2×4 handy panel<\/td><td class=\"money\">$66<\/td><\/tr>\n      <tr><td>Finish<\/td><td>White melamine paint (qt) + exterior paint + caulk<\/td><td class=\"money\">$34<\/td><\/tr>\n      <tr><td>Turntable<\/td><td>12\" lazy-susan bearing + round MDF platter<\/td><td class=\"money\">$12<\/td><\/tr>\n      <tr><td>Fan mounting<\/td><td>Rubber mat/EPDM strip + strap + screws, glue, turn-buttons; + adhesive foam for the optional cowl lining<\/td><td class=\"money\">$16–26<\/td><\/tr>\n      <tr><td>Furniture hardware<\/td><td>Piano hinge 30\", 2 magnetic catches, 18\" drawer slides, pull<\/td><td class=\"money\">$34<\/td><\/tr>\n    <\/tbody>\n    <tfoot><tr><td colspan=\"2\">Estimated total<\/td><td class=\"money\">≈ $420<\/td><\/tfoot>\n  <\/table>\n  <p class=\"note\">Yes, this costs more than the old 4\" spec — the 6\" system is what actually delivers 75+ FPM through a <i>loaded<\/i> filter. Skip the turntable and melamine and the simple build touches <b>≈ $320<\/b>; the airflow hardware is not where to save.<\/p>\n<\/section>\n\n<div class=\"safety\" id=\"safety\">\n  <h2>⚠ Lacquer Rules — Non-Negotiable<\/h2>\n  <ul>\n    <li><b>Vent outdoors, always.<\/b> A filter catches pigment, not solvent vapor. Recirculating booths are for water-based acrylics only.<\/li>\n    <li><b>Fan choice is a safety choice.<\/b> EC (brushless) motor, or motor outside the airstream. Brushed motors spark internally — not what you want in solvent-laden air.<\/li>\n    <li><b>Metal duct, not vinyl, and never flex hose.<\/b> Corrugated flex costs 2–3× the friction and vinyl degrades in solvent air. Smooth metal, taped airtight.<\/li>\n    <li><b>The booth doesn’t replace the respirator.<\/b> Organic-vapor cartridges stay on for every lacquer session.<\/li>\n    <li><b>Keep electrics out of the airstream.<\/b> Drivers and the fan controller mount outside; only the sealed LED bars live inside, behind the acrylic.<\/li>\n    <li><b>No open flame in the room<\/b> while spraying or purging — run the fan 5+ minutes after the last coat.<\/li>\n  <\/ul>\n<\/div>\n\n<section id=\"assembly\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 05<\/span><h2>Assembly — One Weekend<\/h2><\/div>\n  <div class=\"step\"><div class=\"n\">01<\/div><div>\n    <h3>Break down the sheets<\/h3>\n    <p>Cut per the layout drawing — two long rips, then crosscuts. Jigsaw the 18.5\" square opening in <span class=\"pc\">D1<\/span>, the 6¼\" hole in <span class=\"pc\">A2<\/span> (center 22\" from the front edge), and the 6¼\" port in <span class=\"pc\">W1<\/span>. Rip <span class=\"pc\">S1–S4<\/span> from the offcut. Label everything in pencil.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">02<\/div><div>\n    <h3>Finish flat<\/h3>\n    <p>Two coats of white on the interior faces of <span class=\"pc\">A1<\/span>, <span class=\"pc\">A2<\/span>, <span class=\"pc\">B1–B2<\/span>, <span class=\"pc\">C1<\/span>, and both faces of <span class=\"pc\">D1<\/span> while they’re still flat on the bench.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">03<\/div><div>\n    <h3>Filter station onto the divider<\/h3>\n    <p>Before assembly: glue ¾\" cleats around <span class=\"pc\">D1<\/span>’s opening on its <b>front<\/b> face, add two turn-buttons, and test-drop the filter. It must swap in seconds, no tools.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">04<\/div><div>\n    <h3>Carcass, bottom-up<\/h3>\n    <p>Glue and screw <span class=\"pc\">B1<\/span>/<span class=\"pc\">B2<\/span> to <span class=\"pc\">A1<\/span>, set <span class=\"pc\">C1<\/span> flush in the back. Check diagonals for square. <b>Leave A2 off.<\/b><\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">05<\/div><div>\n    <h3>Channel and divider<\/h3>\n    <p>Glue the rear strips (<span class=\"pc\">S3<\/span>/<span class=\"pc\">S4<\/span>) to the side walls at 18½\" from the front edge, drop <span class=\"pc\">D1<\/span> in against them, then glue the front strips (<span class=\"pc\">S1<\/span>/<span class=\"pc\">S2<\/span>) snug against its face. The rear strips carry the suction load. Caulk the C1 perimeter and the strip lines — the rear cavity is your plenum, and leaks here are face velocity you paid for and don’t get.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">06<\/div><div>\n    <h3>Cap it<\/h3>\n    <p>Glue and screw <span class=\"pc\">A2<\/span> on. The 6¼\" hole lands over the cavity; screw a 6\" starting collar over it. Caulk the cavity’s top seams through the hole before the collar goes on.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">07<\/div><div>\n    <h3>Lip, lights, shield<\/h3>\n    <p>Glue <span class=\"pc\">E1<\/span> across the front bottom edge. LED bars under <span class=\"pc\">A2<\/span> angled slightly back, acrylic (<span class=\"pc\">G1<\/span>) into the <span class=\"pc\">G2<\/span> kerf slot, valance mounted so the bars are shielded. Wiring exits the top — dimmer lives outside.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">08<\/div><div>\n    <h3>Turntable<\/h3>\n    <p>Lazy-susan bearing + 12–14\" MDF disc, painted white, loose on the floor so it can slide toward the filter for heavy sessions.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">09<\/div><div>\n    <h3>Furniture layer<\/h3>\n    <p>Build the 5\" plinth (<span class=\"pc\">P1–P3<\/span>) under <span class=\"pc\">A1<\/span>, then the drawer box (<span class=\"pc\">F1–F4<\/span>) on its slides inside it. Piano-hinge <span class=\"pc\">E2<\/span> to the lip, magnetic catches up top.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">10<\/div><div>\n    <h3>Window insert<\/h3>\n    <p>Fit <span class=\"pc\">W1<\/span> in the slider track — it stands at the glass plane, bottom resting at sill height. Weatherstrip both edges, track pin behind the sash. Damper just inside the port. <b>Drill the port only after dry-stacking the elbows<\/b>: it should land ≈18½\" above the insert’s bottom edge, dead in line with the fan.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">11<\/div><div>\n    <h3>Fan and duct<\/h3>\n    <p>Elbow #1 rises off the roof collar and turns sideways; the <b>S6 lies flat and transverse<\/b> along the back of the roof on a rubber mat, strapped snug-not-crushed; elbow #2 turns rearward off the fan outlet, across the sill gap, into the W1 port. All smooth metal, worm-clamped and foil-taped. Orient the fan’s motor-box release facing out for cleaning day.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">12<\/div><div>\n    <h3>Fan cowl (optional, recommended)<\/h3>\n    <p>Three-sided full-width step over the fan: <span class=\"pc\">H1<\/span> front, <span class=\"pc\">H2–H3<\/span> cheeks, <span class=\"pc\">H4<\/span> lid — <b>rear open to the window<\/b>, and keep ≥1\" of air around the fan body (the EC motor cools convectively). Line the inside faces with adhesive foam or rubber-mat offcut and the cowl doubles as a muffler. Screw, don’t glue: it comes off for filter-change day and fan cleaning.<\/p>\n  <\/div><\/div>\n\n  <div class=\"step\"><div class=\"n\">13<\/div><div>\n    <h3>Smoke test<\/h3>\n    <p>Fan on full, trace the whole face with an incense stick: steady pull inward everywhere, nothing escaping the lip. Then back the speed down until smoke just barely keeps committing inward — that’s your quiet cruise setting, probably around 60%.<\/p>\n  <\/div><\/div>\n\n  \n<\/section>\n\n<section id=\"window\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 06<\/span><h2>Slider Window Install<\/h2><\/div>\n  <p>If your window slides horizontally, the exhaust is <b>easier and better<\/b> than a wall vent. Slide the moving sash open about 10\", and fill the vertical gap with the insert panel <span class=\"pc\">W1<\/span> — the portable-AC trick, but cut from your plywood offcut (or white acrylic if you want the light) so it seals properly and doesn’t rattle.<\/p>\n  <ul class=\"plain\">\n    <li><b>Cut W1 to the track:<\/b> width = the open gap, height = full sash height so it stands in the top and bottom tracks. It lives at the glass plane, bottom resting at sill height. Test-fit before drilling.<\/li>\n    <li><b>Port goes high and in line with the fan.<\/b> With the fan lying on the roof, its axis sits ≈25\" above the bench — about 18½\" above the insert’s bottom edge. Dry-stack the elbows and mark the true center before you drill the 6¼\" hole.<\/li>\n    <li><b>Seal it:<\/b> foam weatherstrip down both vertical edges, a strip where the sash closes against it, and the second 6\" starting collar screwed over the hole from the inside.<\/li>\n    <li><b>Backdraft damper<\/b> just inside the insert — spring flap closes when the fan’s off: no drafts, no bugs, and the insert can live in the window permanently.<\/li>\n    <li><b>Security stop:<\/b> a partially open slider can’t lock — add a track pin or cut dowel behind the moving sash.<\/li>\n  <\/ul>\n  <p class=\"note\">Reality check for shallow benches: a 6\" EC fan body is ≈8\" across — it will never fit between bench and glass. That’s the whole reason the take-off exits the <b>roof<\/b>: nothing lives behind this booth at all.<\/p>\n<\/section>\n\n<section id=\"usage\">\n  <div class=\"sec-h\"><span class=\"code\">SEC 07<\/span><h2>Living With It<\/h2><\/div>\n  <ul class=\"plain\">\n    <li><b>Prefilter media does the dirty work<\/b> — cut paint-arrestor to 20×20, clip it in front of the furnace filter, swap it every few kits.<\/li>\n    <li><b>Change filters when the smoke test gets lazy,<\/b> not on a calendar — and never by turning the fan up to compensate.<\/li>\n    <li><b>Wipe the interior weekly<\/b> with isopropyl while overspray is still dust; pull the fan’s motor box once a season and wipe the impeller.<\/li>\n    <li><b>Purge cycle:<\/b> five minutes of fan past the last coat, every session.<\/li>\n    <li><b>Cabinet mode is a feature, not a cover:<\/b> close E2 while topcoats cure — dust-free drying is half the reason this build exists.<\/li>\n  <\/ul>\n<\/section>\n\n<\/div>\n\n<footer>\n  <div class=\"wrap\" style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n    <span>GUNPLABILL.COM · WORKSHOP PLANS №001 · REV B · SINGLE-BOX ARCHITECTURE<\/span>\n    <span>SHARE FREELY, BUILD SAFELY<\/span>\n  <\/div>\n<\/footer>\n\n<\/section>\n\n<footer class=\"notes\">\n  <div class=\"wrap\">\n    <h3>How to read this sheet<\/h3>\n    <p><b>Difficulty<\/b> runs from one cut-point pip (tool-free snap build) to five (multi-session expert kit with screws, decals, or huge part counts). <b>Parts volume<\/b>, <b>height<\/b>, and <b>price<\/b> are approximate and meant for planning; confirm specifics at the listing. Open any card with <b>Specs<\/b> for paint and gate notes, loadout, and build watch-outs. The <b>Lore<\/b> link on each card opens that suit's entry on The Gundam Wiki for its story, pilot, and timeline. The <b>Colors<\/b> line shows the suit's principal scheme; the <b>Manual color guide<\/b> link inside Specs pulls up that kit's exact paint conversions, since per-part mixes belong to the printed manual, not a rough guess.<\/p>\n    <div class=\"scale-key\">\n      <span><b>EG<\/b> 1/144<\/span><span><b>HG<\/b> 1/144<\/span><span><b>RG<\/b> 1/144<\/span><span><b>MG<\/b> 1/100<\/span><span><b>FM<\/b> 1/100<\/span><span><b>PG<\/b> 1/60<\/span><span><b>SD<\/b> chibi<\/span>\n    <\/div>\n    <h3 style=\"margin-top:24px\">Adding your own photos<\/h3>\n    <p>Each card looks for a local image first and falls back to the grade placeholder if none is found. To add your licensed Bandai photos: make a folder named <code>images<\/code> next to this HTML file and save each photo using the exact filename shown in that card's Specs panel (for example <code>images/mg-char-s-zaku-ii-ver-2-0.jpg<\/code>). Reload the page and the photos appear automatically. JPG or PNG both work as long as the filename matches.<\/p>\n  <\/div>\n<\/footer>\n\n<script>\nconst GRADES = {\n  EG:{name:\"Entry Grade\", c:\"var(--eg)\"}, HG:{name:\"High Grade\", c:\"var(--hg)\"},\n  RG:{name:\"Real Grade\", c:\"var(--rg)\"}, MG:{name:\"Master Grade\", c:\"var(--mg)\"},\n  FM:{name:\"Full Mechanics\", c:\"var(--fm)\"}, RE:{name:\"RE/100\", c:\"var(--fm)\"}, PG:{name:\"Perfect Grade\", c:\"var(--pg)\"},\n  SD:{name:\"Super Deformed\", c:\"var(--sd)\"}\n};\nconst GRADE_ORDER = [\"EG\",\"HG\",\"RG\",\"FM\",\"RE\",\"MG\",\"PG\",\"SD\"];\nconst DIFF_LABEL = {1:\"Snap / no tools\",2:\"Easy\",3:\"Intermediate\",4:\"Advanced\",5:\"Expert\"};\n\nconst BUILD_ORDER = {\"MG Gundam Sandrock EW\": 60, \"MG Zeta Gundam Ver.Ka\": 58, \"MG Gundam F91 Ver 2.0\": 59, \"MG Jesta Cannon\": 57, \"RE/100 Zaku II FZ\": 123, \"MG RX-78/C.A Casval's Gundam Ver 3.0\": 122, \"MG Gundam Barbatos Lupus\": 56, \"HG Zaku II (Revive)\": 1, \"HG Bocata's Gelgoog (GQ)\": 2, \"HG Gaia's/Ortega's Rick Dom (GQ)\": 3, \"MG Gundam Heavyarms EW\": 4, \"MG RB-79 Ball Ver.Ka\": 5, \"MG Char's Z'Gok\": 6, \"MG Acguy\": 7, \"HGUC Geara Doga\": 8, \"MG Rick Dias (Quattro Custom)\": 9, \"MG Rick Dias\": 10, \"MG Hizack (Titans)\": 11, \"MG Qubeley\": 12, \"MG Gelgoog Cannon\": 13, \"HGUC Zaku Mariner\": 14, \"MG Char's Zaku II Ver 2.0\": 15, \"MG Gogg\": 16, \"MG Guncannon\": 17, \"MG Dom\": 18, \"MG Gouf Ver 2.0\": 19, \"MG Gouf Custom\": 20, \"MG Kampfer\": 21, \"MG Buster Gundam\": 22, \"MG Duel Gundam (Assault Shroud)\": 23, \"MG Turn A Gundam\": 24, \"HGUC Moon Gundam\": 25, \"MG Geara Doga\": 26, \"MG Jegan (Char's Counterattack)\": 27, \"MG Re-GZ (Char's Counterattack)\": 28, \"MG Gyan\": 29, \"MG Gundam GP03 (Stamen)\": 30, \"HGUC GP02A Physalis (Type-MLRS)\": 31, \"MG Crossbone Gundam X1\": 32, \"MG Gundam Stormbringer P.F.\": 33, \"MG RX-78-2 Ver 3.0\": 34, \"MG Zeong\": 35, \"MG Zaku II R-2 (Gabby Hazard)\": 36, \"MG GM Sniper II (White Dingo)\": 37, \"MG ReZEL (Commander Type)\": 38, \"MG The-O\": 39, \"MG Wi
