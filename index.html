  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t committed to the wishlist.<\/p>\n    <div id=\"referenceBody\"><\/div>\n  <\/div>\n<\/section>\n\n\n<section class=\"community\" id=\"communityView\" style=\"display:none\">\n  <div class=\"wrap\">\n    <div class=\"paint-head\">\n      <div>\n        <div class=\"mast-code\">Community &middot; where the builders are<\/div>\n        <h2 class=\"paint-title\">Build <span class=\"acc\">Community<\/span><\/h2>\n      <\/div>\n      <div class=\"paint-count\">curated for technique depth<\/div>\n    <\/div>\n    <p class=\"comm-lede\">Skewed toward where the build actually is &mdash; airbrush technique, lacquer handling, UC/Zeon kits &mdash; rather than first-kit onboarding. The play: one fast-answer feed, one deep-dive forum, one channel for paint craft.<\/p>\n\n    <div class=\"comm-grid\">\n\n      <div>\n        <h3 class=\"comm-h\">Reddit<\/h3>\n        <a class=\"comm-card\" href=\"https://www.reddit.com/r/Gunpla/\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">r/Gunpla <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Largest English-language hub. The daily Q&amp;A / simple-questions threads are the fastest route to specific answers on thinning ratios, masking, and decal setting.<\/div><\/a>\n        <a class=\"comm-card\" href=\"https://www.reddit.com/r/Gundam/\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">r/Gundam <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Franchise, lore, and anime-leaning, with steady Gunpla crossover. Good for context on the UC suits on the shelf.<\/div><\/a>\n      <\/div>\n\n      <div>\n        <h3 class=\"comm-h\">Forums<\/h3>\n        <a class=\"comm-card\" href=\"http://www.gundamforums.com/\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">Gundam Forums <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Old-school board with long-form WIP build logs and lacquer / airbrush threads &mdash; the deep-end technique reading a feed buries.<\/div><\/a>\n        <a class=\"comm-card\" href=\"https://gundam.boards.net/\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">The Unofficial Gundam Forum <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Smaller, but build sections are sorted by series &mdash; a whole U.C. 0079 / 0080 / CCA / Unicorn tree.<\/div><div class=\"comm-flag\">Fits the Zeon focus<\/div><\/a>\n      <\/div>\n\n      <div>\n        <h3 class=\"comm-h\">Discord<\/h3>\n        <a class=\"comm-card\" href=\"https://linktr.ee/studio_gundam\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">Plamo Plaza (Studio G) <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Studio G's server. Heavy on painting, customization, and airbrushing &mdash; they co-designed an airbrush. Live invite + store via their Linktree.<\/div><\/a>\n        <p class=\"comm-sub\">Also active: the Gunpla Builder's Association and Gundam HQ servers. Discord invites expire, so pull a current one from the r/Gunpla sidebar or DISBOARD rather than a stale link.<\/p>\n      <\/div>\n\n      <div>\n        <h3 class=\"comm-h\">YouTube<\/h3>\n        <a class=\"comm-card\" href=\"https://www.youtube.com/channel/UC_66OBQNO8jXkHjlxnnxT-A\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">Barbatos Rex <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">The most on-point channel here: Mr. Color lacquer airbrush technique, thinning, primers, spray booths &mdash; the exact paint stack on the bench.<\/div><div class=\"comm-flag\">Start here for paint<\/div><\/a>\n        <a class=\"comm-card\" href=\"https://www.youtube.com/channel/UCmTirt4GHaPXVBDOYfW3nDg\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">Studio G <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Cinematic custom builds plus genuine airbrush tutorials and reviews.<\/div><\/a>\n        <a class=\"comm-card\" href=\"https://www.youtube.com/@MechaGaikotsu\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">Mecha Gaikotsu <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">13+ years of reviews and builds; useful for sizing up a kit before buying.<\/div><\/a>\n        <a class=\"comm-card\" href=\"https://www.youtube.com/@ZakuAurelius\" target=\"_blank\" rel=\"noopener\"><div class=\"comm-name\">ZakuAurelius <span class=\"comm-go\">&#8599;<\/span><\/div><div class=\"comm-desc\">Unboxings, reviews, and tutorial-style builds with a steady, practical tone.<\/div><\/a>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"comm-pick\">\n      <h3>If picking three<\/h3>\n      <ol>\n        <li><b>Barbatos Rex<\/b> &mdash; paint and airbrush craft at the right level<\/li>\n        <li><b>Gundam Forums<\/b> &mdash; deep WIP logs and troubleshooting<\/li>\n        <li><b>r/Gunpla<\/b> &mdash; fast answers, restocks, and inspiration<\/li>\n      <\/ol>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<footer class=\"notes\">\n  <div class=\"wrap\">\n    <h3>How to read this sheet<\/h3>\n    <p><b>Difficulty<\/b> runs from one cut-point pip (tool-free snap build) to five (multi-session expert kit with screws, decals, or huge part counts). <b>Parts volume<\/b>, <b>height<\/b>, and <b>price<\/b> are approximate and meant for planning; confirm specifics at the listing. Open any card with <b>Specs<\/b> for paint and gate notes, loadout, and build watch-outs. The <b>Lore<\/b> link on each card opens that suit's entry on The Gundam Wiki for its story, pilot, and timeline. The <b>Colors<\/b> line shows the suit's principal scheme; the <b>Manual color guide<\/b> link inside Specs pulls up that kit's exact paint conversions, since per-part mixes belong to the printed manual, not a rough guess.<\/p>\n    <div class=\"scale-key\">\n      <span><b>EG<\/b> 1/144<\/span><span><b>HG<\/b> 1/144<\/span><span><b>RG<\/b> 1/144<\/span><span><b>MG<\/b> 1/100<\/span><span><b>FM<\/b> 1/100<\/span><span><b>PG<\/b> 1/60<\/span><span><b>SD<\/b> chibi<\/span>\n    <\/div>\n    <h3 style=\"margin-top:24px\">Adding your own photos<\/h3>\n    <p>Each card looks for a local image first and falls back to the grade placeholder if none is found. To add your licensed Bandai photos: make a folder named <code>images<\/code> next to this HTML file and save each photo using the exact filename shown in that card's Specs panel (for example <code>images/mg-char-s-zaku-ii-ver-2-0.jpg<\/code>). Reload the page and the photos appear automatically. JPG or PNG both work as long as the filename matches.<\/p>\n  <\/div>\n<\/footer>\n\n<script>\nconst GRADES = {\n  EG:{name:\"Entry Grade\", c:\"var(--eg)\"}, HG:{name:\"High Grade\", c:\"var(--hg)\"},\n  RG:{name:\"Real Grade\", c:\"var(--rg)\"}, MG:{name:\"Master Grade\", c:\"var(--mg)\"},\n  FM:{name:\"Full Mechanics\", c:\"var(--fm)\"}, PG:{name:\"Perfect Grade\", c:\"var(--pg)\"},\n  SD:{name:\"Super Deformed\", c:\"var(--sd)\"}\n};\nconst GRADE_ORDER = [\"EG\",\"HG\",\"RG\",\"FM\",\"MG\",\"PG\",\"SD\"];\nconst DIFF_LABEL = {1:\"Snap / no tools\",2:\"Easy\",3:\"Intermediate\",4:\"Advanced\",5:\"Expert\"};\n\nconst BUILD_ORDER = {\n  \"HG Zaku II (Revive)\":1,\n  \"HG Bocata's Gelgoog (GQ)\":2,\n  \"HG Gaia's/Ortega's Rick Dom (GQ)\":3,\n  \"HGUC Geara Doga\":4,\n  \"HGUC Zaku Mariner\":5,\n  \"MG Char's Zaku II Ver 2.0\":6,\n  \"MG Gouf Custom\":7,\n  \"MG Kampfer\":8,\n  \"MG Gundam Heavyarms EW\":9,\n  \"MG RX-78-2 Ver 3.0\":12,\n  \"MG Freedom Gundam Ver 2.0\":13,\n  \"MG GM Sniper II (White Dingo)\":14,\n  \"MG Wing Gundam Zero EW Ver Ka\":15,\n  \"MG Sazabi Ver Ka\":16,\n  \"MG Banshee Ver Ka\":20,\n  \"MG Nu Gundam Ver Ka\":21,\n  \"HGUC Moon Gundam\":22,\n  \"MG Sinanju Stein (Narrative Ver.)\":23,\n  \"MG ReZEL (Commander Type)\":24,\n  \"MG Qubeley\":25,\n  \"MG Zeta Gundam Ver 2.0\":26,\n  \"MG Gelgoog Cannon\":27,\n  \"MG Gogg\":28,\n  \"MG Jegan (Char's Counterattack)\":29,\n  \"MG Zeong\":30,\n  \"MG Psycho Zaku Ver.Ka (Thunderbolt)\":31,\n none\";\n  if(elCountPlate) elCountPlate.style.display=isGrid?\"\":\"none\";\n  if(isGrid) render();\n  if(isRef) renderReference();\n  window.scrollTo({top:0,behavior:\"auto\"});\n}\ndocument.querySelectorAll(\".tab\").forEach(t=>t.addEventListener(\"click\",()=>setView(t.dataset.view)));\n\n// Tab counts\nconst ownedCount=KITS.filter(k=>k.owned).length;\nconst wishCount=Object.keys(WISHLIST).length;\nconst bottleCount=PAINTS.filter(p=>!p.tobuy).reduce((s,p)=>s+p.qty,0);\ndocument.getElementById(\"tabCountCollection\").textContent=ownedCount;\ndocument.getElementById(\"tabCountWishlist\").textContent=wishCount;\ndocument.getElementById(\"tabCountPaint\").textContent=bottleCount;\n\nfunction syncTabHeight(){\n  const tabs=document.querySelector(\".tabs\");\n  if(tabs) document.documentElement.style.setProperty(\"--tabH\", tabs.offsetHeight+\"px\");\n}\nsyncTabHeight();\nwindow.addEventListener(\"resize\",syncTabHeight);\n\nsetView(\"collection\");\n<\/script>\n\n\n<script>(function(){var cache={};function addLink(card){if(card.querySelector(\".loglink\"))return;var sg=card.dataset.slug;if(!sg)return;var body=card.querySelector(\".card-body\")||card;var a=document.createElement(\"a\");a.className=\"loglink\";a.href=\"logs/\"+sg+\"/\";a.textContent=\"Build Log \\u25B8\";a.addEventListener(\"click\",function(e){e.stopPropagation();});body.appendChild(a);}function consider(card){if(typeof fetch!==\"function\")return;var sg=card.dataset.slug;if(!sg)return;if(card.dataset.owned!==\"1\")return;if(cache[sg]===true){addLink(card);return;}if(cache[sg]===false||cache[sg]===\"pending\")return;cache[sg]=\"pending\";fetch(\"logs/\"+sg+\"/\",{method:\"HEAD\"}).then(function(r){cache[sg]=!!(r&&r.ok);if(cache[sg]){var e=document.querySelectorAll(\".card\");for(var i=0;i<e.length;i++){if(e[i].dataset.slug===sg)addLink(e[i]);}}}).catch(function(){cache[sg]=false;});}function sweep(){var g=document.getElementById(\"grid\");if(!g)return;var c=g.querySelectorAll(\".card\");for(var i=0;i<c.length;i++)consider(c[i]);}function start(){sweep();var g=document.getElementById(\"grid\");if(g&&window.MutationObserver){new MutationObserver(sweep).observe(g,{childList:true});}}if(document.readyState!==\"loading\"){setTimeout(start,300);}else{document.addEventListener(\"DOMContentLoaded\",function(){setTimeout(start,300);});}})();<\/script>\n<script>\nfunction refStatus(k){\n  var sg=slug(k.n);\n  if(typeof STATUS!==\"undefined\"&&STATUS){ if(STATUS[sg]===\"done\")return\"built\"; if(STATUS[sg]===\"wip\")return\"wip\"; if(STATUS[sg]===\"inhouse\")return\"inhouse\"; if(STATUS[sg]===\"japan\")return\"japan\"; if(STATUS[sg]===\"preorder\")return\"preorder\"; }\n  if(k.owned)return\"owned\";\n  if(typeof WISHLIST!==\"undefined\"&&WISHLIST&&Object.prototype.hasOwnProperty.call(WISHLIST,k.n))return\"wishlist\";\n  return\"reference\";\n}\nfunction renderReference(){\n  var groups=[[\"built\",\"Built\"],[\"wip\",\"In Progress\"],[\"owned\",\"Owned \\u00b7 unbuilt\"],[\"inhouse\",\"In-house\"],[\"japan\",\"Incoming \\u00b7 Japan\"],[\"preorder\",\"Pre-order\"],[\"wishlist\",\"Wishlist\"],[\"reference\",\"Reference \\u00b7 someday\"]];\n  var by={built:[],wip:[],owned:[],inhouse:[],japan:[],preorder:[],wishlist:[],reference:[]};\n  KITS.forEach(function(k){ var s=refStatus(k); (by[s]||by.reference).push(k); });\n  var go=(typeof GRADE_ORDER!==\"undefined\")?GRADE_ORDER:[\"EG\",\"SD\",\"HG\",\"RG\",\"FM\",\"MG\",\"PG\"];\n  function gi(g){var i=go.indexOf(g);return i<0?99:i;}\n  Object.keys(by).forEach(function(s){ by[s].sort(function(a,b){ return gi(a.g)-gi(b.g) || a.n.localeCompare(b.n); }); });\n  function esc(s){return (s||\"\").replace(/&/g,\"&amp;\").replace(/<\/g,\"&lt;\").replace(/>/g,\"&gt;\");}\n  function row(k){\n    var sg=slug(k.n);\n    var img=(typeof IMG!==\"undefined\"&&IMG[sg])?IMG[sg]:\"\";\n    var tl=(typeof TL!==\"undefined\"&&TL[sg])?TL[sg]:\"\\u2014\";\n    var bo=(typeof BUILD_ORDER!==\"undefined\"&&BUILD_ORDER[k.n])?(' <span class=\"ref-bo\">#'+BUILD_ORDER[k.n]+'<\/span>'):'';\n    var im=img?('<img class=\"zoomable\" data-name=\"'+esc(k.n)+'\" src=\"'+img+'\" alt=\"\" loading=\"lazy\" onerror=\"this.remove()\">'):'';\n    return '<div class=\"ref-row\">'\n      +'<span class=\"ref-thumb\"><span class=\"ph g-'+k.g+'\">'+k.g+'<\/span>'+im+'<\/span>'\n      +'<span class=\"ref-gb g-'+k.g+'\">'+k.g+'<\/span>'\n      +'<span class=\"ref-name\">'+esc(k.n)+bo+'<\/span>'\n      +'<span class=\"ref-tl\">'+esc(tl)+'<\/span>'\n      +'<span class=\"ref-scale\">'+esc(k.scale||'')+'<\/span>'\n      +'<\/div>';\n  }\n  var html='<div class=\"ref-row ref-head\"><span><\/span><span>Grade<\/span><span>Model<\/span><span>Timeline<\/span><span>Scale<\/span><\/div>';\n  groups.forEach(function(gp){\n    var arr=by[gp[0]]; if(!arr.length) return;\n    html+='<div class=\"ref-group\"><h3 class=\"ref-h s-'+gp[0]+'\">'+gp[1]+' <span class=\"ref-c\">'+arr.length+'<\/span><\/h3><div class=\"ref-list\">';\n    arr.forEach(function(k){ html+=row(k); });\n    html+='<\/div><\/div>';\n  });\n  var body=document.getElementById(\"referenceBody\"); if(body) body.innerHTML=html;\n  var sum=document.getElementById(\"refSummary\"); if(sum) sum.textContent=KITS.length+\" kits tracked\";\n}\n(function(){\n  function init(){\n    var rc=document.getElementById(\"tabCountReference\"); if(rc&&typeof KITS!==\"undefined\") rc.textContent=KITS.length;\n    try{ renderReference(); }catch(e){}\n    var rb=document.getElementById(\"referenceBody\");\n    if(rb && !rb.__lbBound){\n      rb.__lbBound=true;\n      rb.addEventListener(\"click\",function(e){\n        var img=(e.target&&e.target.closest)?e.target.closest(\".ref-thumb img\"):null;\n        if(img&&typeof openLightbox===\"function\") openLightbox(img.src, img.getAttribute(\"data-name\")||\"\");\n      });\n    }\n  }\n  if(document.readyState!==\"loading\") setTimeout(init,200);\n  else document.addEventListener(\"DOMContentLoaded\",function(){setTimeout(init,200);});\n})();\n<\/script>\n<\/body><\/html>"</script>
