ue\",c:\"C65\",pct:20}]},\n      {part:\"Sturm faust red\", mix:[{n:\"Monza Red\",c:\"C68\",pct:100}]},\n      {part:\"Frame gray\", mix:[{n:\"Neutral Gray\",c:\"C13\",pct:80},{n:\"Black\",c:\"C2\",role:\"black\",pct:10},{n:\"Blue Gray\",c:\"C337\",pct:10}]},\n      {part:\"Vernier yellow\", mix:[{n:\"Orange Yellow\",c:\"C58\",pct:60},{n:\"White\",c:\"C1\",role:\"white\",pct:40}]},\n      {part:\"Sensor pink\", mix:[{n:\"Pink\",c:\"C63\",pct:100}]}\n    ]\n  },\n  \"HGUC GP02A Physalis (Type-MLRS)\": {\n    src:\"Bandai HG color guide (via mech9; RX-78GP02A Type-MLRS, Aqueous H-codes converted to Mr. Color)\",\n    note:\"Gato's GP02A (UC 0083). Main body verified as Aircraft Gray (C73). Darker blue-gray secondary approximated from C73+Black — confirm ratio at the in-box manual. Main camera is a Clear Green topcoat.\",\n    parts:[\n      {part:\"Body light blue-gray\", mix:[{n:\"Aircraft Gray\",c:\"C73\",pct:80},{n:\"White\",c:\"C1\",role:\"white\",pct:10},{n:\"Black\",c:\"C2\",role:\"black\",pct:10}]},\n      {part:\"Feet/abdomen dark\", mix:[{n:\"Aircraft Gray\",c:\"C73\",pct:70},{n:\"Black\",c:\"C2\",role:\"black\",pct:30}]},\n      {part:\"Vents yellow\", mix:[{n:\"Yellow\",c:\"C4\",pct:100}]},\n      {part:\"Red accents\", mix:[{n:\"Red\",c:\"C3\",pct:100}]}\n    ]\n  }\n};\nfunction _paintOwnedSets(){\n  const owned=(typeof PAINTS!==\"undefined\")?PAINTS.filter(p=>!p.tobuy):[];\n  const codes=new Set();\n  owned.forEach(p=>{ String(p.code||\"\").split(/[\\/,]/).forEach(cc=>{ cc=cc.trim(); if(cc) codes.add(cc); }); });\n  const names=owned.map(p=>(p.name||\"\").toLowerCase());\n  return {codes, roles:{white:names.some(n=>n.indexOf(\"white\")>=0), black:names.some(n=>n.indexOf(\"black\")>=0)}};\n}\nconst LORE = {\"MG Gundam Sandrock EW\": \"The XXXG-01SR Gundam Sandrock is one of the five Gundams sent to Earth in Operation Meteor, built for desert combat and armed with twin heat shotels and a cross-crusher shield.~|~Its pilot is Quatre Raberba Winner, the pacifist heir of a colony resource magnate — the gentlest of the five pilots, and the one whose arc turns most sharply when the war reaches his family.~|~This is the 2011 Master Grade of Katoki's Endless Waltz redesign: broader, heavier and more armored than the TV version. Mechanically straightforward by MG standards, which makes it a good palette and finish exercise rather than an engineering challenge.\", \"MG Zeta Gundam Ver.Ka\": \"The MSZ-006 Zeta Gundam is the transformable hero machine of Zeta Gundam (UC 0087), the AEUG's answer to the Titans, converting without part-swapping into the atmospheric Wave Rider flight form.~|~Its pilot is Kamille Bidan, a gifted and volatile young Newtype whose brutal coming-of-age in the Gryps War gives the series its reputation as one of the darkest entries in the franchise.~|~Ver.Ka is Katoki's 2023 reinterpretation, released long after the Ver 2.0. It trades some of Ver 2.0's robustness for a tighter, more screen-accurate Wave Rider silhouette and a far denser marking set — a display piece rather than a handling kit.\", \"MG Jesta Cannon\": \"The RGM-96X Jesta Cannon is a fire-support variant of the Jesta, the Federation's elite ECOAS special-forces mobile suit from Mobile Suit Gundam Unicorn (UC 0096).~|~It trades some mobility for a pair of shoulder-mounted beam cannons, acting as the heavy hitter of a Jesta team escorting the Unicorn Gundam.~|~On your shelf it deepens the UC Federation line alongside the Jegan, ReZEL, and Re-GZ — the workmanlike grunts of the Unicorn era rather than its hero units.\",\n  \"RE/100 Zaku II FZ\": \"The MS-06FZ Zaku II FZ, or 'F Zwei,' is the final mass-production Zaku of the One Year War, from the 1989 OVA Mobile Suit Gundam 0080: War in the Pocket.~|~It is Bernard Wiseman's machine, thrown against the Federation's prototype NT-1 Alex in a snowbound Christmas battle that anchors the OVA's anti-war story.~|~On your shelf it slots beside the Kampfer and the Alex Ver 2.0 preorder as the 0080 War in the Pocket set — the quiet, human-scale corner of the One Year War.\",\n  \"MG RX-78/C.A Casval's Gundam Ver 3.0\": \"The RX-78/C.A Casval's Gundam is a what-if machine: the RX-78 as it might have looked in the hands of Casval Rem Deikun — Char Aznable's true name — rendered in his personal reds instead of Federation white.~|~It comes from the Gihren's Greed strategy games, whose alternate histories let Char field a Gundam of his own; Bandai gave the idea the Ver 3.0 treatment as a Bandai Hobby Online Shop exclusive in 2017.~|~For your shelf it is a natural Char companion to the red Zaku II and the eventual Sazabi — the Federation's masterwork frame wearing Zeon's most famous ace's colors.\",\n  \"MG Gundam Barbatos Lupus\": \"ASW-G-08 Gundam Barbatos Lupus \\u2014 the upgraded Barbatos from Iron-Blooded Orphans S2, piloted by Mikazuki Augus of Tekkadan. The Lupus (wolf) refit rebuilt Barbatos with a fuller Gundam Frame tuned for raw power and speed.\",\"MG Char's Zaku II Ver 2.0\": \"The MS-06S Zaku II Commander Type is the personal machine of Char Aznable, the 'Red Comet,' during the One Year War (UC 0079). Mechanically it is a tuned variant of Zeon's mass-production MS-06 - higher thrust, a commander's extra sensor, and Char's signature crimson paint. Its reputation that it moves at three times the speed of a normal Zaku gave Char his nickname and cemented the suit as the most recognizable enemy machine in the franchise.~|~Char is the franchise's defining antagonist-rival: a masked Zeon ace secretly born Casval Rem Deikun, waging a personal war of vengeance against the Zabi family who murdered his father while publicly serving Zeon. Cold, brilliant, and theatrical, he hounds Amuro Ray and the White Base throughout the war. This red Zaku is where his legend begins.~|~The Zaku II itself is arguably the most important grunt mecha ever animated - the workhorse that made mobile suits a credible weapon and nearly won Zeon the war. Char's command type is the iconic 'hero villain' version of it, and as a kit the Ver 2.0 is widely considered one of the best-engineered MGs Bandai has ever made, with a clean inner frame that makes it a perfect first Master Grade.\", \"MG Zaku II R-2 (Gabby Hazard)\": \"The MS-06R-2 is a high-mobility refinement of the Zaku II from the MSV (Mobile Suit Variations) line, developed late in the One Year War as Zeon pushed the aging Zaku platform to its performance ceiling. The R-2 added uprated thrusters and reinforced limbs intended for elite pilots, a stepping stone toward the Gelgoog.~|~This unit wears the colors of Zeon ace Gabby Hazard, one of the named aces of the MSV expanded lore who flew high-spec R-type Zakus. The MSV pilots fleshed out the war beyond the TV cast, giving collectors a roster of personal-color veterans to chase.~|~As a build it is a classic Zaku silhouette in an unusual desert-brown ace scheme, rewarding for a Zeon-focused collection that wants depth beyond the famous machines. It pairs naturally with Char's Zaku and the Gouf as part of the One Year War Zeon lineage.\", \"MG Buster Gundam\": \"The GAT-X103 Buster is one of the five prototype G-weapons the Earth Alliance secretly developed and that ZAFT stole at Heliopolis in Gundam SEED (Cosmic Era 71). It is the dedicated long-range artillery unit, armed with a gun launcher and a high-energy rifle that can combine into a single hyper-impulse cannon for siege-grade firepower.~|~After the theft it is piloted by Dearka Elsman, one of ZAFT's elite Coordinator pilots and a member of the Le Creuset team. Arrogant at first, Dearka's arc softens over the series as the war's cost mounts.~|~Within SEED's story the Buster represents the Earth Alliance's own technology turned against it, fighting as the bombardment specialist beside the stolen Duel, Blitz, and Aegis. For a builder it offers a chunky, weapon-forward Gundam distinct from the sleek mainline suits.\", \"MG Astray Blue Frame D\": \"The MBF-P03D Gundam Astray Blue Frame is the 'D' configuration of Orb's prototype Astray line in Gundam SEED Astray. The Astray frames - Red, Blue, and Gold - were built by the neutral nation of Orb from the same OS data as the stolen G-weapons; the Blue Frame is the swordsman of the group, and the D loadout adds heavy close-combat and tactical equipment.~|~It is wielded by Gai Murakumo, the cool, professional leader of the mercenary outfit Serpent Tail. Unlike the idealistic main casts of SEED, Gai is a gun-for-hire navigating the Cosmic Era's chaos for contracts, which gives the Blue Frame a harder-edged, mercenary identity.~|~The Astray side stories are beloved for their customization-heavy designs and manga-driven lore, and the Blue Frame is the fan-favorite melee machine of that world. It is a striking deep-blue centerpiece for a Cosmic Era shelf.\", \"MG Duel Gundam (Assault Shroud)\": \"The GAT-X102 Duel is the first of the five Earth Alliance G-weapons and the prototype the others were derived from (Gundam SEED). The Assault Shroud is bolt-on additional armor and weaponry - extra thrusters, a rail gun, missiles, and shielding - that transforms the baseline Duel into a heavily armed assault platform.~|~It is piloted by Yzak Joule, the hot-tempered, pride-driven ZAFT elite scarred (literally) by an early encounter with the Strike. Yzak's hotheaded rivalry and gradual maturation make him one of SEED's more memorable secondary pilots.~|~Story-wise the Duel embodies ZAFT seizing the Federation's best technology and weaponizing it immediately, and the Assault Shroud is the visual statement of that escalation. For collectors it is a busy, armored take on the classic stolen-Gundam silhouette.\", \"MG Gundam Heavyarms EW\": \"The XXXG-01H Gundam Heavyarms is one of the five Gundams sent to Earth in Operation Meteor (Gundam Wing, After Colony 195), shown here in Hajime Katoki's refined Endless Waltz redesign. It is the ammunition-based heavy gunner of the team, bristling with a chest-mounted array, double gatlings, an oversized gatling rifle, and homing missiles - built to suppress and overwhelm rather than dogfight.~|~Its pilot is Trowa Barton, a quiet, enigmatic former circus performer whose calm exterior hides a soldier shaped by a childhood of war. Trowa's understated loyalty and self-sacrifice make him one of Wing's most stoic protagonists.~|~Wing follows five teenage pilots sent to fight the Earth's military bloc OZ, and Heavyarms is the team's walking arsenal. The EW redesign sharpens its proportions into one of the more aggressively detailed MGs, and it satisfies anyone after the 'covered in guns' archetype.\", \"MG RX-78-2 Ver 3.0\": \"The RX-78-2 Gundam is the machine that started everything - the Earth Federation's prototype mobile suit from the original Mobile Suit Gundam (One Year War, UC 0079). Built in secret at Side 7, it combined Luna Titanium armor, a beam rifle, and a learning computer that adapted to its pilot, outclassing the Zakus that had dominated the war.~|~Its pilot is Amuro Ray, a withdrawn teenage civilian who climbs into the Gundam by accident and becomes the war's decisive ace and one of the first awakened Newtypes. Amuro's reluctant coming-of-age against Char is the emotional spine of the entire Universal Century.~|~Beyond the story, the RX-78-2 is the most iconic robot in the franchise and arguably in anime. Ver 3.0 is Bandai's most engineering-ambitious Master Grade rendition of it, with an intricate internal frame - the definitive plastic version of the original Gundam.\", \"MG Tallgeese EW\": \"The OZ-00MS Tallgeese is the ancestor of every mobile suit in Gundam Wing - the original prototype from which the five Gundams and the mass-production Leo descend. It is brutally overpowered, its raw thrust strong enough to physically punish the pilot, a deliberately classical, knightly design (shown here in the Endless Waltz refresh).~|~It is flown by Zechs Merquise - secretly Milliardo Peacecraft - the masked 'Lightning Count' who serves as Wing's Char-analogue rival to Heero Yuy, and later by the charismatic Treize Khushrenada. Both men are aristocratic warriors wrapped up in the series' themes of chivalry and pacifism.~|~Within Wing's politics the Tallgeese is a relic the protagonists keep resurrecting because nothing else matches it. As a kit the EW Tallgeese is a tall, elegant, almost armored-knight design that stands apart from the busier Gundams.\", \"MG Wing Gundam Zero EW Ver Ka\": \"The XXXG-00W0 Wing Gundam Zero is the ultimate machine of Gundam Wing, built directly from the original Operation Meteor plans that the five Gundams were derived from. The Endless Waltz version trades the bird-mode wings for the famous feathered 'angel wings,' and it carries twin buster rifles and the ZERO System - a neural interface that floods the pilot's mind with battlefield predictions, powerful but psychologically destabilizing.~|~It is piloted chiefly by Heero Yuy, the coldly disciplined lead Gundam pilot whose perfect-soldier conditioning is slowly broken open by the war's human cost. The ZERO System literalizes the series' theme of the toll combat takes on young minds.~|~Endless Waltz and its angel-winged Wing Zero are among the most beautiful designs in Gundam, and the Ver.Ka treatment makes this one of the most decal-heavy, showcase-grade Master Grades Katoki ever produced - a true display centerpiece.\", \"MG Unicorn Gundam Ver Ka\": \"The RX-0 Unicorn Gundam is the centerpiece of Gundam UC (UC 0096), a Federation prototype hiding extraordinary psychoframe technology. In its white 'Unicorn Mode' it looks almost ceremonial, but when it senses combat it activates the NT-D system and transforms into the red-veined, energized 'Destroy Mode,' its armor splitting to expose glowing psychoframe.~|~Its pilot is Banagher Links, an idealistic young man who inherits the machine and becomes entangled in the search for 'Laplace's Box,' a secret that could upend the Federation. Banagher's gentle insistence on possibility against cynicism drives the saga.~|~Unicorn is the franchise's slickest modern UC entry, and the Unicorn is its breakout design - a direct spiritual successor to the RX-78 lineage built around the Newtype mythology. The Ver.Ka is a dense, transformation-laden showpiece kit beloved by builders.\", \"MG Sazabi Ver Ka\": \"The MSN-04 Sazabi is Char Aznable's personal flagship in Char's Counterattack (UC 0093), the culmination of his career as a commander. A massive Newtype-use mobile suit, it carries funnels - remote thought-controlled weapons - and a psychoframe cockpit, all wrapped in Char's signature red and built to outmatch anything the Federation fields.~|~By this point Char leads Neo Zeon openly, no longer the masked subordinate but the man trying to force humanity off Earth by dropping the asteroid Axis. The Sazabi is the machine of Char at his most powerful and most extreme.~|~Char's Counterattack is the definitive end of the Amuro-versus-Char saga, and the Sazabi-versus-Nu duel is its climax. As a kit the Ver.Ka Sazabi is an enormous, intricate red monument and the natural rival display piece to the Nu Gundam.\", \"MG Nu Gundam Ver Ka\": \"The RX-93 Nu Gundam is Amuro Ray's final and greatest machine, built for Char's Counterattack (UC 0093). Amuro co-designed it, and it debuts the revolutionary psychoframe - a Newtype-responsive material woven into the cockpit - along with the Fin Funnels, detachable remote weapons he controls by thought that double as a defensive barrier.~|~Amuro, now a seasoned Federation ace with Londo Bell, builds the Nu specifically to stop his old rival Char from dropping Axis onto Earth. The suit is the mature endpoint of the frightened boy from the original series.~|~The Nu is, for many fans, the single greatest Gundam design, and its final clash with the Sazabi - ending in the miraculous push against Axis - is the emotional summit of the Universal Century. The Ver.Ka is the showcase rendition every UC builder eventually wants.\", \"MG Freedom Gundam Ver 2.0\": \"The ZGMF-X10A Freedom is Kira Yamato's iconic machine in the second half of Gundam SEED (Cosmic Era). A nuclear-powered ZAFT prototype, its signature is the multi-lock 'full burst' mode, simultaneously firing its beam rifle, twin plasma cannons, and twin rail guns to disable many targets at once.~|~Kira Yamato is SEED's protagonist, a Coordinator who pilots the Freedom while trying to stop the fighting on both sides rather than win for a faction. His near-pacifist stance - shooting to disable rather than kill - is embodied in the Freedom's design philosophy.~|~Freedom is one of the most popular suits of the Cosmic Era and a symbol of SEED's themes of refusing inherited hatred. Ver 2.0 is the modern, well-engineered MG that does justice to its winged, golden-trimmed silhouette.\", \"HG Zaku II (Revive)\": \"The MS-06 Zaku II is the Principality of Zeon's mass-production mobile suit and the backbone of its war machine in the One Year War (UC 0079). This 'Revive' release is Bandai's modern engineering refresh of the classic green grunt, with updated articulation and proportions.~|~Rather than belonging to one named pilot, the Zaku is the everyman enemy - the suit flown by countless Zeon soldiers, the green wall the Federation had to overcome. It is the machine that proved mobile suits could win a war.~|~Few mecha are as culturally significant as the standard Zaku; it is the template for the 'enemy mass-production robot' across all of anime. As a build, the Revive Zaku is an affordable, satisfying gateway kit and the natural mass-production companion to Char's red command type.\", \"HG Bocata's Gelgoog (GQ)\": \"This is a custom MS-14-type Gelgoog from Mobile Suit Gundam GQuuuuuuX (2025), the first Gundam TV series set in an alternate Universal Century, produced by Sunrise together with Studio Khara - the studio of Hideaki Anno and the former Gainax crew behind Evangelion. The kit is painted in the on-screen colors of the pilot Bocata.~|~GQuuuuuuX reimagines One Year War-era machines and characters in a divergent timeline rather than retelling the original story, so familiar Zeon hardware like the Gelgoog reappears in fresh contexts and color schemes.~|~Historically the Gelgoog was Zeon's high-performance answer to the Gundam that arrived too late to change the war; GQuuuuuuX gives it a second life. For a Zeon-leaning collector it is a stylish, modern reinterpretation of a classic foe.\", \"HGUC Zaku Mariner\": \"The MS-06M Zaku Mariner (Zaku Marine Type) is an amphibious variant of the Zaku II developed for underwater and coastal operations in the One Year War (UC 0079). It was an early experiment in marine mobile suits that helped pave the way for Zeon's purpose-built aquatic line.~|~Like most Zaku variants it is a mass-production soldier's machine rather than an ace's, fielded by Zeon naval forces contesting the Earth's oceans against the Federation.~|~It belongs to Zeon's distinctive underwater MS family alongside the Gogg and Z'Gok, a corner of UC design that gives a collection thematic variety. It is a niche but characterful pull for a One Year War Zeon shelf.\", \"HG Gaia's/Ortega's Rick Dom (GQ)\": \"This Rick Dom is the Black Tri-Stars' machine reimagined for Mobile Suit Gundam GQuuuuuuX (2025). One kit builds either Gaia's or Ortega's unit, each in the trio's signature purple with unique markings, and it transforms into a high-mobility form to evoke their famous coordinated assault.~|~The Black Tri-Stars - Gaia, Mash, and Ortega - are legendary Zeon aces known for the devastating 'Jet Stream Attack,' a three-machine charge. GQuuuuuuX brings them back in its alternate continuity, trading on their reputation as a fan-favorite enemy unit.~|~The Rick Dom was the space-capable version of the ground-assault Dom, a heavy hover-tank of a suit. This GQuuuuuuX release modernizes it with on-screen articulation and the Anno-era studio's restyling, a sharp pickup for a Zeon collector.\", \"MG GM Sniper II (White Dingo)\": \"The RGM-79SP GM Sniper II is an elite long-range variant of the Federation's mass-production GM, here in the colors of the White Dingo team from the One Year War side stories. The GM was the Federation's answer to the Zaku - a simplified, mass-producible machine built from Gundam data - and the Sniper II upgrades it with precision optics and a long-barreled beam rifle.~|~The White Dingo team is a Federation special unit featured in the game-based 0079 side material, a small squad of veteran pilots operating in the war's lesser-told theaters.~|~Where the Gundam is the hero's one-off prototype, the GM line is the suit that actually let the Federation win through numbers, and the Sniper II is its sharpshooter specialist. It is a great pick for collectors who appreciate the workmanlike grunt side of the UC.\", \"MG Kampfer\": \"The MS-18E Kampfer is a Zeon high-speed raid prototype from War in the Pocket (UC 0079), engineered for a single overwhelming hit-and-run strike. It carries a disposable arsenal - shotguns, chain mines, beam sabers, a bazooka - meant to be expended in one violent sortie rather than sustained combat.~|~In the OVA it is deployed in a desperate covert operation inside a neutral colony, seen largely through the eyes of a child caught up in the fighting, which lends the machine a frightening, intimate menace.~|~War in the Pocket is one of the most acclaimed UC stories for its grounded, tragic view of war, and the Kampfer is its standout Zeon machine - sleek, aggressive, and beloved by builders for its purposeful, weapons-forward design.\", \"MG Gouf Custom\": \"The MS-07B-3 Gouf Custom is the personal machine of Zeon ace Norris Packard in The 08th MS Team (UC 0079), an upgraded melee Gouf armed with a three-barreled gatling gun, a gatling shield, and a heat rod whip. It is a brawler's mobile suit, built for close-quarters dominance.~|~Norris Packard is a veteran Zeon pilot defined by loyalty and honor, and his final battle in the Gouf Custom - holding off multiple Federation suits to protect those he serves - is regarded as one of the most respected pilot moments in the entire UC.~|~The 08th MS Team is celebrated for its realistic, ground-level depiction of the war, and the Gouf Custom is its iconic Zeon machine. It elevates Ramba Ral's classic Gouf into an ace-grade powerhouse and is a favorite of melee-minded builders.\", \"HGUC Geara Doga\": \"The AMS-119 Geara Doga is the standard mass-production mobile suit of Char's Neo Zeon in Char's Counterattack (UC 0093). A refined descendant of the Zaku and Dom lineage, it is rugged, well-balanced, and built in numbers to crew Char's final rebellion.~|~It is a grunt machine flown by Neo Zeon's rank and file, though ace and commander versions exist; it represents the disciplined military force Char assembles for his last campaign against the Earth.~|~As the workhorse standing behind the Sazabi, the Geara Doga is the definitive late-UC Zeon mass-production suit. This HG is an affordable way to field the machine that fills the ranks of Char's Counterattack.\", \"MG Zaku Cannon (Unicorn Ver.)\": \"The MS-06K Zaku Cannon is a fire-support variant of the Zaku II mounting a heavy shoulder cannon, here decorated in Gundam UC (0096) colors. Trading mobility for ranged firepower, it provided bombardment support during the One Year War.~|~It is a soldier's support machine rather than an ace's, and its appearance decades later in the Unicorn era shows Neo Zeon remnants still fielding upgraded One Year War hardware.~|~The Zaku Cannon is a reminder of how the UC keeps its classic machines in service across generations, refurbished and repainted. It is a characterful artillery pull that bridges the original war and the Unicorn timeline.\", \"MG Marasai (Unicorn Ver.)\": \"The RMS-108 Marasai began as a Titans suit in Zeta Gundam (UC 0087), a Zeon-derived design produced by Anaheim for the Earth Federation's elite Titans faction. This release wears the 'Sleeves' markings of the Neo Zeon remnants in Gundam UC (0096).~|~Its journey from Titans hardware to Sleeves machine captures a recurring UC truth: mobile suits change hands, factions, and paint across the decades as the same hulls are recaptured and reused.~|~A clean, soldierly design, the Marasai is a strong supporting unit for either a Gryps War or a Unicorn-era display, and the Sleeves colors tie it directly to the Sinanju and Kshatriya of the Neo Zeon remnant fleet.\", \"MG Hi-Nu Gundam Ver Ka\": \"The RX-93-ν2 Hi-Nu Gundam is the upgraded version of Amuro's Nu Gundam from the novel Beltorchika's Children, an alternate retelling of Char's Counterattack. It reimagines the Nu 'as it would have been with more development time': a bulkier frame, a redesigned head, and large swept-back fin funnels mounted on the backpack.~|~It is still Amuro Ray's machine, built for the same final confrontation with Char, but in the novel continuity rather than the film - making it the definitive 'what-if' of his last Gundam.~|~Visually distinct from the Nu and consistently among the most requested perennial-sellout kits, the Hi-Nu in Ver.Ka form is a builder's grail. Displayed beside the Nu and Sazabi, it completes the constellation of Amuro's final machines.\", \"MG Sinanju Ver Ka\": \"The MSN-06S Sinanju is the crimson flagship of the Neo Zeon remnants in Gundam UC (UC 0096), here in the original Katoki Ver.Ka design. It is a high-performance Newtype-use machine covered in gold engraving and the 'Sleeves' markings, rebuilt by the remnant force from a stolen Anaheim prototype.~|~Its pilot is Full Frontal, the charismatic, hollow 'Second Coming of Char' who leads the Sleeves and serves as the saga's principal antagonist - a man deliberately styled after the legendary Red Comet.~|~The Sinanju is one of the most ornate and beloved villain suits in modern Gundam, and the Ver.Ka is its prestige rendition with the famous dense waterslide sheet. It is the definitive showcase build for the Neo Zeon remnant aesthetic.\", \"MG Zeta Gundam Ver 2.0\": \"The MSZ-006 Zeta Gundam is the transformable hero machine of Zeta Gundam (UC 0087), the AEUG's answer to the Titans. It converts without part-swapping into a Waverider, an atmospheric flight form, making it a landmark of transforming mobile suit engineering.~|~Its pilot is Kamille Bidan, a gifted, volatile young Newtype whose brutal coming-of-age in the Gryps War - and its devastating personal cost - makes Zeta one of the darkest and most acclaimed entries in the franchise.~|~The Zeta is a top-tier fan-favorite design and the emotional core of one of the UC's greatest series. Ver 2.0 is the engineering-heavy MG that finally delivers a clean, reliable transformation, a milestone kit for any UC builder.\", \"MG Char's Gelgoog Ver 2.0\": \"The MS-14S Gelgoog is Char Aznable's red command unit at the close of the One Year War (UC 0079). The Gelgoog was the first Zeon mobile suit to match the Gundam's performance, and Char's high-spec version is its finest expression.~|~Flown by Char in the war's final battles, it is the machine he takes into the climactic fighting at A Baoa Qu, very nearly turning the tide before Zeon's collapse.~|~It is the high point of Char's One Year War arc, bridging the Zaku he made famous and the suits of his later career. Ver 2.0 renders it with modern engineering, a sleek red companion to the rest of a Char-focused collection.\", \"MG Dom\": \"The MS-09 Dom is Zeon's heavy ground-assault mobile suit of the One Year War (UC 0079), distinguished by its hover propulsion and its scattering beam weapon nicknamed the 'screaming nimbus.' A purple powerhouse, it brought surprising speed and heavy firepower to Zeon's ground campaign.~|~It is most famously associated with the Black Tri-Stars, who flew Doms in their coordinated assaults, though it served widely as a frontline heavy unit.~|~The Dom is a fan-favorite Zeon ground machine, hulking yet fast, and a staple of the One Year War. Its deep purple scheme makes it a striking build and a natural anchor for a Zeon ground-forces display.\", \"MG Guncannon\": \"The RX-77-2 Guncannon is the Federation's mid-range artillery Gundam-type from the original Mobile Suit Gundam (UC 0079), developed alongside the RX-78. Its shoulder cannons make it a support bombardier, trading the Gundam's frontline versatility for ranged punch and heavier armor.~|~Aboard the White Base it is crewed by Kai Shiden, the wisecracking, initially reluctant member of the young crew, whose growth mirrors the show's coming-of-age themes.~|~As one of the original trio - Gundam, Guncannon, Guntank - the Guncannon is a foundational UC machine and a piece of the franchise's bedrock. It rounds out any display of the original series' Federation hardware.\", \"HGUC Kshatriya\": \"The NZ-666 Kshatriya is a four-winged Neo Zeon mobile armor in Gundam UC (UC 0096), descended from the Elmeth and Quin Mantha psycommu lineage. Its four binders carry 24 funnels, making it an overwhelming all-range attacker that can fill space with remote fire.~|~Its pilot is Marida Cruz, a tragic cyber-Newtype - a human artificially engineered and conditioned into a living weapon - whose gentle nature survives despite the abuse done to her. She is one of the saga's most sympathetic figures.~|~The Kshatriya is a fan-favorite of the Unicorn era for its bulk, its bristling funnel arsenal, and Marida's story. This HG is the accessible way to field one of Neo Zeon's most fearsome machines.\", \"MG Gundam Mk-II Ver 2.0 (Titans)\": \"The RX-178 Gundam Mk-II is the Earth Federation's next-generation prototype in Zeta Gundam (UC 0087), shown here in the menacing black colors of the elite Titans faction that originally built three of them. Its great technical legacy is the movable frame - an internal skeleton concept that revolutionized how mobile suits were designed thereafter.~|~Before the heroes take it, the Mk-II belongs to the Titans, the Federation's brutal anti-Spacenoid task force, making the black version the 'villain origin' livery of the machine.~|~The Mk-II is a pivotal design in UC history for introducing the frame technology that everything from the Zeta onward builds on. Ver 2.0 in Titans black is a sleek, sinister counterpart to the AEUG version.\", \"MG Hyaku Shiki Ver 2.0\": \"The MSN-00100 Hyaku Shiki is the gold AEUG mobile suit of Zeta Gundam (UC 0087), famous for its distinctive gold anti-beam coating and clean, lean lines. It was derived from an abandoned transforming-Gundam project, leaving it a sharp, conventional high-performer.~|~It is piloted by Quattro Bajeena - Char Aznable operating under a thin disguise during his AEUG years - fighting the Titans alongside Kamille. The Hyaku Shiki is the suit of Char in his 'Lieutenant Quattro' phase.~|~Visually one of the most striking machines in the franchise thanks to that gold finish, the Hyaku Shiki is a high point of Char's middle career. Ver 2.0 modernizes the engineering of this beloved AEUG icon.\", \"MG Qubeley\": \"The AMX-004 Qubeley is the elegant white Newtype flagship of Zeta and ZZ Gundam (UC 0087-0088). A psycommu machine equipped with funnels and a distinctive horned, caped silhouette, it is built around overwhelming all-range Newtype combat.~|~Its pilot is Haman Karn, the young, ruthless regent who rules Axis Zeon (Neo Zeon) and stands as one of the UC's most formidable and coldly capable antagonists.~|~The Qubeley is among the most graceful villain designs in Gundam, instantly recognizable and tied to one of the franchise's great commanders. It is a standout display piece for any Neo Zeon or Newtype-themed collection.\", \"MG The-O\": \"The PMX-003 The-O is the hulking personal mobile suit of Zeta Gundam (UC 0087), deceptively agile for its enormous bulk thanks to a dense thruster layout hidden in its bloated frame. It is a brute-force Newtype machine designed to overpower opponents up close.~|~It belongs to Paptimus Scirocco, the manipulative, charismatic Newtype born on Jupiter who schemes to seize control of Earth from behind the scenes. The-O reflects his confidence and raw power.~|~The The-O versus Zeta clash is one of the series' climactic Newtype duels. As a kit it is a massive, unusual design - a fan-favorite for its sheer presence and a heavyweight anchor for a Gryps War shelf.\", \"MG Gundam GP01Fb (Zephyranthes)\": \"The RX-78GP01-Fb 'Full Vernian' Zephyranthes is a space-combat Gundam from 0083 Stardust Memory (UC 0083), an RX-78 successor from the Federation's secret Gundam Development Project. The Fb upgrade swaps in a full-thrust booster backpack after the unit's atmospheric deployment, optimizing it for zero-gravity dogfighting.~|~It is piloted by Kou Uraki, an earnest young test pilot pulled into a Zeon-remnant conspiracy that escalates into a near-catastrophe and, in its aftermath, the formation of the Titans.~|~0083 is prized for its OVA-grade animation and its bridge between the One Year War and Zeta. The GP01Fb is a clean, classic Gundam silhouette and a satisfying entry point into the Development Project lineage.\", \"MG Gundam GP02A (Physalis)\": \"The RX-78GP02A Physalis is the nuclear-armed Gundam of the Development Project in 0083 Stardust Memory (UC 0083), built around an atomic bazooka and heavy shielding that make it less a duelist than a strategic weapon platform.~|~It is stolen and piloted by Anavel Gato, the 'Nightmare of Solomon' - a principled, fanatical Zeon ace who seizes the GP02 to carry out 'Operation Stardust,' an attempt to strike a devastating blow for a fallen Zeon. Gato is one of the most compelling antagonists in the UC.~|~The irony of a Federation Gundam serving as the villain's doomsday machine is central to 0083's drama. The GP02A is a broad-shouldered, imposing design and a centerpiece for any 0083 or Zeon-villain collection.\", \"MG Geara Doga\": \"The AMS-119 Geara Doga is the mass-production mainstay of Char's Neo Zeon in Char's Counterattack (UC 0093), rendered here in 1/100 Master Grade scale. A balanced, rugged evolution of the Zaku lineage, it is the suit built in numbers to crew Char's final uprising.~|~Flown by Neo Zeon's regular pilots, it represents the disciplined military force Char assembles for his last campaign to force humanity off the Earth.~|~As the workhorse standing behind the Sazabi, the MG Geara Doga lets a collector field the machine that fills the ranks of Char's Counterattack at full Master Grade detail - a strong complement to the Sazabi and Nu.\", \"MG Gundam GP03 (Stamen)\": \"The RX-78GP03S Dendrobium Stamen is the core mobile suit of the colossal GP03 'Dendrobium' Orchis weapons system in 0083 Stardust Memory (UC 0083). The Stamen is a capable Gundam on its own, but it docks into an enormous mobile-armor platform bristling with cannons, missiles, and a giant beam weapon.~|~It is Kou Uraki's final machine in the Development Project arc, the ultimate hardware of a program whose existence and misuse reshape UC politics.~|~The full Dendrobium is one of the largest pieces of UC hardware ever built, but the Stamen alone is a clean, classic Gundam. It represents the bleeding edge of the Federation's secret arms race in 0083.\", \"MG Crossbone Gundam X1\": \"The XM-X1 Crossbone Gundam is a pirate Gundam from the Crossbone Gundam manga (UC 0133), built by the Jupiter-based resistance and marked with a defiant skull-and-crossbones. Designed for close combat, it features the heat-dispersing 'ABC Mantle,' beam weapons, and a detachable core fighter.~|~It is piloted by Tobia Arronax (alongside Kincaid Nau), a young man who is swept into the fight against the tyrannical Jupiter Empire. The Crossbone manga, written by Yoshiyuki Tomino and drawn by Yuichi Hasegawa, is a beloved late-UC cult saga.~|~With its swashbuckling melee identity and pirate motif, the Crossbone X1 stands apart from the franchise's military machines. It is a fan-favorite design and a distinctive, characterful build for a deep-UC collection.\", \"MG Gundam F91 Ver 2.0\": \"The F91 Gundam (Formula 91) is a compact, next-generation Gundam from Gundam F91 (UC 0123), engineered to be smaller and far more powerful than its predecessors. Its signature is the Metal Peel-off Coating, which sheds excess heat as glowing afterimages when pushed to its limits.~|~It is piloted by Seabook Arno, a teenage civilian caught up in the sudden war launched by the aristocratic Crossbone Vanguard. F91 opens the Cosmo Babylonia era, a later chapter of the UC timeline.~|~F91 marked a deliberate generational reset for the franchise, and its title machine is a sleek, efficient design beloved for its restraint. Ver 2.0 brings modern engineering to one of the UC's underappreciated greats.\", \"MG Banshee Ver Ka\": \"The RX-0 Unicorn Gundam 02 Banshee is the black-and-gold sister unit to the Unicorn in Gundam UC (UC 0096). It shares the Unicorn's psychoframe and NT-D system but carries heavier 'Armed Armor' equipment - a beam-cannon shield and a clawed close-combat unit - giving it a more aggressive profile.~|~Initially it is turned against Banagher by the Vist Foundation's forces, serving as the Unicorn's dark mirror before the saga's allegiances shift.~|~The Banshee is the menacing counterpart to the white Unicorn, and the two displayed together are an iconic light-and-dark pairing. The Ver.Ka makes it a striking, gold-trimmed showcase build.\", \"PG Unleashed RX-78-2 Gundam\": \"This is the RX-78-2 Gundam at the Perfect Grade 'Unleashed' standard - Bandai's most detailed and engineering-intensive 1/60 rendition of the original Gundam. In lore it remains the Federation's secret One Year War prototype (UC 0079) that turned the tide and rewrote mobile suit warfare.~|~It is Amuro Ray's machine, the suit in which a frightened civilian teenager becomes the war's decisive ace and one of the first Newtypes - the foundation of the entire Universal Century saga.~|~As the flagship modern Perfect Grade, the Unleashed RX-78-2 is the ultimate plastic expression of the most important robot in the franchise - a true centerpiece, advanced articulation and internal detail included.\", \"PG Unleashed Nu Gundam\": \"This is Amuro Ray's RX-93 Nu Gundam at the new Perfect Grade Unleashed standard, with fully deployable Fin Funnels and exposed psychoframe detail. The Nu was Amuro's final, self-co-designed machine for Char's Counterattack (UC 0093), built specifically to stop Char from dropping Axis onto Earth.~|~It represents the mature culmination of Amuro's journey from the original series, and its climactic duel with the Sazabi is the emotional peak of the UC.~|~At Perfect Grade Unleashed scale and complexity, the Nu is a grail-tier centerpiece - the most ambitious plastic version of one of the franchise's most beloved machines.\", \"MG Gundam Mk-II Ver 2.0 (A.E.U.G.)\": \"The RX-178 Gundam Mk-II in white-and-blue AEUG colors is the Mk-II after the anti-Titans rebel faction stole the three prototypes in Zeta Gundam (UC 0087). It carries the same movable-frame breakthrough that revolutionized later mobile suit design.~|~In AEUG hands it is flown by Kamille Bidan and other pilots as the group's frontline Gundam before the more advanced Zeta arrives, making it the rebels' early hero machine.~|~This is the 'good guys' livery of a pivotal UC design, the suit that proved the movable-frame concept in action. Ver 2.0 in AEUG colors pairs naturally with the Zeta and the Titans Mk-II for a full Gryps War lineup.\", \"MG Zeta Plus C1\": \"The MSZ-006C1 Zeta Plus is a mass-production development of Kamille's Zeta Gundam from Gundam Sentinel (UC 0088), a transformable, Waverider-capable variant produced for the Earth Federation. It refines the Zeta's transforming design into a deployable production machine.~|~Sentinel is a renowned print-only side story famous for its elite ALICE-system suits and its sharp Katoki-driven mechanical designs, fleshing out the late-Gryps Federation.~|~The Zeta Plus is a sleeker, more utilitarian take on a beloved silhouette, and a deep-cut favorite among UC enthusiasts who appreciate the Sentinel lineage. It is a refined display piece beside the original Zeta.\", \"MG ReZEL (Commander Type)\": \"The RGZ-95 ReZEL (Refine Zeta) is the Earth Federation's transformable mass-production mobile suit in Gundam UC (UC 0096), a modern descendant of the Zeta's transforming heritage. The Commander Type adds enhanced armament and command equipment over the standard line.~|~It is fielded from the battleship Ra Cailum and by ECOAS special forces against the Neo Zeon remnants, serving as the Federation's reliable frontline machine of the era.~|~The ReZEL shows how the Zeta's once-exotic transforming technology became standard issue decades later. The Commander Type is a strong, contemporary Federation unit that complements the Unicorn-era cast.\", \"MG Delta Plus\": \"The MSN-001A1 Delta Plus is a transformable Federation mobile suit in Gundam UC (UC 0096), a production realization of the Delta Gundam concept that the gold Hyaku Shiki had originally been based on - finally achieving the transformation that Char's machine could not.~|~It is flown by Riddhe Marcenas, a conflicted young officer whose arc weaves through the Unicorn saga's questions of duty and idealism.~|~The Delta Plus closes a design loop opened back in Zeta Gundam, turning an abandoned transforming concept into reality. Its sleek Waverider form makes it an elegant companion piece in a Unicorn-era display.\", \"MG Sinanju Stein (Narrative Ver.)\": \"The MSN-06S Sinanju Stein was built by Anaheim Electronics as a high-performance prototype under the same secret 'UC Project' that produced the RX-0 Unicorn Gundams. 'Stein' is German for stone - it is the bare, unpainted base machine that was later stolen and rebuilt by the Sleeves into Full Frontal's crimson Sinanju. In this 'Narrative Ver.' it is recovered and refit as the antagonist machine of Gundam NT / Narrative (UC 0097), armed with a brutal heavy-weapons loadout including a large beam gatling.~|~Its pilot is Zoltan Akkanen, an artificial Newtype - a lab-made attempt to manufacture the perception abilities that natural Newtypes possess. The process left him unstable, in chronic pain, and bitterly resentful of the 'real' Newtypes the universe seemed to favor, and he pilots the Stein as an instrument of that rage. He is a tragic figure rather than a simple villain.~|~As the Narrative climaxes, the Sinanju Stein becomes the core unit of the colossal II Neo Zeong, a successor to Full Frontal's massive Neo Zeong that wraps the Stein in an enormous psycommu-controlled body. Thematically the Stein bridges the franchise's recurring tragedy of manufactured versus natural Newtypes, and it is literally the progenitor of the red Sinanju - displaying the two together tells the whole 'stone-to-crimson' story in plastic.\", \"MG Full Armor Unicorn Gundam Ver Ka\": \"The RX-0 Unicorn Gundam in Full Armor configuration is Banagher's machine hung with the complete external armament from Gundam UC (UC 0096): beam gatlings, twin hyper bazookas, and missile and grenade packs covering nearly every hardpoint. It is the Unicorn at maximum firepower, built for the saga's most intense battles.~|~It retains the Unicorn's psychoframe and NT-D transformation beneath the armor, so the suit still shifts into Destroy Mode even while bristling with weapons.~|~The Full Armor Unicorn is one of the most imposing and weapon-dense designs in modern Gundam, and the Ver.Ka treatment makes it a famously involved, showcase-grade build - a true statement centerpiece for a Unicorn collection.\", \"MG Gundam NT-1 Alex Ver 2.0\": \"The RX-78NT-1 'Alex' is a Newtype-dedicated Gundam from War in the Pocket (UC 0079), fitted with rapid-response systems and optional Chobham Armor designed to handle a Newtype pilot's reflexes. It was built specifically as an upgrade intended for Amuro Ray.~|~Amuro never receives it; instead the Alex sits at the heart of the OVA's intimate, tragic story, seen through the eyes of a child in a neutral colony as a covert Zeon raid closes in. The result is a 'Gundam for a pilot who never came.'~|~War in the Pocket is one of the most respected UC stories for its grounded, human-scale tragedy, and the Alex is its quiet, poignant centerpiece. Ver 2.0 brings a modern frame to this understated but storied machine.\", \"MG Gouf Ver 2.0\": \"The MS-07B Gouf is Zeon's close-combat successor to the Zaku in the original Mobile Suit Gundam (UC 0079), a melee specialist with built-in finger vulcans and a heat-rod whip. Its blue frame and brawler's loadout set it apart from the ranged Zaku.~|~It is famously the machine of Ramba Ral, the honorable veteran Zeon commander whose chivalry and skill leave a lasting mark on Amuro - punctuated by the iconic line, 'The Gouf is not the same as a Zaku!'~|~Ramba Ral and his Gouf are among the most beloved Zeon foes of the original series, embodying the honorable-enemy archetype. Ver 2.0 gives this classic melee machine the modern engineering it deserves.\", \"HGUC Psycho Gundam Mk-II\": \"The MRX-010 Psyco Gundam Mk-II is a gigantic Titans psycommu mobile armor from Zeta Gundam (UC 0087), a transformable terror weapon of enormous scale built to overwhelm with sheer size and remote-controlled firepower.~|~It is piloted by Rosamia Badam, a cyber-Newtype whose fractured, manipulated mind makes her one of the series' tragic enhanced-human casualties - a recurring theme of the Gryps War.~|~Among the largest classic UC machines, the Psycho Gundam Mk-II is a dramatic, imposing display piece. Its scale demands a sturdy stand, but it makes a commanding centerpiece for a Titans or Zeta-era collection.\", \"HGUC Moon Gundam\": \"The MSA-0011+ Moon Gundam is the title machine of the Mobile Suit Moon Gundam manga (UC 0094, set between Char's Counterattack and F91). It is a psychoframe-equipped successor machine, evolved from a Neo Zeon prototype lineage and fitted with advanced Newtype-use systems and a distinctive crescent-shaped armament.~|~The Moon Gundam manga, designed by Ippei Gyoubu, expands the under-explored post-Char period of the UC, exploring the lingering Newtype questions left after Axis.~|~The Moon Gundam emerges from the rebuilt Varguil, tying it directly to that machine's story. It is a striking, unconventional late-UC design and a deep-cut pull for collectors following the manga side of the timeline.\", \"HG Varguil (Gundam Base Ltd)\": \"The AMS-123X Varguil is a Neo Zeon Newtype-use prototype from the Mobile Suit Moon Gundam manga (late UC, around 0094). Conceived as a testbed for next-generation psycommu technology with a generator far stronger than a Geara Doga's and Gundarium armor, it was ultimately downgraded to a conventional cockpit - one of several prototypes in the lineage of experimentation that led toward the Sazabi.~|~It is piloted by Agos Lagarto, a cyber-Newtype raised in Neo Zeon's Newtype labs. This Gundam Base exclusive depicts the Varguil refit with the head and Psycho Plates of the Psycho Gundam Mk-IV G-Doors, a Titans-remnant relic recovered at the Moon Moon colony.~|~That reconstruction is the very configuration that ultimately becomes the Moon Gundam, making the Varguil a key origin piece in the manga's story. It is a niche but lore-rich machine that ties the late-UC Newtype-weapon thread together.\", \"MG Gundam Stormbringer P.F.\": \"The Gundam Stormbringer is a custom Gunpla from Gundam Build Divers: GIMM & BALL's World Challenge, built by the player Gimm of the V'cards team. It begins as a GM Dominance that is upgraded and rebuilt into a true Gundam, with a new heroic head, chest, and a high-mobility backpack. The 'P.F.' is its final, fully powered-up form, featuring newly molded weapons and parts.~|~Gimm is a competitive Gunpla Battle player in the GBN virtual arena, so the Stormbringer is a builder-character's personal creation rather than a mobile suit from a war story.~|~As a Build-series original, the Stormbringer celebrates the model-building hobby itself - the idea that a humble mass-production GM can be customized into a one-of-a-kind hero machine. It is a fitting trophy piece for a builder's shelf.\", \"MG Jegan (Char's Counterattack)\": \"The RGM-89 Jegan is the Earth Federation's standard mass-production mobile suit in Char's Counterattack (UC 0093) and the backbone grunt of the late Universal Century for decades afterward. Reliable, sturdy, and unglamorous, it is the 'GM of its generation.'~|~It is flown by Londo Bell's rank-and-file pilots against Char's Neo Zeon, the dependable many against the elite few. Its very ordinariness underscores the heroism of the soldiers who crew it.~|~The Jegan is a quietly important UC machine - the suit that defines the Federation's late-century mass production and recurs through Unicorn and beyond. It is an essential supporting unit for any CCA or Unicorn-era display.\", \"MG Qubeley Mk-II (Ple)\": \"The AMX-004-2 Qubeley Mk-II is the successor to Haman Karn\\u0027s Qubeley, built for the Cyber-Newtype Elpeo Ple during the First Neo Zeon War of ZZ Gundam. Ple\\u0027s unit is famously finished in black, distinguishing it from the white original, and retains the funnel-heavy loadout that makes Qubeley-type suits so deadly in Newtype hands.~|~Ple is one of ZZ\\u0027s great tragedies \\u2014 an artificially-forced Newtype child soldier whose story is the series\\u0027 sharpest indictment of weaponizing children\\u0027s minds. Her Qubeley Mk-II carries that weight, the same funnels-and-empathy horror the franchise keeps returning to since Lalah.~|~For a collection that already owns Haman\\u0027s Qubeley, the Mk-II is the natural companion: same lineage, black against white, and a second machine for a ZZ era that currently has almost no depth. Its funnel binders and included display stand are the shelf features.\",\n  \"MG Re-GZ (Char's Counterattack)\": \"The RGZ-91 Re-GZ \\u2014 \\u2018Refined Gundam Zeta\\u0027 \\u2014 is Anaheim\\u0027s attempt at a mass-producible transformable Gundam, and in Char\\u0027s Counterattack it is Amuro Ray\\u0027s mount before the Nu Gundam is ready. Its detachable Back Weapon System grants a Zeta-like flight mode without the cost and complexity of true transformation.~|~In the film the Re-GZ is the honest workhorse: capable but outclassed by the newtype-tier machines around it, which is precisely the point \\u2014 it is what a skilled pilot flies when the miracle machine hasn\\u0027t arrived yet. Amuro switches to the Nu partway through, making the Re-GZ the \\u2018before\\u2019 to the Nu\\u0027s \\u2018after.\\u2019~|~As a display it completes Amuro\\u0027s CCA loadout beside your two Nu kits \\u2014 the backup and the real thing, the same matched-pair logic as an 0080 or 0083 duel. Muted blue-and-white, prime factory-fresh territory.\",\n  \"MG Hizack (Titans)\": \"The RMS-106 Hizack is the Titans\\u0027 primary mass-production mobile suit during the Gryps Conflict \\u2014 developed at Granada with Anaheim Electronics, which had absorbed Zeon\\u0027s old Zeonic Company. Its resemblance to the Zaku II is no accident: it fuses Federation and Zeon technology, inheriting the mono-eye, the greenish palette, and the Zaku\\u0027s production reliability.~|~It is the machine you meet early in Zeta \\u2014 the green suits lying in wait as the AEUG punches out through the colony wall with the stolen Gundam Mk-II. The Hizack has a famous flaw: its generator can\\u0027t power a beam rifle and the suit at full capacity, so it usually carries a 120mm machine gun instead. That gap is why the Titans covet better machines and why the AEUG raid matters.~|~On a shelf the Hizack is the Titans\\u0027 answer to the Zaku \\u2014 the ordinary green grunt of Zeta, the one faction-grunt your collection was missing. Its dark-green Titans scheme distinguishes it from the blue of the regular Federation forces.\",\n  \"HGUC Hambrabi\": \"The RX-139 Hambrabi is a prototype transformable mobile suit fielded by the Titans in Zeta \\u2014 a Mamoru Nagano design whose flattened, stingray-like mobile-armor mode is one of the most distinctive silhouettes in the UC. It carries a Feyadeen rifle and the \\u2018Sea Serpent,\\u2019 a wire-guided claw that delivers crippling electrical shocks.~|~Its most famous pilot is Yazan Gable \\u2014 Zeta\\u0027s standout villain, a sadistic natural pilot with no ideology beyond the thrill of the kill, which makes him more terrifying than the true believers. In Yazan\\u0027s hands the Hambrabi threatens even the Zeta Gundam, and his wolfpack tactics drive some of the series\\u0027 tensest fights.~|~The 2012 HGUC is regarded as one of the best in the line: a complete parts-free transformation, double-jointed limbs, and the wired Sea Serpent in flexible line. Displayed in mobile-armor mode it is a shelf standout.\",\n  \"MG RB-79 Ball Ver.Ka\": \"The RB-79 Ball is the Earth Federation\\u0027s most expendable machine \\u2014 a militarized SP-W03 civilian space work-pod, up-armored and fitted with a 180mm low-recoil cannon as the Federation scrambled to field numbers against Zeon\\u0027s mobile suits. Cheap (about a quarter the cost of a GM), mass-produced by the thousand, and crewed by a single pilot in a cramped sphere.~|~On screen in Mobile Suit Gundam and 0083 it is shorthand for the meat grinder of war: Balls deploy in support of GM teams, and their pilots rarely last long \\u2014 the fandom nickname is \\u2018the spherical coffin.\\u2019 Yet the design has real tactical logic: smaller and faster-accelerating than a GM, short rearm times, lethal at range in the right hands. It is the ordinary face of the war your Gundams fight above.~|~Hajime Katoki\\u0027s 2004 Master Grade Ver.Ka turned this humble pod into a modeler\\u0027s favorite \\u2014 a dense inner frame, metal manipulator shafts, opening cockpit with pilot, and two 1/100 mechanic figures on a display stand. It builds fast and punches far above its station on a shelf, the working-class counterpoint to the hero machines around it.\",\n  \"MG Gyan\": \"The YMS-15 Gyan is one of the strangest and most memorable Zeon designs of the One Year War \\u2014 a knight in mobile-suit form, with a smooth Pickelhaube-helmeted head, rounded silver-blue armor, and a fighting style built entirely around a beam rapier and a shield. Developed by Zimmad as a rival to Zeonic\\u0027s Gelgoog for the Principality\\u0027s second-phase mainstay mobile suit, the Gyan emphasized pure close combat: fluid-pulse-accelerator responsiveness and hands tuned specifically for fencing.~|~It lost. The Gelgoog\\u0027s versatility and its ability to power a beam rifle won the mass-production contract, so the Gyan remained a near one-off \\u2014 customized for Colonel M\\u0027Quve, the fussy, art-collecting officer running Zeon\\u0027s Odessa mining operation. In Mobile Suit Gundam episode 36, M\\u0027Quve duels Amuro\\u0027s Gundam in the Texas Colony: sword-and-shield against beam rifle, fencing against firepower, a villain with no honor speeches and a famous fixation on his pottery.~|~The Gyan is a rare example of a suit whose kit is more beloved than the design ever was in the show \\u2014 Bandai\\u0027s Master Grade leans hard into the medieval-knight motif, with an LED-lit beam rapier, a shield packed with visible mines and missile effect parts, and a 1/20 M\\u0027Quve figure holding his vase. On a Zeon shelf it tells the prototype-trial story: the melee knight that lost to the Gelgoog, displayed beside the machine that beat it.\",\n  \"MG ZZ Gundam Ver.Ka\": \"The MSZ-010 ZZ Gundam is the AEUG's brute-force answer to the escalating First Neo Zeon War \\u2014 a transformable, combinable successor to the Zeta built around raw output: the head-mounted hi-mega cannon alone rivals a battleship's main gun. It splits into the Core Top, Core Base, and Core Fighter, recombining as the G-Fortress for transit and assault.~|~Its pilot is Judau Ashta, a junk-dealing teenager from the Shangri-La colony \\u2014 the working-class counterpoint to Amuro and Kamille \\u2014 and ZZ's tonal whiplash from comedy to tragedy runs right through the machine: the series that starts as a caper ends at the gates of Axis, with Judau facing Haman Karn's Qubeley in one of UC's great final duels. The ZZ carries all of it.~|~The 2017 Master Grade Ver.Ka, overseen by Hajime Katoki for the series' 30th anniversary, is regarded as one of the line's engineering peaks: fully transformable without parts-swapping, two complete core fighters, sliding-joint knees, and the elongated Enhanced-ZZ proportions. It is big, dense, and the definitive statement of an era most collections skip.\",\n  \"RE/100 Nightingale\": \"The MSN-04II Nightingale is Char Aznable's flagship in Beltorchika's Children \\u2014 Yoshiyuki Tomino's novelization of Char's Counterattack that diverged from the film \\u2014 the machine he flies instead of the Sazabi. It is less a mobile suit than a mobile fortress: massive skirt binders packed with funnels and propellant, a mega beam rifle scaled like artillery, and a silhouette wider than it is tall.~|~In the novel's ending, the Nightingale duels Amuro's Hi-\\u03bd Gundam over Axis \\u2014 the same final confrontation as the film, fought with both rivals' machines in their alternate, arguably more extreme forms. For decades the pair existed only in novel illustrations and garage kits, which made them grail designs: the Char's Counterattack that might have been.~|~Bandai launched the entire RE/100 line in 2014 specifically to make suits like this buildable \\u2014 too enormous for Master Grade economics, too beloved to abandon \\u2014 and the Nightingale was RE/100 #001. MG-grade exterior detail on a simplified frame, wedge gates for fast cleanup, and an optional green LED socket in the mono-eye. Displayed opposite a Hi-\\u03bd Ver.Ka, it completes the alternate-universe duel in 1/100.\",\n  \"HGUC Zaku II Kai (FZ)\": \"The MS-06FZ Zaku II Kai is the final evolution of Zeon's workhorse \\u2014 an end-of-war refit with updated thrusters, simplified maintenance, and the distinctive Fritz-helmet B-type head. It debuted in Gundam 0080: War in the Pocket as the machine of Bernard 'Bernie' Wiseman, a rookie pilot with more heart than skill, stationed in the neutral colony of Side 6 in the war's last days.~|~The Kai's defining moment is the duel that ends 0080: Bernie's battered Zaku against the Federation's NT-1 Alex in a colony forest on Christmas Day, each pilot fighting for reasons the other will never learn. It is six episodes of setup for one fight, and it lands as arguably the most devastating ending in the entire franchise \\u2014 a war story about how small wars are, told at the scale of one kid, one machine, and one bad decision.~|~The 2008 HGUC is the definitive kit of the design: swappable A/B heads, the hip-swing mechanism built specifically to recreate the OVA's crash scene, and a warm green scheme distinct from every other Zaku on a shelf. Paired with the NT-1 Alex, it is the whole of 0080 in two kits.\",\n  \"RE/100 Gundam GP04G Gerbera\": \"The RX-78GP04G Gerbera is the Gundam Development Project's ghost \\u2014 the fourth unit, designed for high-speed assault with three massive St\\u00fcrm Boosters, cancelled when the Federation decided its role overlapped the GP01. Anaheim Electronics had already completed the frame, and what happens to an unwanted Gundam is the interesting part.~|~Anaheim quietly rebuilt the incomplete machine and sold it out the back door to Cima Garahau's Zeon remnant fleet as the crimson AGX-04 Gerbera Tetra \\u2014 meaning one of the Gundams of Operation Stardust spends the whole of 0083 fighting against the Federation, its lineage hidden under Zeon paint. It is the franchise's sharpest little parable about the arms industry: Anaheim supplies both sides and the paperwork disappears.~|~No animation ever shows the white GP04 \\u2014 it exists only in design work and manuals \\u2014 which made it resin-kit legend for decades until the 2014 RE/100 finally gave it an injection kit. At 1/100 it completes the GP lineage beside the MG GP01Fb, GP02A, and GP03: the four-chapter story of the project the Federation erased from history.\",\n  \"MG Rick Dias\": \"The RMS-099 Rick Dias in standard AEUG livery \\u2014 the dark gray-blue mass-production colors of the anti-Titans squadron, distinct from Quattro\\u0027s red command unit. Anaheim-built on Zeon-derived engineering, AEUG\\u0027s first mainstay MS with twin clay bazookas.~|~In Zeta it is the workhorse the AEUG rides into its earliest battles \\u2014 seen in numbers before the Zeta and Hyaku Shiki take over. Its Zeon lineage is the point: reformists fighting the Federation\\u0027s police with tech descended from the last war\\u0027s enemy.~|~The older ~2000 first-gen MG; beside your red Quattro Custom it completes the standard-vs-command pair. A clean factory finish flatters the dated mold.\",\n  \"MG Rick Dias (Quattro Custom)\": \"The RMS-099 Rick Dias is the AEUG's first flagship mobile suit \\u2014 built by Anaheim Electronics from the new Gundarium \\u03b3 alloy, with a panoramic cockpit in its head and unmistakable Zeon DNA in its mono-eye, courtesy of the ex-Zeon engineers who designed it. Its original name was '\\u03b3 Gundam'; the AEUG renamed it, but the lineage shows.~|~Its red version is the machine of Quattro Bajeena \\u2014 the alias Char Aznable wears in Zeta Gundam \\u2014 and it opens the series: Quattro's Rick Dias team infiltrates Green Noa and steals the Titans' Gundam Mk-II, the raid that pulls Kamille Bidan into the war. Quattro's personal red became the type's production standard, so for once the entire line wears Char's colors. Amuro Ray also briefly flies one later in the series \\u2014 the only machine both rivals pilot.~|~The early-2000s Master Grade is the design's definitive kit: opening head cockpit, deploying Vulcan phalanx, the clay bazooka and paired beam pistols. In a Char career display it is the essential bridge \\u2014 the suit of the man who is not quite Char, standing between the Zeong he lost at A Baoa Qu and the Hyaku Shiki he wears as Quattro at full stride.\",\n  \"MG Acguy\": \"The MSM-04 Acguy is Zeon's light amphibious mobile suit \\u2014 smaller, cheaper, and stealthier than the Gogg and Z'Gok it serves alongside, built around a low-output reactor that makes it nearly invisible to Federation sensors. Its hunched silhouette, stubby mono-eye head, and telescoping arms made it the odd duck of the Jaburo assault force and, eventually, one of the most beloved designs in the entire franchise.~|~Its defining appearance is the Jaburo infiltration, where Akahana's Acguy squad slips into the Federation's underground fortress \\u2014 the stealth complement to Char's Z'Gok spearhead. The scene of Acguys wading through Jaburo's waterways is one of the original series' great tension-builders, and the suit's later cameo appearances (including a famous one in Unicorn) trade on exactly that sneaking-in energy.~|~Bandai's 2006 Master Grade leans into the charm: full inner frame for its era, working telescoping arms, and proportions faithful to the anime's round pathos. On a Zeon shelf it completes the MSM amphibious trio with the Gogg and Z'Gok \\u2014 three totally different answers to the same underwater problem, side by side.\",\n  \"MG Zaku II Ver 2.0\": \"The MS-06 Zaku II is the machine that started mobile suit warfare \\u2014 Zeon's mass-production workhorse, built in the thousands, and the green shape that means \\u2018enemy\\u2019 in the original series. The J-type ground variant and F-type space variant differ mainly in internals; the silhouette \\u2014 mono-eye, shoulder shield, power pipes \\u2014 is the most recognizable in the franchise after the Gundam itself.~|~Every named Zeon ace started in one, and the anonymous green Zaku is the other half of every famous red one: Char's S-type is a tuned commander variant of exactly this machine. In-universe the Zaku fought on every front of the One Year War, from the colony drops to A Baoa Qu, and its bazooka is the weapon that made the Federation take mobile suits seriously.~|~The 2007 Ver 2.0 Master Grade is widely considered one of Bandai's best-engineered kits ever \\u2014 a full inner frame with working hydraulics detail and the definitive solution to the power-pipe assembly. It shares that frame with the Char's Zaku II Ver 2.0, so a builder who has done one has effectively mastered both.\",\n  \"MG Guntank\": \"The RX-75 Guntank is the oldest of the Federation's Operation V trio \\u2014 half tank, half mobile suit, with treads for legs and the pilot split between a cockpit and an elevated gunner's seat in early configurations. Its 120mm low-recoil cannons out-range everything else on White Base, making it the fire-support anchor of the original team.~|~Piloted first by Ryu Jose and then primarily by Hayato Kobayashi, the Guntank's war is the story of the underdog crewman: it lacks the Gundam's glamour and the Guncannon's mobility, but it holds the line at Jaburo, Odessa, and a dozen desperate defenses of White Base. Its silhouette against the Gundam and Guncannon is the visual shorthand for Operation V itself.~|~The 2001 Master Grade is an early-generation kit \\u2014 simple frame, rolling treads, modest articulation \\u2014 and it shows its age next to a Ver 3.0 RX-78-2. It earns its shelf space a different way: with the MG RX-78-2 and MG Guncannon beside it, the complete White Base mobile suit team stands together in 1/100, and no other kit can finish that picture.\",\n  \"MG Char's Z'Gok\": \"The MSM-07S Z'Gok Commander Type is Char Aznable's amphibious mobile suit from the original Mobile Suit Gundam (UC 0079) \\u2014 the S-type tuned variant of Zeon's mass-production Z'Gok, finished in the Red Comet's signature pink and crimson. Built by MIP for the Marine Corps, it trades the clumsy sealed-hull look of earlier amphibians for a sleeker frame with Iron Nail claws, head-mounted mega particle cannons, and torso missile launchers, equally capable underwater and on land.~|~Its defining moment comes during Zeon's assault on Jaburo, the Federation's underground headquarters in South America. Emerging from the water at the head of the attack, Char's Z'Gok tears through the base's defenses \\u2014 including the iconic scene where it punches its claw clean through a GM's torso, one of the original series' most enduring images of Zeon ace superiority. The raid also marks Char's return to front-line piloting and his first brush with the White Base's defenses at full strength.~|~For Char, the Z'Gok is the bridge machine of his One Year War career \\u2014 after the Zaku II that made his legend and before the Gelgoog and Zeong that closed the war. Kunio Okawara's amphibious design became a fan favorite for exactly the reasons it stands out on a shelf: organic curves, mono-eye menace, and claws instead of rifles. Bandai's November 2003 Master Grade captures it with a simple but well-articulated frame, including the segmented jabara arms.\",\n  \"MG Gogg\": \"The MSM-03 Gogg is one of Zeon's first true amphibious mobile suits in the original Mobile Suit Gundam (UC 0079), a bulky aquatic machine with mega particle cannons and powerful crushing claws built to assault Federation coastal positions from the sea.~|~A mass-production unit rather than an ace's machine, it represents Zeon's effort to dominate Earth's oceans during the war.~|~The Gogg anchors Zeon's distinctive underwater MS family alongside the Z'Gok and Zaku Mariner, a corner of UC design prized for its variety. Its squat, monstrous profile makes it a characterful change of pace in a One Year War collection.\", \"MG Zeong\": \"The MSN-02 Zeong is Char Aznable's monstrous psycommu prototype at the very end of the One Year War (UC 0079), built around wire-guided remote arms and an unfinished, legless lower body. It was rushed into service incomplete - the source of the famous claim that 'it didn't need legs,' since it was meant for zero-gravity Newtype combat.~|~Char takes the Zeong into the war's final clash with Amuro's Gundam at A Baoa Qu, a duel that ends the original series' confrontation between them.~|~A landmark early Newtype-weapon design, the Zeong is huge, strange, and iconic - the prototype that pointed the way toward later psycommu machines like the Sazabi. It is a dramatic, oversized centerpiece for a Zeon collection.\", \"MG Psycho Zaku Ver.Ka (Thunderbolt)\": \"The MS-06R Zaku II 'Psycho Zaku' is a Full Armor prototype from Gundam Thunderbolt (UC 0079), a high-mobility Zaku buried under an enormous bolt-on weapons-and-thruster system that turns it into a flying arsenal.~|~It is piloted by Daryl Lorenz of Zeon's Living Dead Division, a quadruple amputee linked to the machine through a 'Reuse Psycho Device' neural interface that lets his nervous system drive the suit directly - a harrowing image central to Thunderbolt's themes.~|~Gundam Thunderbolt is a stylish, jazz-scored, brutally violent take on the One Year War, and the Psycho Zaku is its signature Zeon machine. The Ver.Ka renders this heavily armed monster as a showcase-grade kit.\", \"MG Gelgoog Cannon\": \"The MS-14C Gelgoog Cannon is a fire-support variant of Zeon's high-performance Gelgoog from the One Year War and MSV (UC 0079), trading some mobility for a heavy back-mounted beam cannon. It was fielded late in the war as Zeon scrambled to counter the Federation's growing mass production.~|~Flown by Zeon's veteran pilots in the war's final battles, it is part of the desperate last-generation hardware Zeon deployed at A Baoa Qu.~|~The Gelgoog was the suit that finally matched the Gundam, and the Cannon variant gives a ranged spin on that pedigree. It is a strong support unit for a One Year War Zeon display.\", \"MG Turn A Gundam\": \"The SYSTEM ∀-99 (WD-M01) Turn A Gundam is the title machine of ∀ Gundam (Correct Century), famously designed by the legendary industrial designer Syd Mead and recognizable by its 'mustache' face. Beneath its odd, organic look lies the Moonlight Butterfly, a nanomachine power so total it once erased civilization across the planet.~|~It is piloted by Loran Cehack, a gentle Moonrace youth caught between the Moon and Earth, whose pacifism contrasts with the machine's apocalyptic capability.~|~∀ Gundam is canonically the far future of every Gundam timeline, and the Turn A's Moonlight Butterfly is the in-universe reason all those histories were swept away - making it the most powerful and thematically significant Gundam of all. It is a distinctive, conversation-piece build.\", \"MG Turn X\": \"The Concept-X 6-1-2 Turn X is the rival counterpart to the Turn A in ∀ Gundam (Correct Century), a machine able to separate its limbs and torso for remote attacks and wielding its own Moonlight Butterfly equal to the Turn A's.~|~It is piloted by Gym Ghingnham, a warlike Moonrace commander who craves the ultimate battle and embodies the destructive impulse the series warns against.~|~Together the Turn A and Turn X are the two most powerful mobile suits in all of Gundam canon, and their final confrontation is the climax of the series. The Turn X's fractured, X-marked design makes it a bold, unconventional display piece.\", \"MG Narrative Gundam C-Packs Ver.Ka\": \"The RX-9/C Narrative Gundam is the protagonist machine of Gundam NT / Narrative (UC 0097), built from incomplete Unicorn-project data as a deliberately conventional, non-psychoframe Gundam. The 'C-Packs' (C-equipment) bolt on extra armor, propellant, and weapons to compensate for its limitations.~|~It is piloted by Jona Basta, a young man burdened by a traumatic past tied to the film's central mystery, hunting the golden Phenex - the third Unicorn-type, now a near-mythical, autonomous machine.~|~Narrative is the direct sequel to Unicorn and explores what it means to fight without the 'gift' of Newtype miracles. The C-Packs Narrative is a chunky, equipment-heavy Ver.Ka and a strong companion to the Sinanju Stein from the same film.\", \"HGUC GP02A Physalis (Type-MLRS)\": \"The RX-78GP02A in its Type-MLRS configuration is the nuclear Gundam of the Development Project (0083, UC 0083) reconfigured with a Multiple Launch Rocket System - a back-mounted rack of six rocket-launcher tubes - in place of the atomic bazooka. It is the conventional-warfare loadout of the Physalis, trading the strategic warhead for sustained saturation firepower.~|~Like the standard GP02, it is the machine seized by Anavel Gato, the 'Nightmare of Solomon,' the principled Zeon-remnant ace at the heart of Operation Stardust.~|~This kit notably includes both the MLRS rocket rack and the atomic bazooka, effectively covering both Physalis configurations in one box. A large, imposing High Grade, it is the rocket-laden face of Gato's stolen Gundam.\", \"MG Sinanju (Anime Ver.)\": \"The MSN-06S Sinanju is the crimson flagship of the Neo Zeon remnants in Gundam UC (UC 0096), here in the anime-accurate OVA configuration with the weapons and proportions as they appeared on screen, including the episode-six rocket bazooka. It is a high-performance Newtype-use machine sheathed in gold engraving and the 'Sleeves' markings, rebuilt from a stolen Anaheim prototype - the Sinanju Stein.~|~Its pilot is Full Frontal, the hollow, charismatic 'Second Coming of Char' who leads the Sleeves as the saga's principal antagonist, deliberately modeled on the legend of the Red Comet.~|~One of the most beloved villain suits in modern Gundam, the Sinanju is a magnificent red centerpiece. The Anime Ver. is the newer, better-armed rendition of the design, and it pairs directly with the Sinanju Stein as the 'crimson' to the Stein's 'stone.'\"};\n  window.showLore=function(name){var t=(typeof LORE!=='undefined')&&LORE[name];if(!t)return;var ov=document.getElementById('lore-modal');if(!ov){ov=document.createElement('div');ov.id='lore-mo s and Rick Dom.\",\n   tips:[\"Smooth build on a solid frame.\",\"Its purple scheme uses your UG08.\",\"The giant bazooka makes a strong pose.\"],checklist:[\"Snap-build the whole kit first and fit-check before any paint touches it.\",\"Audit nubs under raking light; an isopropyl wipe previews the topcoat and separates stress-whitening from real leftover topography.\",\"Corrective-sand only the flagged spots: 400 \\u2192 600 \\u2192 800 \\u2192 1000.\",\"Tear down to single-color subassemblies only \\u2014 deseam the purple cone halves, separate the lighter trim band, lift armor off the gray frame.\",\"Pull every polycap out of its socket and set it aside \\u2014 keep paint off all caps, pegs, and friction joints.\",\"Leave permanent snaps and tight pin-sockets joined; mask those edges instead of forcing them apart.\",\"Mount subassemblies on clips/skewers, then prime \\u2192 paint \\u2192 satin topcoat.\",\"Body purple: C1 40 / C67 40 / C37 15 / C3 5 (all on shelf). Cone band = same mix + extra white. Use true C1 White \\u2014 your warm off-whites tint the purple.\"]},\n  {n:\"MG Guncannon\",g:\"MG\",scale:\"1/100\",diff:3,price:35,priceText:\"$25–45\",time:\"7–10 hrs\",h:\"≈18 cm\",paint:\"Optional for detail\",gates:\"Standard\",parts:\"High\",goodFor:\"White Base trio; 0079 support unit\",loadout:\"Beam rifle, twin 240mm shoulder cannons, spray missile launchers, Core Fighter\",owned:true,q:\"MG RX-77-2 Guncannon\",\n   r:\"The red Federation artillery suit (RX-77-2) and the third member of the White Base trio alongside the RX-78-2 and Guntank. A 2001 mold, but a clean, satisfying build with a transformable Core Fighter and swappable shoulder weapons. Squarely UC, and a natural shelf-mate to your RX-78-2 Ver 3.0.\",\n   tips:[\"Completes the 0079 hero trio next to your RX-78.\",\"Core Fighter / Core Block gimmick is a fun touch.\",\"Uses polycaps — keep paint off the peg joints.\",\"Older mold; mostly molded in color for a clean panel-line build.\"]},\n  {n:\"HG
