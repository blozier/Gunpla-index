ue,q:\"MG Geara Doga\",r:\"Char's Neo Zeon mass-production suit from Char's Counterattack — a natural shelf-mate to the Sazabi.\",tips:[\"A green/gray Zeon scheme that takes a wash beautifully.\"]},\n  {n:\"MG Gundam GP03 (Stamen)\",g:\"MG\",scale:\"1/100\",diff:3,price:45,priceText:\"$40–50\",time:\"7–10 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"High\",goodFor:\"0083 GP-series core unit\",loadout:\"Folding bazooka, shield, rifle, core fighter\",owned:true,q:\"MG Gundam GP03S Stamen 0083\",r:\"The Stamen is the core mobile suit of the GP03 Dendrobium from Stardust Memory — folding arms, detachable armor, and an integrated Core Fighter. Completes the 0083 GP trio.\",tips:[\"Pairs naturally with the GP01 and GP02 for a Stardust Memory shelf.\"]},\n  {n:\"MG Crossbone Gundam X1\",g:\"MG\",scale:\"1/100\",diff:3,price:38,priceText:\"$34–44\",time:\"6–9 hrs\",h:\"≈15.8 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Medium-high\",goodFor:\"The space-pirate Gundam from Tomino\\u0027s Crossbone manga (UC 0133) \\u2014 skull-and-crossbones, cape, and one of the most beloved MG builds ever made. This is the Katoki Ver.Ka edition: includes an alternate chest to build the X1 Kai (Custom) plus the ABC anti-beam mantle. Opens the late-UC era you own nothing in; past CCA in the story, so a buy-for-the-kit pick. UC 0123\\u20130133.\",loadout:\"Beam zanber, buster gun, skull cape\",owned:true,q:\"MG Crossbone Gundam X1 Ver Ka\",r:\"The skull-and-crossbones pirate Gundam from Crossbone — compact, poseable, and full of character.\",tips:[\"Widely rated a top-tier MG build \\u2014 fantastic articulation.\",\"ABS-heavy ~20-year-old frame \\u2014 older-kit expectations; easy on panel-line enamel at stressed joints.\",\"Decide X1 vs. X1 Kai (Custom) before starting \\u2014 the chest part + mantle switch it over.\",\"The cloth cape and skull motifs make it a photography standout.\"]},\n  {n:\"MG RB-79 Ball Ver.Ka\",g:\"MG\",scale:\"1/100\",diff:2,price:28,priceText:\"$28\\u201333\",time:\"4\\u20136 hrs\",h:\"\\u224813 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Low (145)\",goodFor:\"0079/0083 Federation grunt; Katoki Ver.Ka detail\",loadout:\"180mm low-recoil cannon, 2 manipulator arms, display stand, 2 mechanic figures\",owned:true,q:\"MG RB-79 Ball Ver.Ka\",\n   r:\"The most dangerous vehicle to pilot in Gundam \\u2014 the Federation\\u0027s spherical mobile pod, a refitted civilian work-pod with a cannon bolted on. A beloved, detail-crammed 2004 Katoki Ver.Ka with metal arm shafts and a full inner frame; a short, delightful build regarded as one of the best MGs going. UC 0079 / 0083.\",\n   tips:[\"DO NOT panel-line the arms \\u2014 the joints crack (near-universal reviewer warning). Body is fine.\",\"Transparent green viewscreen + opening cockpit with a 1/100 pilot; two mechanic figures for a diorama base.\",\"Warning stickers are numerous but the waterslide option is better \\u2014 crop the sticker sheet if used.\"]},\n  {n:\"MG Hizack (Titans)\",g:\"MG\",scale:\"1/100\",diff:3,price:50,priceText:\"$45\\u201355\",time:\"7\\u201310 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"The Titans grunt \\u2014 your first Titans MS; scale-matches your MG shelf\",loadout:\"Zaku machine gun kai, beam rifle, heat hawk, shield, beam saber\",owned:true,q:\"MG RMS-106 Hi-Zack\",\n   r:\"The Titans\\u0027 workhorse grunt \\u2014 the green mono-eye suit that ambushes the AEUG at the colony breach in Zeta ep.2. Built by the Federation on captured Zaku tech (hence the Zeon look). This is the 2004 Master Grade (Kunio Ohkawara design), which scale-matches your MG shelf \\u2014 it displays right next to the Mk-II and Rick Dias. Fills the one faction-grunt your collection lacked. UC Zeta.\",\n   tips:[\"Known quirk (every review): the rubber arm/shoulder pipes are finicky, easy to mess up, unforgiving to separate \\u2014 go slow there. Your careful workflow handles it.\",\"Older 2004 MG: no inner frame in arms/thighs, slightly forward-heavy \\u2014 seat the feet well so it doesn\\u0027t tip.\",\"Titans dark-green scheme; GD-13 or a Titans sheet works. Panel line + topcoat is the natural finish.\"]},\n  {n:\"HGUC Hambrabi\",g:\"HG\",scale:\"1/144\",diff:3,price:22,priceText:\"$20\\u201325\",time:\"4\\u20136 hrs\",h:\"\\u224813 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Yazan\\u0027s suit \\u2014 Zeta\\u0027s best villain machine; parts-free transform\",loadout:\"Feyadeen rifle, Sea Serpent (wired), beam sabers, tail lance, claws\",owned:false,q:\"HGUC RX-139 Hambrabi\",\n   r:\"Yazan Gable\\u0027s stingray-like transformable Titans suit \\u2014 one of the finest HGUCs Bandai ever cut, with a full parts-free transformation and a wired \\u2018Sea Serpent\\u2019 claw. Mamoru Nagano design. Wait until you meet Yazan; he sells the kit himself. UC Zeta.\",\n   tips:[\"Parts-free transformation MS\\u2194MA \\u2014 the showpiece; follow the manual.\",\"Double-jointed limbs + swiveling hips make it a poser despite its age.\",\"The \\u2018mantaray\\u2019 silhouette photographs beautifully in MA mode.\"]},\n  {n:\"MG Gundam F91 Ver 2.0\",g:\"MG\",scale:\"1/100\",diff:3,price:33,priceText:\"$30–40\",time:\"6–9 hrs\",h:\"≈15 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Compact late-UC flagship\",loadout:\"V.S.B.R., beam rifle, shield\",owned:true,q:\"MG Gundam F91 Ver 2.0\",r:\"The small but advanced F91 with updated Ver 2.0 engineering — a quick, satisfying build.\",tips:[\"Tiny suit; sharp panel lines and clean nubs matter even more at this scale.\"]},\n  {n:\"MG Banshee Ver Ka\",g:\"MG\",scale:\"1/100\",diff:5,price:60,priceText:\"$55–65\",time:\"14–20 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"Unicorn-class psycho-frame beast\",loadout:\"Beam magnum, hyper bazooka, transforming shield, beam sabers\",owned:true,q:\"MG Unicorn Gundam 02 Banshee Ver Ka\",r:\"The black-and-gold novel-colors Banshee in Ver Ka form with a clear-yellow psycho-frame — transforms between Unicorn and NT-D Destroy modes.\",tips:[\"Psycho-frame parts pop with a topcoat; budget time for the destroy-mode transformation.\"]},\n  {n:\"PG Unleashed RX-78-2 Gundam\",g:\"PG\",scale:\"1/60\",diff:5,price:296,priceText:\"$296\",time:\"15–22 hrs\",h:\"≈30 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"The accessible flagship PG\",loadout:\"Beam rifle, bazooka, shield, sabers, LED\",owned:true,q:\"PG Unleashed RX-78-2 Gundam\",r:\"The line's debut and the most approachable Perfect Grade — huge, clean-building, with LED gimmicks and opening maintenance hatches. An ideal repaint candidate.\",tips:[\"Swap the foil stickers for waterslide or holo decals (Delpi or G-Rework) for a big upgrade.\",\"Engineered to be easy for its size; the challenge is volume and patience, not technique.\",\"PLAN (Jul 2026): build in order with the LED unit installed during the build. Finish decision deferred to the bench \\u2014 leaning build-as-is; PGU molded color + panel line + Delpi waterslides + flat coat is a legitimate showcase finish. Buy the LED unit whenever it\\u0027s in stock, not when needed.\"]},\n  {n:\"PG Unleashed Nu Gundam\",g:\"PG\",scale:\"1/60\",diff:5,price:690,priceText:\"$600–690\",time:\"40+ hrs\",h:\"≈30 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Extreme\",goodFor:\"Grail-tier centerpiece\",loadout:\"Six fin funnels + display rack, beam rifle, shield, sabers\",owned:true,q:\"PG Unleashed Nu Gundam\",r:\"Only the second PGU kit and the most ambitious Bandai has produced — full fin-funnel flight display, metallic-detailed frame, optional psycho-frame LEDs. A flagship splurge.\",tips:[\"The separate LED unit and the display base are a big part of the appeal.\",\"Budget serious bench time and real shelf space, especially with the funnels deployed.\",\"PLAN (Jul 2026): build in order with the LED unit installed during the build. Finish decision deferred to the bench \\u2014 leaning build-as-is; PGU molded color + panel line + Delpi waterslides + flat coat is a legitimate showcase finish. Buy the LED unit whenever it\\u0027s in stock, not when needed.\"]}\n,\n  {n:\"MG Gundam Mk-II Ver 2.0 (A.E.U.G.)\",g:\"MG\",scale:\"1/100\",diff:3,price:45,priceText:\"$40–50\",time:\"8–11 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"High\",goodFor:\"AEUG hero suit, catapult diorama\",loadout:\"Beam rifle, bazooka, shield, sabers\",owned:false,q:\"MG RX-178 Gundam Mk-II Ver 2.0 AEUG\",r:\"The white AEUG colors of the Mk-II Ver 2.0 — the companion to your Titans build, with a catapult hangar display and crew figures.\",tips:[\"Build it beside the Titans Mk-II for the two-tone pair.\"]},\n  {n:\"MG Zeta Plus C1\",g:\"MG\",scale:\"1/100\",diff:4,price:60,priceText:\"$55–70\",time:\"12–16 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"Gundam Sentinel transformable\",loadout:\"Beam smart gun, shield\",owned:false,q:\"MG MSZ-006C1 Zeta Plus C1 Sentinel\",r:\"The space-use Zeta Plus from Gundam Sentinel — muted aircraft-gray colors and a huge Beam Smart Gun, with full Waverider transformation.\",tips:[\"Older mold; test-fit the transformation joints and go slow on the gates.\"]},\n  {n:\"MG ReZEL (Commander Type)\",g:\"MG\",scale:\"1/100\",diff:4,price:65,priceText:\"$60–75\",time:\"12–16 hrs\",h:\"≈20 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"Unicorn-era transformable\",loadout:\"Mega beam launcher, beam sabers, shield\",owned:true,q:\"MG RGZ-95C ReZEL Commander Type\",r:\"The commander ReZEL from Unicorn — wing-binder backpack and an enormous mega beam launcher, with complete Waverider transformation.\",tips:[\"The transformation is fiddly; dry-fit before committing.\"]},\n  {n:\"MG Delta Plus\",g:\"MG\",scale:\"1/100\",diff:3,price:55,priceText:\"$50–60\",time:\"9–13 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"High\",goodFor:\"Hyaku-Shiki-lineage transformable\",loadout:\"Long mega buster, beam sabers, shield\",owned:false,q:\"MG MSN-001A1 Delta Plus Unicorn\",r:\"Riddhe's Delta Plus from Unicorn — the Hyaku-Shiki/Delta lineage with a clean transformation to Wave Rider and a lock mechanism to hold the form.\",tips:[\"Knee joints are a touch weak; an action base helps for flight poses.\"]},\n  {n:\"MG Sinanju Stein (Narrative Ver.)\",g:\"MG\",scale:\"1/100\",diff:5,price:83,priceText:\"$80–90\",time:\"16–22 hrs\",h:\"≈19 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"Full psycho-frame Ver Ka\",loadout:\"High beam rifle/bazooka combo, beam axe, shield\",owned:true,q:\"MG Sinanju Stein Narrative Ver Ka\",r:\"The bare-frame Stein from Gundam NT — the full-psychoframe MS that led to the RX-0 line, in a weapon-rich Ver Ka with Katoki markings.\",tips:[\"Lots of Sleeves trim and decals; budget extra time for marking work.\"]},\n  {n:\"MG Full Armor Unicorn Gundam Ver Ka\",g:\"MG\",scale:\"1/100\",diff:5,price:95,priceText:\"$90–110\",time:\"20–28 hrs\",h:\"≈19 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Extreme\",goodFor:\"Flagship full-armament Unicorn\",loadout:\"9 weapon types: rifles, bazookas, gatlings, grenades, beam halberd\",owned:false,q:\"MG RX-0 Full Armor Unicorn Gundam Ver Ka\",r:\"The maxed-out Unicorn — 27+ armament pieces, translucent green psycho-frame, and battleship propellant tanks. One of the biggest MG builds going.\",tips:[\"A real project: plan paint and decals before assembling the armament rack.\"]},\n  {n:\"MG Gundam NT-1 Alex Ver 2.0\",g:\"MG\",scale:\"1/100\",diff:4,price:55,priceText:\"$50–65\",time:\"12–16 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"Very high\",goodFor:\"0080 Chobham-armor build Pre-ordered from USA Gundam (Jul 2026).\",loadout:\"Beam rifle, hyper bazooka, beam sabers, Chobham armor\",owned:false,eta:\"Q3 2026\",retailer:\"USA Gundam Store\",q:\"MG RX-78NT-1 Alex Ver 2.0 0080\",r:\"The 0080: War in the Pocket Alex Ver 2.0 — full inner-and-outer frame, articulated arm gatlings, and removable Chobham armor. Pairs perfectly with your Kampfer.\",tips:[\"Display one arm with Chobham off to show the gatling and inner frame.\"]},\n  {n:\"MG Gouf Ver 2.0\",g:\"MG\",scale:\"1/100\",diff:3,price:48,priceText:\"$45–55\",time:\"8–12 hrs\",h:\"≈18 cm\",paint:\"Optional\",gates:\"Standard\",parts:\"High\",goodFor:\"One Year War Zeon (Ramba Ral)\",loadout:\"Heat saber, heat rod, shield\",owned:true,q:\"MG MS-07B Gouf Ver 2.0\",r:\"Ramba Ral's MS-07B Gouf on the Zaku II Ver 2.0 frame — the all-blue close-combat Zeon suit with a ball-jointed heat rod. A natural shelf-mate for your Gouf Custom.\",tips:[\"The segmented heat rod poses well; paint the heat-saber edge for contrast.\"]},\n  {n:\"HGUC Psycho Gundam Mk-II\",g:\"HG\",scale:\"1/144\",diff:3,price:110,priceText:\"$100–120\",time:\"8–12 hrs\",h:\"≈27 cm\",paint:\"Optional; bits for accuracy\",gates:\"Standard\",parts:\"High\",goodFor:\"Massive Z-era centerpiece\",loadout:\"Reflector bits, arm beam swords, shield, beam effects; transforms to Mobile Fortress\",owned:false,q:\"HGUC 261 MRX-010 Psycho Gundam Mk-II\",\n   r:\"The Murasame Lab's giant Cyber-Newtype mobile armor from Zeta Gundam (Rosamia's machine) — the series' largest main MS, finally in HG some 20 years after the original Psycho Gundam. About 27 cm tall, transforms to Mobile Fortress mode, with deployable reflector bits, a half-destroyed head part, and Action Base 4 included.\",\n   tips:[\"A true centerpiece — clear shelf space before starting.\",\"Color separation is excellent; mainly the reflector bits need paint.\",\"At ~27 cm the included Action Base 4 helps hold poses.\"]},\n  {n:\"HGUC Moon Gundam\",g:\"HG\",scale:\"1/144\",diff:3,price:41,priceText:\"$37–50\",time:\"6–9 hrs\",h:\"≈13 cm\",paint:\"Optional; molded tricolor\",gates:\"Standard\",parts:\"Medium–high\",goodFor:\"Sazabi-lineage UC piece; superb posing\",loadout:\"Psycho Plate (separable 8-unit moon), beam tomahawk, beam rifle, butterfly edge ×2, Action Base 5\",owned:true,q:\"HGUC 215 AMS-123X-X Moon Gundam\",\n   r:\"AMS-123X-X — the titular suit of the Moon Gundam manga (Harutoshi Fukui story, Ippei Gyobu design), a Neo Zeon prototype in the development lineage that leads to Char's Sazabi. Modern HG engineering with no polycaps for rock-solid joints, excellent articulation, and the signature moon-shaped Psycho Plate that unfurls, separates, and recombines. Action Base 5 included.\",\n   tips:[\"No polycaps — joints stay tight and posing is a real strength.\",\"The Psycho Plate is the showpiece: clear beam parts, separable 8-unit moon.\",\"Molded in tricolor, so it's a clean panel-line-and-topcoat build.\"]},\n  {n:\"HG Varguil (Gundam Base Ltd)\",g:\"HG\",scale:\"1/144\",diff:3,price:50,priceText:\"$50 (GB exclusive)\",time:\"6–9 hrs\",h:\"≈13 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium–high\",goodFor:\"Moon Gundam precursor; GB exclusive\",loadout:\"Psycho Plate (separable 8-unit), beam tomahawk, beam rifle, butterfly edge ×2, Action Base 5\",owned:false,q:\"HG Gundam Base Limited Varguil Gundam Head Psycho Plate\",\n   r:\"AMS-123X Varguil fitted with the Psycho Gundam Mk-IV G-Doors head and Psycho Plates — the transitional 'post-repair, pre-repaint' form that becomes the Moon Gundam. A Gundam Base exclusive (2025): mechanically identical to the standard HG Moon Gundam, but molded in Varguil's purple with the head and plates in the G-Doors' colors. Neo Zeon prototype in the Sazabi development lineage.\",\n   tips:[\"Same engineering as your Moon Gundam — no polycaps, great posing.\",\"The difference is molding colors + stickers, capturing the repaired-but-unpainted look.\",\"Gundam Base / P-Bandai exclusive — keep the box; aftermarket only.\"]},\n  {n:\"MG Gundam Stormbringer P.F.\",g:\"MG\",scale:\"1/100\",diff:4,price:96,priceText:\"$96 (P-Bandai)\",time:\"12–18 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"Build Divers MG; heavily armed\",loadout:\"Full armament set, GM Turbulence alternate head, water-slide decals\",owned:true,q:\"MG Gundam Stormbringer P.F. Phantom Fang\",\n   r:\"The Phantom Fang — final form of the Stormbringer from the Gundam Build Divers 'Genius Head Line' side story. Built up from the Stormbringer F.A. with newly molded parts for a heavier-armored, heavily-armed silhouette; includes a GM Turbulence alternate head and water-slide decals. A Premium Bandai exclusive — and a non-UC (Build Divers) kit, logged as you asked.\",\n   tips:[\"P-Bandai exclusive — keep the box and the decal sheet safe.\",\"New-mold armor over the F.A. base, with lots of armament options.\",\"Build Divers timeline — off your UC focus, flagged for the record.\"]},\n  {n:\"MG Jegan (Char's Counterattack)\",g:\"MG\",scale:\"1/100\",diff:3,price:48,priceText:\"$43–48\",time:\"8–12 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"CCA Federation grunt suit\",loadout:\"Beam rifle, beam saber, shield, 4 hand sets\",owned:true,q:\"MG RGM-89 Jegan Char's Counterattack\",\n   r:\"The Federation mass-production workhorse from Char's Counterattack, on a newly-molded internal frame. An understated, military grunt suit — exactly the kind of restrained subject that rewards crisp panel lines and a satin coat. UC, your lane.\",\n   tips:[\"Newly-molded frame poses better than the old kit.\",\"Four hand sets — recreate the classic rifle-hold.\",\"Clean, low-drama build; a great palate cleanser between big kits.\"]},\n  {n:\"MG Gogg\",g:\"MG\",scale:\"1/100\",diff:3,price:42,priceText:\"$38–42\",time:\"8–10 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"One Year War Zeon amphibious\",loadout:\"Mega particle guns, extending arms, claws\",owned:true,q:\"MG MSM-03 Gogg\",\n   r:\"Zeon's mass-production amphibious MS from 0079 — a quirky, characterful break from humanoid builds. Super-flexible inner frame and those long extending arms. Cheap, fun, and a fun paint subject. UC Zeon.\",\n   tips:[\"Inner-frame arms are very poseable.\",\"Molded in color; mostly panel-line-and-topcoat.\",\"A nice change of pace from the usual humanoid silhouette.\"]},\n  {n:\"MG Char's Z'Gok\",g:\"MG\",scale:\"1/100\",diff:2,price:36,priceText:\"$33\\u201340\",time:\"6\\u20138 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Low\\u2013Medium\",goodFor:\"Char career shelf; One Year War Zeon amphibious\",loadout:\"Iron Nail claws, mega particle guns, torso missiles\",owned:true,q:\"MG MSM-07S Z'Gok Char\",\n   r:\"Char's amphibious raider from the Jaburo assault \\u2014 the suit that famously punches clean through a GM. A simple, charming 2003 mold that completes the Char MG career arc between the Zaku II and the Gelgoog. UC Zeon.\",\n   tips:[\"2003 mold \\u2014 take extra care with nubs on the curved pink armor; sand 400\\u21921000 and let primer do the rest.\",\"The jabara (accordion) arms are the signature gimmick \\u2014 don't over-stress the segments when posing.\",\"Molded in color; panel-line-and-topcoat works, but the pink/red two-tone rewards a repaint.\"]},\n  {n:\"MG Acguy\",g:\"MG\",scale:\"1/100\",diff:2,price:50,priceText:\"$45\\u201355\",time:\"6\\u20138 hrs\",h:\"\\u224819 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Jaburo amphibious trio; Zeon oddball\",loadout:\"Mega particle cannon arm, iron claws, telescoping arms\",owned:true,q:\"MG MSM-04 Acguy\",\n   r:\"The round little menace of the Jaburo infiltration \\u2014 Akahana's ride. Completes the MSM amphibious trio next to your Gogg and Z'Gok, and its 2006 mold is genuinely charming: telescoping arms, hunched mono-eye pathos. UC Zeon.\",\n   tips:[\"Telescoping arm gimmick is the star \\u2014 don't glue the segments.\",\"Molded ochre-and-rust two-tone; panel-line-and-topcoat works beautifully.\",\"Poses best hunched \\u2014 embrace the slouch.\"]},\n  {n:\"MG Zaku II Ver 2.0\",g:\"MG\",scale:\"1/100\",diff:3,price:45,priceText:\"$40\\u201350\",time:\"8\\u201310 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"The definitive Zeon grunt; army core Pre-ordered from USA Gundam (Jul 2026).\",loadout:\"Zaku machine gun, bazooka, heat hawk\",owned:false,eta:\"Q3 2026\",retailer:\"USA Gundam Store\",q:\"MG MS-06J Zaku II Ver 2.0\",\n   r:\"The mass-production green J-type \\u2014 the machine that IS Zeon. Same excellent Ver 2.0 frame as your Char's Zaku, so the second build goes twice as fast, and the green grunt next to the red commander is the most iconic pairing in the franchise. UC Zeon.\",\n   tips:[\"Identical power-pipe workflow to Char's Zaku 2.0 \\u2014 build that one first and this becomes routine.\",\"Desaturated two-green scheme is pure factory-fresh territory.\",\"GD-17 Zeon multi-use decals cover it densely.\"]},\n  {n:\"MG Guntank\",g:\"MG\",scale:\"1/100\",diff:2,price:50,priceText:\"$45\\u201355\",time:\"5\\u20137 hrs\",h:\"\\u224815 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Completes the White Base trio\",loadout:\"120mm low-recoil cannons, quad bop missile launchers\",owned:true,q:\"MG RX-75 Guntank\",\n   r:\"The third leg of the White Base stool \\u2014 you own the RX-78-2 and Guncannon in MG; this finishes Operation V on one shelf. Honest caveat: a 2009 mold, simple by modern standards \\u2014 buy it for the trio, not the engineering. UC Federation.\",\n   tips:[\"Old mold: expect visible nubs on the treads \\u2014 the 400\\u21921000 audit matters more here.\",\"Treads roll; keep them off the topcoat schedule or they'll scuff.\",\"Displays best flanking the RX-78-2 with Guncannon on the other side.\"]},\n  {n:\"HGUC Zaku II Kai (FZ)\",g:\"HG\",scale:\"1/144\",diff:2,price:19,priceText:\"$17\\u201322\",time:\"3\\u20135 hrs\",h:\"\\u224813 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Low\",goodFor:\"0080 duel pair with the NT-1 Alex\",loadout:\"MMP-80 machine gun, heat hawk, swappable A/B-type heads\",owned:false,q:\"HGUC MS-06FZ Zaku II Kai\",\n   r:\"Bernie's Zaku from War in the Pocket \\u2014 one half of 0080's devastating final duel, opposite the NT-1 Alex. A solid 2008 HGUC with the Fritz-helmet B-type head, and the single most story-loaded $18 in the index. UC Zeon.\",\n   tips:[\"Build the B-type head \\u2014 that's the one from the OVA's ending.\",\"Warm gray-green two-tone; GD-17 covers markings.\",\"Watch 0080 first. Six episodes. You'll understand.\"]},\n  {n:\"RE/100 Gundam GP04G Gerbera\",g:\"RE\",scale:\"1/100\",diff:2,price:49,priceText:\"$45\\u201352\",time:\"5\\u20137 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Completes the GP Project lineage at 1/100 Pre-ordered from USA Gundam (Jul 2026).\",loadout:\"Long-range rifle w/ beam jutte, beam rifle, shield, 3 St\\u00fcrm Boosters\",owned:false,eta:\"Q3 2026\",retailer:\"USA Gundam Store\",q:\"RE/100 RX-78 GP04G Gundam Gerbera\",\n   r:\"The cancelled fourth unit of the Gundam Development Project \\u2014 the suit that was sold off and rebuilt into Cima's crimson Gerbera Tetra. Stands at 1/100 with the GP-project kits (GP01Fb and GP03 in your reference list, GP02A wishlisted) as the lineage's hidden chapter. RE/100: MG-grade exterior, simplified frame. UC 0083.\",\n   tips:[\"The three St\\u00fcrm Boosters detach; the lower one has a landing skid that doubles as a display prop.\",\"Sticker-heavy line \\u2014 dense waterslide decaling is the natural upgrade.\",\"White/blue scheme reads as the 'before' photo of Cima's crimson Tetra \\u2014 lore gold on a shelf card.\"]},\n  {n:\"MG Rick Dias (Quattro Custom)\",g:\"MG\",scale:\"1/100\",diff:3,price:49,priceText:\"$45\\u201352\",time:\"7\\u20139 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\\u2013High\",goodFor:\"Char career lane \\u2014 the Quattro debut machine\",loadout:\"Clay bazooka, 2 beam pistols, beam saber\",owned:true,q:\"MG RMS-099 Rick Dias Quattro\",\n   r:\"Quattro Bajeena's red Rick Dias \\u2014 the machine Char returns in at the start of Zeta, stealing the Gundam Mk-II at Gryps. Fills the gap in the career lane between the Zeong and the Hyaku Shiki. Honest caveat: early-2000s MG, simple by modern standards \\u2014 buy it for the lane. UC Zeta.\",\n   tips:[\"2001-era MG \\u2014 run the full 400\\u21921000 nub audit; primer is your friend on the big red panels.\",\"The head-hatch cockpit and Vulcan phalanx cover are the mold's best gimmicks.\",\"Its red is NOT Char's 0079 red \\u2014 deeper, toward maroon; C68 Monza Red family, not C79.\"]},\n  {n:\"MG Rick Dias\",g:\"MG\",scale:\"1/100\",diff:3,price:38,priceText:\"$36\\u201342\",time:\"6\\u20138 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium (~191)\",goodFor:\"AEUG mass-production standard \\u2014 pairs w/ the red Quattro Custom\",loadout:\"Clay bazooka, beam pistol \\u00d72, beam saber\",owned:true,q:\"MG RMS-099 Rick Dias\",r:\"The standard AEUG-colors Rick Dias \\u2014 the dark gray-blue mass-production version the anti-Titans squadron flies, as opposed to Quattro\\u0027s red command unit. RMS-099 was AEUG\\u0027s first mainstay mobile suit, Zeon-derived engineering turned against the Titans. Pairs with your red Quattro Custom as the same suit in two liveries. Older ~2000 MG mold. UC Zeta.\",tips:[\"Old first-gen MG (~2000): looser fit, simpler frame, some parts drop \\u2014 your finish work hides the mediocre molded plastic.\",\"Display beside the red Quattro Custom for the standard-vs-command pair.\",\"Reads navy-charcoal (some releases cooler/purple) \\u2014 confirm your bottle before mixing.\"]},\n  {n:\"MG ZZ Gundam Ver.Ka\",g:\"MG\",scale:\"1/100\",diff:4,price:79,priceText:\"$75\\u201385\",time:\"14\\u201318 hrs\",h:\"\\u224822 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Very High\",goodFor:\"ZZ era anchor; full G-Fortress transformation\",loadout:\"Double beam rifle, hyper beam sabers, hi-mega cannon, 2 core fighters\",owned:true,q:\"MG MSZ-010 ZZ Gundam Ver.Ka\",\n   r:\"Judau's monster \\u2014 the fully transformable 2017 Ver.Ka that turns into the G-Fortress with two working core fighters. Big, heavy, and beautifully engineered; the one kit that makes the ZZ era real on a shelf. Includes a full Ver.Ka waterslide sheet. UC ZZ.\",\n   tips:[\"Transformable Ver.Ka = follow the manual exactly; the core-fighter waist lock is the kit's structural spine.\",\"Big flat panels take waterslides gorgeously \\u2014 the included sheet is dense.\",\"Poseability is honest-limited by bulk; it's a stander with presence.\"]},\n  {n:\"RE/100 Nightingale\",g:\"RE\",scale:\"1/100\",diff:3,price:97,priceText:\"$90\\u2013100\",time:\"6\\u20139 hrs\",h:\"\\u224828 cm wide\",paint:\"Optional; molded colors\",gates:\"Wedge gates\",parts:\"High\",goodFor:\"Char's final alternate machine; Hi-Nu's opposite number\",loadout:\"Mega beam rifle, beam tomahawk, shield, funnels\",owned:false,q:\"RE/100 MSN-04 II Nightingale\",\n   r:\"The Sazabi's successor from Beltorchika's Children \\u2014 Char's machine in the alternate Char's Counterattack, the crimson colossus that duels the Hi-Nu. Enormous shelf presence (wider than it is tall) and a famously easy build for its size thanks to RE/100 wedge gates. Accepts a green LED for the mono-eye. UC CCA (novel).\",\n   tips:[\"It is HUGE \\u2014 nearly 20\\\" deep with the rifle; clear shelf space before you buy.\",\"Wedge gates mean minimal nub cleanup \\u2014 fast build, all presence.\",\"Display facing the Hi-Nu Ver.Ka: the novel's final duel, both machines that never made it to film.\"]},\n  {n:\"MG Gyan\",g:\"MG\",scale:\"1/100\",diff:3,price:45,priceText:\"$44\\u201349\",time:\"7\\u20139 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"Medium\",goodFor:\"0079 Zeon one-off; M\\u0027Quve\\u0027s knight; Gelgoog\\u0027s rival\",loadout:\"LED beam rapier, missile/mine shield, 1/20 M\\u0027Quve figure\",owned:true,q:\"MG YMS-15 Gyan\",\n   r:\"M\\u0027Quve\\u0027s knight-like melee prototype from Mobile Suit Gundam ep.36 \\u2014 the close-combat rival that LOST the second-phase contract to the Gelgoog. Distinctive Pickelhaube silhouette, LED beam rapier, and a shield full of mines. A 2.0-era mold; pairs as \\u0027the one that lost vs. the one that won\\u0027 with a Gelgoog. UC Zeon.\",\n   tips:[\"Known weak point: soft ankles + heavy shield = balance fight. Pose narrow, not wide.\",\"Large plain armor panels reward restraint on decals \\u2014 don\\u0027t plaster the whole sheet (a common regret).\",\"Gold chest vents and piping are the detail-paint payoff; deep blue/silver two-tone is pure factory-fresh.\"]},\n  {n:\"MG Qubeley Mk-II (Ple)\",g:\"MG\",scale:\"1/100\",diff:3,price:50,priceText:\"$46\\u201354\",time:\"8\\u201310 hrs\",h:\"\\u224819 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"ZZ era; successor to your owned Qubeley\",loadout:\"Funnels, beam saber, beam gun\",owned:false,q:\"MG AMX-004-2 Qubeley Mk-II Ple\",\n   r:\"Elpeo Ple\\u0027s black Qubeley Mk-II from ZZ Gundam \\u2014 the tragic Cyber-Newtype\\u0027s machine, successor to Haman\\u0027s original Qubeley which you already own. Molded in gloss DEEP PURPLE with pink trim and a 1/20 Ple figure \\u2014 despite the \\u2018black Qubeley\\u2019 nickname, the plastic is purple (listings that look purple are correct). Stock no. 4543112613981 = Ple\\u0027s machine; the red/maroon-and-yellow kit is the different Ple Two variant (AMX-004-3). Gives your thin ZZ era a companion and tells the Newtype-weaponization story. UC ZZ.\",\n   tips:[\"Pairs directly with your owned Qubeley \\u2014 same lineage, black vs. white.\",\"Funnel binders are the display feature; the included stand earns its keep.\",\"Gloss-molded purple rewards a careful gloss topcoat over panel shading.\",\"Availability: 2009 kit, out of production \\u2014 US retailers sold out; buy on sight from JP resellers (eBay Osaka ~$40 ship / Solaris ~$122).\",\"Quick ID: Ple = purple + PINK trim; Ple Two = maroon + YELLOW trim. Yours is purple/pink.\"]},\n  {n:\"MG Re-GZ (Char's Counterattack)\",g:\"MG\",scale:\"1/100\",diff:3,price:48,priceText:\"$44\\u201352\",time:\"7\\u201310 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"CCA; Amuro\\u0027s backup unit, pairs w/ Nu\",loadout:\"Beam rifle, shield, beam sabers, Back Weapon System\",owned:true,q:\"MG RGZ-91 Re-GZ\",\n   r:\"Amuro\\u0027s mass-producible backup in Char\\u0027s Counterattack \\u2014 the \\u2018Nu Gundam lite\\u2019 he flies before switching to the real thing, with a transformable Back Weapon System. Completes Amuro\\u0027s CCA loadout (Re-GZ \\u2192 Nu) alongside your two Nu kits. UC 0093.\",\n   tips:[\"The Amuro pairing: display beside your Nu Ver Ka as \\u2018the backup and the real thing.\\u2019\",\"Muted blue/white/gray scheme is pure factory-fresh territory.\",\"BWS transformation is parts-formed \\u2014 plan display as one mode.\",\"Availability: current CCA release is a P-Bandai exclusive \\u2014 buy on sight, like your Marasai / Zaku Cannon.\"]},\n  {n:\"MG Zeong\",g:\"MG\",scale:\"1/100\",diff:4,price:69,priceText:\"$62–69\",time:\"12–16 hrs\",h:\"large\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"0079 finale Zeon centerpiece\",loadout:\"Funnel-hand cables, mega particle guns, display stand\",owned:true,q:\"MG MSN-02 Zeong\",\n   r:\"Char's monstrous legless psycho-MS from the final episode of 0079 — the one that fought Amuro's RX-78. Huge presence, individually-posable funnel-hand cables, included stand. A real statement piece. UC Zeon.\",\n   tips:[\"Comes with a stand to display at angles.\",\"Removable hands with cabling — pose them spread.\",\"Big shelf footprint; clear space before display.\"]},\n  {n:\"MG Psycho Zaku Ver.Ka (Thunderbolt)\",g:\"MG\",scale:\"1/100\",diff:5,price:117,priceText:\"$105–117\",time:\"18–26 hrs\",h:\"very large\",paint:\"Recommended\",gates:\"Standard\",parts:\"Very high\",goodFor:\"Expert Zeon decal showcase\",loadout:\"Beam bazooka, 3 giant bazookas, 2 Zaku MGs, heat hawks, sturm fausts, 2 stands\",owned:true,q:\"MG MS-06R Psycho Zaku Ver Ka Thunderbolt\",\n   r:\"The over-the-top Thunderbolt Psycho Zaku — Katoki's heightened MS-06R on the Zaku II 2.0 frame, dwarfed by a massive booster backpack packed with boosters, bazookas, and ammo. Your one true gap from the consensus all-time-MG list, and a famous decal-and-detail showcase. UC, Zeon, expert tier.\",\n   tips:[\"Enormous — clear ~2 ft of shelf for the booster.\",\"Vinyl pipe covers are the one tedious step; take your time.\",\"Grey weapons beg for paint — right in your wheelhouse.\",\"Verniers/skirt parts pop off in handling; pose once and leave it.\"]},\n  {n:\"MG Gelgoog Cannon\",g:\"MG\",scale:\"1/100\",diff:3,price:43,priceText:\"$38–43\",time:\"8–12 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"One Year War Zeon MSV\",loadout:\"RA-2 beam cannon, shield, arm gun, Johnny Ridden red parts\",owned:true,q:\"MG MS-14B/C Gelgoog Cannon\",\n   r:\"Zeon MSV muscle on the sturdy High-Mobility Gelgoog frame. Builds as the MS-14C cannon type or, with the included red parts, Johnny Ridden's MS-14B. Cheap, sturdy, and squarely your Zeon wheelhouse. UC.\",\n   tips:[\"Two variants in one box — pick cannon or Johnny Ridden red.\",\"Shares the well-engineered HM Gelgoog frame.\",\"Great low-cost Zeon paint canvas.\"]},\n  {n:\"MG Turn A Gundam\",g:\"MG\",scale:\"1/100\",diff:3,price:51,priceText:\"$45–51\",time:\"10–14 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"100th MG; panel-line showcase\",loadout:\"Beam rifle, beam sabers, shield, Gundam hammer, cow\",owned:true,q:\"MG WD-M01 Turn A Gundam\",\n   r:\"The 100th MG — Syd Mead's 'mustache' Gundam, famously well-engineered with no polycaps, color-accurate molding, and tons of flat surfaces for panel lining. Comes with the rare Gundam hammer and a 1/100 cow. Non-UC (Correct Century), logged for the record. Half of your Syd Mead duo.\",\n   tips:[\"No polycaps — joints stay tight.\",\"Panel-line heaven; flat panels reward the work.\",\"Two quirks: fiddly hands and a cockpit cover that pops off (dab of glue).\"]},\n  {n:\"MG Turn X\",g:\"MG\",scale:\"1/100\",diff:4,price:75,priceText:\"$67–75\",time:\"14–18 hrs\",h:\"≈18 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"Turn A rival; separation gimmick\",loadout:\"Shining Finger, beam bazooka, beam rifle, 9-part all-range stand\",owned:true,q:\"MG Concept-X 6-1-2 Turn X\",\n   r:\"Gym Ghingham's asymmetric rival to the Turn A — silver-green, X-scar chest, and a 9-part all-range-attack separation gimmick with a special mid-air display stand. The other half of your Syd Mead duo; display the two as the final-duel pair. Non-UC (Correct Century), logged for the record.\",\n   tips:[\"The 9-part separation + stand recreates the all-range attack.\",\"Asymmetric silver-green is a more involved paint job than the Turn A.\",\"Pairs with Turn A as the Syd Mead final-duel duo.\"]},\n  {n:\"MG Narrative Gundam C-Packs Ver.Ka\",g:\"MG\",scale:\"1/100\",diff:4,price:79,priceText:\"$63–79\",time:\"14–20 hrs\",h:\"≈18 cm\",paint:\"Recommended\",gates:\"Standard\",parts:\"Very high\",goodFor:\"UC NT; recent Ver.Ka mold\",loadout:\"C-equipment armor, beam weapons, gray + clear psycho-frame parts\",owned:true,q:\"MG RX-9/C Narrative Gundam C-Packs Ver Ka\",\n   r:\"The Psycho-Frame test machine from Gundam Narrative, in the recent (2024) Ver.Ka mold — Katoki gimmicks, individually-articulated fingers, and crystal-like clear psycho-frame parts (plus a gray non-active set). UC, and the screen partner to your Sinanju Stein (Narrative Ver.). Newest mold in the batch.\",\n   tips:[\"Recent mold — modern articulation and posing.\",\"Clear psycho-frame catches light; consider gloss before decals.\",\"Pairs thematically with your Sinanju Stein (Narrative).\"]},\n  {n:\"HGUC GP02A Physalis (Type-MLRS)\",g:\"HG\",scale:\"1/144\",diff:3,price:30,priceText:\"$28\\u201334\",time:\"4\\u20136 hrs\",h:\"\\u224819 cm\",paint:\"Optional; sticker color sep.\",gates:\"Standard\",parts:\"Medium\",goodFor:\"Two loadouts in one big HG\",loadout:\"6-tube MLRS backpack, atomic beam bazooka, 2 beam sabers, radiator shield\",owned:true,q:\"HGUC RX-78GP02A Physalis MLRS Type\",\n   r:\"Gato's GP02A in its rocket-rack loadout (UC 0083). Includes BOTH the MLRS backpack and the atomic beam bazooka, so one box covers both Physalis configs \\u2014 the smarter grab than the stock HG if you don't own it. A big, imposing High Grade.\",\n   tips:[\"Two-in-one: build the MLRS rocket rack OR the atomic bazooka from the same kit.\",\"MLRS launcher caps open on hinges and the pods swivel \\u2014 fun display gimmicks.\",\"One of the larger HGs \\u2014 plan an Action Base for it.\",\"Foil stickers only; topcoat to protect them. UC 0083, Zeon's Gato.\"]},\n  {n:\"MG Sinanju (Anime Ver.)\",g:\"MG\",scale:\"1/100\",diff:5,price:88,priceText:\"$85\\u2013100\",time:\"12\\u201318 hrs\",h:\"\\u224820 cm\",paint:\"Optional; molded red\",gates:\"Standard\",parts:\"High (~424)\",goodFor:\"Full Frontal's crimson flagship\",loadout:\"Beam rifle + grenade launcher, beam axe/sabers, shield, OVA rocket bazooka\",owned:true,q:\"MG MSN-06S Sinanju Anime Ver\",\n   r:\"Full Frontal's Sinanju (UC 0096, the Sleeves). The OVA/Anime Ver. of the MG \\u2014 updated weapons over the old Ver.Ka, with the episode-6 rocket bazooka. Comes with BOTH waterslide decals and foil stickers. A big, gorgeous red Neo Zeon flagship and a decal-heavy showcase.\",\n   tips:[\"Ships with waterslide decals AND foil stickers \\u2014 use the waterslides for the Sleeves gold engraving.\",\"Body is a two-red mix (Monza Red + Red, both owned); gold trim is C9 + Clear Yellow.\",\"~424 parts \\u2014 a long, rewarding build; plan an Action Base.\",\"UC 0096, the Sleeves. Pairs with your Sinanju Stein (Narrative).\"]},\n  {n:\"MG Gundam Barbatos Lupus\",g:\"MG\",scale:\"1/100\",diff:3,price:67,priceText:\"$67\\u201384\",time:\"8\\u201312 hrs\",h:\"\\u224818 cm\",paint:\"Optional; molded colors\",gates:\"Standard\",parts:\"High\",goodFor:\"IBO showpiece \\u2014 exposed frame\",loadout:\"Sword Mace, 110mm arm cannon, forearm rocket launchers\",owned:true,q:\"MG ASW-G-08 Gundam Barbatos Lupus\",\n   r:\"Your first Post Disaster frame and first non-UC kit \\u2014 Mikazuki\\u0027s beast from Iron-Blooded Orphans S2, released Dec 2025. Expands the original MG Barbatos frame with a fuller anime-accurate inner frame; that exposed musculature is a paradise for tech decals and a metallic frame. Molded in color, but you\\u0027ll spray it factory-fresh. Post Disaster.\",\n   tips:[\"Watch the fragile side-skirt hip connection \\u2014 don\\u0027t stress that small hip joint.\",\"Delicate silver piston parts can snap; go careful cutting those.\",\"Exposed frame rewards a metallic base + panel lining before the armor goes on.\"]}\n];\nconst MISC_KITS = [\n  {n:\"Mega Man X3 \\u2014 Max Armor (Triad Thunder Ver.)\", brand:\"Kotobukiya\", franchise:\"Mega Man X\", scale:\"1/12\", price:\"$72 (was $90)\", owned:true, img:\"https://cdn.shopify.com/s/files/1/2786/5582/files/kbykp-654_0_clipped.png?v=1732654699\", note:\"Kotobukiya pre-painted, articulated 1/12 plastic kit (Oct 2024). Mega Man X3\\u0027s Max/Third Armor in the Triad Thunder colorway \\u2014 includes the series\\u0027 largest effect part (Triad Thunder), arm extensions, swappable neck/waist/hands/face, updated Force-Armor shoulders, and bonus or ).replace(/>/g,\"&gt;\");}\n  function row(k){\n    var sg=slug(k.n);\n    var img=(typeof IMG!==\"undefined\"&&IMG[sg])?IMG[sg]:\"\";\n    var tl=(typeof TL!==\"undefined\"&&TL[sg])?TL[sg]:\"\\u2014\";\n    var bo=(typeof BUILD_ORDER!==\"undefined\"&&BUILD_ORDER[k.n])?(' <span class=\"ref-bo\">#'+BUILD_ORDER[k.n]+'<\/span>'):'';\n    var im=img?('<img class=\"zoomable\" data-name=\"'+esc(k.n)+'\" src=\"'+img+'\" alt=\"\" loading=\"lazy\" onerror=\"this.remove()\">'):'';\n    return '<div class=\"ref-row\">'\n      +'<span class=\"ref-thumb\"><span class=\"ph g-'+k.g+'\">'+k.g+'<\/span>'+im+'<\/span>'\n      +'<span class=\"ref-gb g-'+k.g+'\">'+k.g+'<\/span>'\n      +'<span class=\"ref-name\">'+esc(k.n)+bo+'<\/span>'\n      +'<span class=\"ref-tl\">'+esc(tl)+'<\/span>'\n      +'<span class=\"ref-scale\">'+esc(k.scale||'')+'<\/span>'\n      +'<\/div>';\n  }\n  var html='<div class=\"ref-row ref-head\"><span><\/span><span>Grade<\/span><span>Model<\/span><span>Timeline<\/span><span>Scale<\/span><\/div>';\n  groups.forEach(function(gp){\n    var arr=by[gp[0]]; if(!arr.length) return;\n    html+='<div class=\"ref-group\"><h3 class=\"ref-h s-'+gp[0]+'\">'+gp[1]+' <span class=\"ref-c\">'+arr.length+'<\/span><\/h3><div class=\"ref-list\">';\n    arr.forEach(function(k){ html+=row(k); });\n    html+='<\/div><\/div>';\n  });\n  var body=document.getElementById(\"referenceBody\"); if(body) body.innerHTML=html;\n  var sum=document.getElementById(\"refSummary\"); if(sum) sum.textContent=KITS.length+\" kits tracked\";\n}\n(function(){\n  function init(){\n    var rc=document.getElementById(\"tabCountReference\"); if(rc&&typeof KITS!==\"undefined\") rc.textContent=KITS.length;\n    try{ renderReference(); }catch(e){}\n    var rb=document.getElementById(\"referenceBody\");\n    if(rb && !rb.__lbBound){\n      rb.__lbBound=true;\n      rb.addEventListener(\"click\",function(e){\n        var img=(e.target&&e.target.closest)?e.target.closest(\".ref-thumb img\"):null;\n        if(img&&typeof openLightbox===\"function\") openLightbox(img.src, img.getAttribute(\"data-name\")||\"\");\n      });\n    }\n  }\n  if(document.readyState!==\"loading\") setTimeout(init,200);\n  else document.addEventListener(\"DOMContentLoaded\",function(){setTimeout(init,200);});\n})();\n<\/script>\n<\/body><\/html>"</script>
